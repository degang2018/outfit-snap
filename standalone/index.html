        <!-- 每个节点左右两侧的加号:鼠标经过节点才显示;点一下加节点,拖动连线 -->
        <template v-for="n in canvasShotNodes" :key="'plus-shot-' + n.shot.id">
          <button class="node-plus" :class="{ show: plusVisible('shot:' + n.shot.id) }"
                  :style="plusStyle('shot:' + n.shot.id, 'left')"
                  title="点击添加节点 · 拖动连线"
                  @pointerenter="plusEnter('shot:' + n.shot.id)"
                  @pointerleave="plusLeave('shot:' + n.shot.id)"
                  @pointerdown.stop.prevent="startPlus($event, 'shot:' + n.shot.id, 'left')">+</button>
          <button class="node-plus" :class="{ show: plusVisible('shot:' + n.shot.id) }"
                  :style="plusStyle('shot:' + n.shot.id, 'right')"
                  title="点击添加节点 · 拖动连线"
                  @pointerenter="plusEnter('shot:' + n.shot.id)"
                  @pointerleave="plusLeave('shot:' + n.shot.id)"
                  @pointerdown.stop.prevent="startPlus($event, 'shot:' + n.shot.id, 'right')">+</button>
        </template>
        <template v-for="n in canvas.customNodes" :key="'plus-custom-' + n.id">
          <button class="node-plus" :class="{ show: plusVisible('custom:' + n.id) }"
                  :style="plusStyle('custom:' + n.id, 'left')"
                  title="点击添加节点 · 拖动连线"
                  @pointerenter="plusEnter('custom:' + n.id)"
                  @pointerleave="plusLeave('custom:' + n.id)"
                  @pointerdown.stop.prevent="startPlus($event, 'custom:' + n.id, 'left')">+</button>
          <button class="node-plus" :class="{ show: plusVisible('custom:' + n.id) }"
                  :style="plusStyle('custom:' + n.id, 'right')"
                  title="点击添加节点 · 拖动连线"
                  @pointerenter="plusEnter('custom:' + n.id)"
                  @pointerleave="plusLeave('custom:' + n.id)"
                  @pointerdown.stop.prevent="startPlus($event, 'custom:' + n.id, 'right')">+</button>
        </template>
        <template v-for="g in canvasRefNodes" :key="'plus-ref-' + g.key">
          <button class="node-plus" :class="{ show: plusVisible(g.key) }"
                  :style="plusStyle(g.key, 'left')"
                  title="点击添加节点 · 拖动连线"
                  @pointerenter="plusEnter(g.key)"
                  @pointerleave="plusLeave(g.key)"
                  @pointerdown.stop.prevent="startPlus($event, g.key, 'left')">+</button>
          <button class="node-plus" :class="{ show: plusVisible(g.key) }"
                  :style="plusStyle(g.key, 'right')"
                  title="点击添加节点 · 拖动连线"
                  @pointerenter="plusEnter(g.key)"
                  @pointerleave="plusLeave(g.key)"
                  @pointerdown.stop.prevent="startPlus($event, g.key, 'right')">+</button>
        </template>

        <!-- + 添加分镜节点 -->
        <div class="add-node" :style="addNodeStyle()" @pointerdown.stop @click="openAddGeneral">
          <span style="font-size:20px;line-height:1">+</span>
          <span>添加通用分镜</span>
        </div>
      </div>

      <div class="canvas-tools">
        <button class="ghost" title="缩小" @click="zoomBy(0.9)">−</button>
        <span class="zoom-pill">{{ Math.round(canvas.zoom * 100) }}%</span>
        <button class="ghost" title="放大" @click="zoomBy(1.1)">+</button>
        <button class="ghost" @click="fitCanvas">适应</button>
        <button class="ghost" @click="autoLayout">重排</button>
      </div>
      <div class="canvas-hint">拖空白平移 · 滚轮缩放 · Ctrl+拖框选 · 点节点预览编辑 · 悬停连线中段 / 双击 / 右键都能删线</div>
      <div v-if="canvas.marquee" class="marquee"
           :style="{left: canvas.marquee.x + 'px', top: canvas.marquee.y + 'px',
                    width: canvas.marquee.w + 'px', height: canvas.marquee.h + 'px'}"></div>
      <svg v-if="canvas.link" class="canvas-link-temp" aria-hidden="true">
        <line :x1="canvas.link.sx" :y1="canvas.link.sy" :x2="canvas.link.x" :y2="canvas.link.y"></line>
      </svg>
      <svg v-if="canvas.plusDrag && canvas.plusDrag.moved" class="canvas-link-temp" aria-hidden="true">
        <line :x1="canvas.plusDrag.sx" :y1="canvas.plusDrag.sy"
              :x2="canvas.plusDrag.x" :y2="canvas.plusDrag.y"></line>
      </svg>
    </div>

    <!-- 底部创作面板:点节点后出现 -->
    <div v-if="composer.open && shot && draft" class="composer" :class="{'with-drawer': showAssets}">
      <div class="composer-head">
        <div class="composer-thumb" title="查看大图 / 视频" @click="openLightboxShot(shot)">
          <img v-if="shot.clip_url && shot.thumb_url" :src="shot.thumb_url" />
          <video v-else-if="shot.clip_url" :src="shot.clip_url" muted preload="metadata"></video>
          <img v-else-if="shot.preview_url" :src="shot.preview_url" />
          <div v-else class="ph">未生成</div>
          <span class="idx">#{{ shot.idx }}</span>
        </div>
        <div class="composer-refs">
          <div v-for="(r,i) in draft.refs" :key="r + i" class="composer-ref"
               :class="{dragging: refDrag === i, over: refOver === i && refDrag !== i}"
               draggable="true"
               :title="(refInfo[r] ? refInfo[r].filename : r) + ' · 点击查看大图；拖动可排序，也可拖进下方提示词'"
               @click.stop="openRefPreview(r)"
               @dragstart="startRefDrag($event, i)"
               @dragover.prevent="refOver = i"
               @dragleave="refOver = refOver === i ? -1 : refOver"
               @drop.prevent="dropRefChip($event, i)"
               @dragend="refDrag = null; refOver = -1">
            <img v-if="refInfo[r] && refInfo[r].url" :src="refInfo[r].url" draggable="false"
                 @error="$event.target.style.display='none'" />
            <div v-else style="width:100%;height:100%"></div>
            <span class="num">{{ i + 1 }}</span>
            <span v-if="refRoleLabel(i)" class="ref-role">{{ refRoleLabel(i) }}</span>
            <span v-if="draft.mode === 'first' || draft.mode === 'first_last'" class="ref-actions">
              <button v-if="i !== 0" title="把这张设为首帧" @click.stop="setRefRole(i, 'first')">首</button>
              <button v-if="draft.mode === 'first_last' && i !== 1" title="把这张设为尾帧" @click.stop="setRefRole(i, 'last')">尾</button>
            </span>
            <button title="移除参考图" @click.stop="removeRef(i)">×</button>
          </div>
          <!-- 换装链尾帧:生成时自动追加的第 N 张参考图,只读 -->
          <div v-if="styleRef.url" class="composer-ref style-ref"
               :title="'换装链最后一镜的尾帧 · 自动作为 <Picture ' + styleRef.picture + '> 喂给模型 · 点击查看大图'"
               @click.stop="openLightboxImage(styleRef.url, '换装链尾帧')">
            <img :src="styleRef.url" draggable="false" />
            <span class="num">{{ styleRef.picture }}</span>
            <span class="ref-role">样式</span>
            <span class="style-lock">自动</span>
          </div>
          <label class="composer-add" title="上传参考图">
            +
            <input type="file" accept="image/*" style="display:none" @change="addRef" />
          </label>
          <button class="composer-add" title="从素材库添加" @click="openAssets">▦</button>
          <button class="composer-add" title="输入 @ 引用图片 / 人物" @click="openMentionFromButton">@</button>
        </div>
        <span class="spacer"></span>
        <span v-if="dirty" class="badge" style="color:var(--warn);border-color:#5a4a1c">未保存</span>
        <button class="ghost" title="关闭面板" @click="closeComposer">×</button>
      </div>
      <div ref="promptEditor" class="composer-prompt rich-prompt"
           :class="{dropping: dragOver}"
           contenteditable="true"
           data-placeholder="描述这一镜的画面和动作… 输入 @ 可以引用图片/人物,也可以把上面的参考图拖进来"
           @input="onPromptInput"
           @keydown="onPromptKeydown"
           @keyup="savePromptCaret"
           @mouseup="savePromptCaret"
           @click="onPromptClick"
           @focus="savePromptCaret"
           @blur="onPromptBlur"
           @dragover.prevent="promptDragOver"
           @dragleave="dragOver = false"
           @drop.prevent="dropPrompt"></div>
      <div class="composer-bar">
        <select v-model="draft.mode" @change="markDirty" :title="modeHint">
          <option v-for="m in modes" :key="m.v" :value="m.v">{{ m.t }}</option>
        </select>
        <label class="mini">时长
          <input type="number" min="0.2" max="25" step="0.1" v-model.number="draft.sec" @input="markDirty" />s
        </label>
        <label class="mini">种子
          <input type="number" min="1" step="1" v-model.number="draft.options.seed" @input="onSeedInput" placeholder="留空=每次随机" />
        </label>
        <label class="mini">抽卡
          <select v-model.number="drawCount" :disabled="anyBusy">
            <option v-for="n in [1,2,3,4,6,8]" :key="n" :value="n">{{ n }}</option>
          </select>
        </label>
        <label v-if="drawCount > 1" class="mini" title="默认按种子递增;勾选则每张随机">
          <input type="checkbox" v-model="drawRandomSeed" :disabled="anyBusy" style="width:auto" /> 随机种子
        </label>
        <span class="mini">{{ project.out_width }}×{{ project.out_height }} · {{ project.fps }}fps</span>
        <label class="mini" title="关掉后这一镜不参与整片生成">
          <input type="checkbox" v-model="draft.enabled" style="width:auto" @change="markDirty" /> 参与生成
        </label>
        <span class="spacer"></span>
        <button class="ghost camera-btn" :class="{on: !!draft.options.camera}" @click="openCamera"
                title="多角度 / 调整摄像机机位">
          ⌖ 多角度<span v-if="cameraSummary" class="camera-sum"> · {{ cameraSummary }}</span>
        </button>
        <button class="ghost" :disabled="optimizing || condensing" @click="composerOptimize">{{ optimizing ? '优化中…' : 'AI 优化' }}</button>
        <button class="ghost" :disabled="condensing" @click="condensePrompt">{{ condensing ? '精简中…' : '精简' }}</button>
        <button class="ghost" :class="{on: finalPrompt.open}" @click="toggleFinalPrompt"
                title="查看真正发给模型的完整文案（含机位、上一镜末帧等）">最终文案</button>
        <button v-if="shot && shot.options && shot.options.static_image" class="ghost"
                title="涂一块区域 + 写一句要求,只重绘这块,其余像素不动"
                @click="openStaticRerender(shot)">涂抹重渲</button>
        <button class="ghost" :disabled="saving || !dirty" @click="saveDraft">{{ saving ? '保存中…' : (dirty ? '保存' : '已保存') }}</button>
        <button class="primary send" :disabled="anyBusy" :title="shotBusy ? '生成中' : '生成'" @click="composerGenerate">
          {{ shotBusy ? '…' : '↑' }}
        </button>
      </div>
      <!-- 最终文案:真正发给模型的完整提示词(只读) -->
      <div v-if="finalPrompt.open" class="final-prompt-box">
        <div class="fp-head">
          <strong>最终发给模型的文案</strong>
          <span v-if="finalPrompt.notes.length" class="small muted">· {{ finalPrompt.notes.join(' · ') }}</span>
          <span class="small muted">· {{ finalPrompt.refs }} 张参考图</span>
          <span class="spacer"></span>
          <button class="ghost small" :disabled="finalPrompt.loading" @click="loadFinalPrompt">
            {{ finalPrompt.loading ? '读取中…' : '刷新' }}
          </button>
          <button class="ghost small" :disabled="!finalPrompt.text" @click="copyFinalPrompt">复制</button>
          <button class="ghost small" @click="finalPrompt.open = false">收起</button>
        </div>
        <pre class="fp-text">{{ finalPrompt.loading ? '正在读取最终文案…' : finalPrompt.text }}</pre>
        <div v-for="(w, wi) in finalPrompt.warnings" :key="'w' + wi" class="small"
             style="margin-top:5px;color:var(--warn)">⚠ {{ w }}</div>
        <div v-if="dirty" class="small muted">有未保存修改时点「刷新」会先保存，再按保存后的内容重新拼文案。</div>
      </div>
      <div v-if="draft.mode === 'first'" class="small muted" style="margin-top:6px">
        首帧 = 第 1 张参考图：拖动参考图排序，或把鼠标移到图上点「首」即可指定。
      </div>
      <div v-if="draft.mode === 'first_last'" class="small muted" style="margin-top:6px">
        首帧 = 第 1 张，尾帧 = 第 2 张：拖动参考图排序，或点图上的「首」/「尾」直接指定。
      </div>
      <div v-if="optimizeMsg" class="small muted" style="margin-top:6px">{{ optimizeMsg }}</div>
      <div v-if="shotJob" class="composer-foot">
        <span class="small muted">{{ shotJob.message || statusText[shotJob.status] }}</span>
        <div class="progress" :class="{indet: ['queued','running'].includes(shotJob.status)}">
          <i :style="{width: (shotJob.progress || 0) + '%'}"></i>
        </div>
        <button v-if="shotBusy" class="danger" @click="cancelShot">终止</button>
      </div>
      <div v-if="shot.candidates && shot.candidates.length" class="composer-cands">
        <div v-for="(c,i) in shot.candidates" :key="c" class="cand-mini" :class="{on: c === shot.clip_url}">
          <img v-if="isImageUrl(c)" :src="c" loading="lazy" decoding="async"
               @click="openLightboxVideo(c, '候选 #' + (i + 1))" />
          <img v-else-if="shot.candidate_thumbs && shot.candidate_thumbs[i]"
               :src="shot.candidate_thumbs[i]" loading="lazy" decoding="async"
               @click="openLightboxVideo(c, '候选 #' + (i + 1))" />
          <video v-else :src="c" muted preload="none" @click="openLightboxVideo(c, '候选 #' + (i + 1))"></video>
          <span v-if="!isImageUrl(c) && shot.candidate_thumbs && shot.candidate_thumbs[i]" class="cand-play">▶</span>
          <span class="tag">#{{ i + 1 }}</span>
          <button v-if="c !== shot.clip_url" class="use" @click.stop="pickCandidate(c)">用这张</button>
          <button v-else class="use" style="color:var(--ok);border-color:rgba(63,207,149,.4)" @click.stop="openLightboxVideo(c, '当前选用')">已选用</button>
        </div>
      </div>
      <div v-if="candMsg" class="small"
           :style="{marginTop: '6px', color: candMsg.indexOf('失败') === 0 ? 'var(--err)' : 'var(--ok)'}">{{ candMsg }}</div>
      <div v-if="shot.clip_url" class="small muted" style="margin-top:7px;display:flex;align-items:center;gap:10px">
        <span>当前片段已就绪</span>
        <a :href="shot.clip_url" download class="small">下载</a>
        <button class="ghost small" @click="openLightboxShot(shot)">预览</button>
      </div>
    </div>

    <!-- @ 引用选择器(放在 composer 外层,避免 backdrop-filter 把 fixed 定位困在面板里) -->
    <div v-if="mentionOpen" class="mention-pop"
         :style="{left: mentionPos.x + 'px', bottom: mentionPos.y + 'px'}"
         @mousedown.prevent>
      <div class="mention-head">
        <span>引用参考图</span>
        <span class="muted">{{ mentionQuery ? '@' + mentionQuery : '全部' }}</span>
      </div>
      <div class="mention-list">
        <button v-for="(it,i) in mentionItems" :key="it.ref" type="button" class="mention-item"
                :class="{on: i === mentionIndex}"
                @mouseenter="mentionIndex = i"
                @mousedown.prevent
                @click.stop.prevent="pickMention(it)">
          <img v-if="it.url" :src="it.url" alt="" />
          <span v-else class="mention-ph">{{ (it.name || '?').slice(0, 1) }}</span>
          <span class="mention-name">{{ it.name }}</span>
          <span class="mention-group">{{ it.group }}</span>
        </button>
        <div v-if="!mentionItems.length" class="mention-empty">没有匹配的图片</div>
      </div>
    </div>

    <!-- 多角度编辑:控制摄像机位置 -->
    <div v-if="cameraModal && shot && draft" class="mask camera-mask" @click.self="closeCamera">
      <div class="camera-modal">
        <div class="camera-head">
          <strong>多角度编辑</strong>
          <span class="small muted">镜头 {{ shot.idx }} · {{ shot.title || shot.key }}</span>
          <span class="spacer"></span>
          <button class="ghost small" @click="cameraReset">重置参数 ↻</button>
          <button class="ghost" title="关闭" @click="closeCamera">×</button>
        </div>

        <div class="camera-body">
          <div class="camera-stage" :class="{dragging: cameraDrag}"
               @pointerdown="startCameraDrag" @wheel.prevent="cameraWheel">
            <svg class="camera-sphere" viewBox="0 0 420 420" aria-hidden="true">
              <ellipse cx="210" cy="210" rx="150" ry="150"></ellipse>
              <ellipse cx="210" cy="210" rx="150" ry="52"></ellipse>
              <ellipse cx="210" cy="210" rx="52" ry="150"></ellipse>
              <ellipse class="axis" cx="210" cy="210" rx="112" ry="38"></ellipse>
              <ellipse class="axis" cx="210" cy="210" rx="38" ry="112"></ellipse>
              <line class="axis" x1="210" y1="40" x2="210" y2="380"></line>
              <line class="axis" x1="40" y1="210" x2="380" y2="210"></line>
            </svg>
            <button class="camera-orb-btn up" title="抬高机位" @pointerdown.stop @click="nudgeCamera(0, 15)">︿</button>
            <button class="camera-orb-btn down" title="降低机位" @pointerdown.stop @click="nudgeCamera(0, -15)">﹀</button>
            <button class="camera-orb-btn left" title="向左环绕 45°" @pointerdown.stop @click="nudgeCamera(-45, 0)">‹</button>
            <button class="camera-orb-btn right" title="向右环绕 45°" @pointerdown.stop @click="nudgeCamera(45, 0)">›</button>
            <div class="camera-cube back"></div>
            <div class="camera-cube">
              <img v-if="shot.clip_url && isImageUrl(shot.clip_url)" :src="shot.clip_url" alt="静态图" />
              <video v-else-if="shot.clip_url && !shot.preview_url" :src="shot.clip_url" muted preload="metadata"></video>
              <img v-else-if="shot.preview_url" :src="shot.preview_url" />
              <div v-else class="ph">
                当前镜头<br>还没有预览图<br>
                <span style="opacity:.65">机位会写进提示词</span>
              </div>
            </div>
            <!-- 机位层单独放在预览卡片之上,摄像机绕到卡片后面也不会被挡住 -->
            <svg class="camera-rig-layer" viewBox="0 0 420 420" aria-hidden="true">
              <line class="line" x1="210" y1="210" :x2="cameraDot.x" :y2="cameraDot.y"></line>
              <circle cx="210" cy="210" r="3.5" fill="rgba(255,255,255,.75)" stroke="none"></circle>
              <!-- 可拖动的摄像机:镜头始终朝向画面中心 -->
              <g class="camera-rig" :transform="'translate(' + cameraDot.x + ',' + cameraDot.y + ') rotate(' + cameraFacing + ')'">
                <circle r="21" fill="rgba(108,140,255,.13)" stroke="rgba(108,140,255,.38)" stroke-width="1"></circle>
                <rect x="-16" y="-10" width="26" height="20" rx="4" fill="#2b3240"
                      stroke="rgba(226,233,246,.88)" stroke-width="1.2"></rect>
                <rect x="-13" y="-15" width="11" height="5" rx="2" fill="#2b3240"
                      stroke="rgba(226,233,246,.88)" stroke-width="1.2"></rect>
                <rect x="9" y="-6" width="8" height="12" rx="2" fill="#202633"
                      stroke="rgba(226,233,246,.88)" stroke-width="1.2"></rect>
                <circle cx="17" cy="0" r="6" fill="#0b0e14"
                        stroke="rgba(226,233,246,.92)" stroke-width="1.2"></circle>
                <circle cx="17" cy="0" r="2.6" fill="#6c8cff"></circle>
                <rect x="6" y="-8" width="5" height="3" rx="1" fill="rgba(226,233,246,.5)" stroke="none"></rect>
              </g>
            </svg>
            <div class="camera-stage-label">
              <div>水平 {{ cameraDraft.azimuth }}° · 垂直 {{ cameraDraft.elevation }}° ·
                {{ Number(cameraDraft.distance).toFixed(1) }} 米 · {{ cameraSizeLabel }}</div>
              <div class="camera-drag-hint">按住圆球或画面拖动调整机位 · 滚轮调距离</div>
            </div>
          </div>

          <div class="camera-controls">
            <div class="camera-title">人物朝向</div>
            <div class="camera-modes">
              <button :class="{on: cameraDraft.subject_mode !== 'follow'}"
                      @click="cameraDraft.subject_mode = 'fixed'">
                <strong>人朝正前方</strong>
                <span>镜头绕人转，会看到侧面 / 背面</span>
              </button>
              <button :class="{on: cameraDraft.subject_mode === 'follow'}"
                      @click="cameraDraft.subject_mode = 'follow'">
                <strong>人始终对着镜头</strong>
                <span>镜头怎么转，画面都是正面</span>
              </button>
            </div>

            <div class="camera-title">摄像机方位</div>
            <div class="camera-presets">
              <button v-for="p in cameraPresets" :key="p.k" :class="{on: cameraPresetActive(p)}"
                      @click="applyCameraPreset(p)">
                <span class="arw">{{ p.arw }}</span>{{ p.t }}
              </button>
            </div>

            <div class="camera-slider">
              <label><span>水平</span><b>{{ cameraDraft.azimuth }}°</b></label>
              <input type="range" min="0" max="360" step="1" v-model.number="cameraDraft.azimuth" />
              <div class="ticks">
                <span v-for="t in [0,45,90,135,180,225,270,315,360]" :key="t">{{ t }}</span>
              </div>
            </div>

            <div class="camera-slider">
              <label><span>垂直</span><b>{{ cameraDraft.elevation }}°</b></label>
              <input type="range" min="-30" max="60" step="1" v-model.number="cameraDraft.elevation" />
              <div class="ticks"><span>-30</span><span>0</span><span>30</span><span>60</span></div>
            </div>

            <div class="camera-slider">
              <label><span>摄像机距离</span>
                <b>{{ Number(cameraDraft.distance).toFixed(1) }} 米 · {{ cameraSizeLabel }}</b></label>
              <input type="range" min="1" max="10" step="0.1" v-model.number="cameraDraft.distance" />
              <div class="ticks"><span>1 米</span><span>3</span><span>5</span><span>7</span><span>10 米</span></div>
            </div>

            <div class="camera-note">
              当前机位：{{ cameraLabel(cameraDraft) }}。生成时会自动写进这一镜的提示词；机位固定，不推拉摇移、不变焦。
              距离按普通 35–50mm 镜头估算：1–2 米特写 / 近景，3–5 米中景，6–8 米全身。
            </div>
          </div>
        </div>

        <div class="camera-foot">
          <span class="small muted">应用后会标记为未保存；「应用并生成」会自动保存并开始生成。</span>
          <span class="spacer"></span>
          <button class="ghost" :disabled="!draft.options.camera" @click="cameraClear">清除角度</button>
          <button @click="cameraApply(false)">仅应用</button>
          <button class="primary" :disabled="anyBusy" @click="cameraApply(true)">应用并生成</button>
        </div>
      </div>
    </div>

    <!-- 图片节点创作面板 -->
    <div v-if="customComposer.open" class="image-composer">
      <div class="ic-head">
        <div class="ic-thumb">
          <img v-if="customComposerNode && (customComposerNode.url || (customComposerNode.images && customComposerNode.images.length))"
               :src="customComposerNode.images && customComposerNode.images.length
                 ? customComposerNode.images[customComposerNode.imageIndex || 0]
                 : customComposerNode.url" />
          <span v-else>▢</span>
        </div>
        <div class="ic-title">{{ customComposerNode ? (customComposerNode.title || '图片节点') : '图片节点' }}</div>
        <span class="spacer"></span>
        <span class="small muted">SDXL 预览模型</span>
        <button class="ghost small" @click="customComposer.open = false">×</button>
      </div>
      <div class="ic-prompt">
        <button class="ic-plus" title="上传一张图片作为节点内容"
                @click="customComposerNode && pickCustomFile(customComposerNode, 'image')">+</button>
        <textarea v-model="customComposer.prompt"
                  placeholder="上传参考图、输入文字，描述你想生成的图片"></textarea>
      </div>
      <div class="ic-foot">
        <select v-model="customComposer.aspect">
          <option value="16:9">16:9</option>
          <option value="1:1">1:1</option>
          <option value="9:16">9:16</option>
          <option value="3:4">3:4</option>
        </select>
        <select v-model="customComposer.resolution">
          <option value="1K">1K</option>
          <option value="2K">2K</option>
        </select>
        <select v-model.number="customComposer.count">
          <option :value="1">1 张</option>
          <option :value="2">2 张</option>
          <option :value="3">3 张</option>
          <option :value="4">4 张</option>
        </select>
        <button class="ghost small" @click="openRepair">局部修理</button>
        <span v-if="customComposer.err" class="small" style="color:var(--err)">{{ customComposer.err }}</span>
        <span class="spacer"></span>
        <button class="primary" :disabled="customComposer.busy || !customComposer.prompt.trim()"
                @click="generateImageNode">{{ customComposer.busy ? '生成中…' : '生成' }}</button>
      </div>
    </div>

    <!-- 图片节点 · 局部修理(涂抹重绘) -->
    <div v-if="repair.open" class="inpaint-mask"
         @click.self="!repair.busy && (repair.open = false)">
      <div class="inpaint-box">
        <div class="inpaint-head">
          <strong>局部修理</strong>
          <span class="small muted">涂抹要改的地方，只重绘涂抹区域，其余像素不动</span>
          <span class="spacer"></span>
          <button class="ghost small" :disabled="repair.busy" @click="repair.open = false">×</button>
        </div>
        <div class="inpaint-picks">
          <button :class="{ on: repair.kind === 'remove' }" @click="repairPreset('remove')">去物 / 补背景</button>
          <button :class="{ on: repair.kind === 'edit' }" @click="repairPreset('edit')">按描述改局部</button>
          <button :class="{ on: repair.kind === 'retouch' }" @click="repairPreset('retouch')">修脸 / 修手 / 去瑕疵</button>
          <button :class="{ on: repair.kind === 'recolor' }" @click="repairPreset('recolor')">换图案 / 换色</button>
        </div>
        <div class="inpaint-stage">
          <img ref="repairImg" :src="repairImage" @load="initRepairCanvas" />
          <canvas ref="repairCanvas"
                  @pointerdown="repairDown" @pointermove="repairMove"
                  @pointerup="repairUp" @pointercancel="repairUp"></canvas>
        </div>
        <div class="inpaint-tools">
          <label>笔刷 <input type="range" min="8" max="140" v-model.number="repair.brush" /></label>
          <button class="ghost small" :class="{ on: repair.erasing }"
                  @click="repair.erasing = !repair.erasing">{{ repair.erasing ? '橡皮 · 开' : '橡皮' }}</button>
          <button class="ghost small" @click="repairUndo">撤销</button>
          <button class="ghost small" @click="repairClear">清空</button>
          <span class="tip">在图上按住拖动涂抹，涂完写一句要求再开始</span>
        </div>
        <div class="inpaint-prompt">
          <textarea ref="repairPrompt" v-model="repair.prompt"
                    placeholder="例：去掉这块的插头，用桌面补全；把这里改成白色蕾丝；修掉脸上的瑕疵"></textarea>
        </div>
        <div class="inpaint-foot">
          <label class="small muted" style="display:flex;align-items:center;gap:6px">
            步数
            <input type="range" min="12" max="40" step="2" v-model.number="repair.steps" style="width:100px" />
            <span>{{ repair.steps }}</span>
          </label>
          <span v-if="repair.err" class="small" style="color:var(--err)">{{ repair.err }}</span>
          <span class="spacer"></span>
          <button class="ghost" :disabled="repair.busy" @click="repair.open = false">取消</button>
          <button class="primary" :disabled="repair.busy || !repair.hasMask" @click="runRepair">
            {{ repair.busy ? '修理中…' : '开始修理' }}
          </button>
        </div>
      </div>
    </div>

    <!-- 静态图分镜(piece_style='static')「涂抹重渲」:涂 mask + 新指令 → 覆盖该镜 PNG -->
    <div v-if="staticRr.open" class="inpaint-mask"
         @click.self="!staticRr.busy && (staticRr.open = false)">
      <div class="inpaint-box">
        <div class="inpaint-head">
          <strong>静态图涂抹重渲 · {{ (staticRr.shot && (staticRr.shot.title || staticRr.shot.key)) || '' }}</strong>
          <span class="small muted">涂要改的地方,只重绘涂抹区域,其余像素不动</span>
          <span class="spacer"></span>
          <button class="ghost small" :disabled="staticRr.busy" @click="staticRr.open = false">×</button>
        </div>
        <div class="inpaint-stage">
          <img ref="staticRrImg" :src="staticRr.image" @load="initStaticRrCanvas" />
          <canvas ref="staticRrCanvas"
                  @pointerdown="srDown" @pointermove="srMove"
                  @pointerup="srUp" @pointercancel="srUp"></canvas>
        </div>
        <div class="inpaint-tools">
          <label>笔刷 <input type="range" min="8" max="140" v-model.number="staticRr.brush" /></label>
          <button class="ghost small" :class="{ on: staticRr.erasing }"
                  @click="staticRr.erasing = !staticRr.erasing">{{ staticRr.erasing ? '橡皮 · 开' : '橡皮' }}</button>
          <button class="ghost small" @click="srUndo">撤销</button>
          <button class="ghost small" @click="srClear">清空</button>
          <span class="tip">在图上按住拖动涂抹,涂完写一句要求再开始</span>
        </div>
        <div class="inpaint-prompt">
          <textarea ref="staticRrPrompt" v-model="staticRr.prompt"
                    placeholder="留空 = 用这一镜原本的换装指令;写新指令可以改局部细节,例:把涂抹区域改成纯白色、修掉这块的褶皱"></textarea>
        </div>
        <div class="inpaint-foot">
          <span v-if="staticRr.err" class="small" style="color:var(--err)">{{ staticRr.err }}</span>
          <span class="spacer"></span>
          <button class="ghost" :disabled="staticRr.busy" @click="staticRr.open = false">取消</button>
          <button class="primary" :disabled="staticRr.busy" @click="runStaticRerender">
            {{ staticRr.busy ? '重渲中…' : (staticRr.hasMask ? '开始重渲(局部)' : '不涂直接整图重渲') }}
          </button>
        </div>
      </div>
    </div>

    <!-- 三视图 / 人物三视图 节点配置面板 -->
    <div v-if="threeComposer.open && threeComposerNode" class="three-composer">
      <div class="tc-head">
        <strong>{{ threeComposerNode.type === 'personview' ? '人物三视图' : '三视图' }}</strong>
        <span class="small muted">
          {{ threeComposerNode.type === 'personview'
            ? '人物照片 + 服装 → 同一个人穿这套的全身三视图'
            : '平铺服装 / 穿着图 → 正面 · 侧面 · 背面' }}
        </span>
        <span class="spacer"></span>
        <span v-if="threeComposer.message" class="small muted">{{ threeComposer.message }}</span>
        <button class="ghost small" @click="threeComposer.open = false">×</button>
      </div>
      <div class="tc-body">
        <div class="tc-sources">
          <div v-if="threeComposerNode.type === 'personview'" class="tc-src tc-person">
            <img v-if="threeComposerNode.opts.person" :src="threeComposerNode.opts.person" />
            <span v-else class="ph">人物</span>
            <span class="tag">人物</span>
            <button v-if="threeComposerNode.opts.person" title="移除人物图"
                    @click="removePersonSource">×</button>
          </div>
          <label v-if="threeComposerNode.type === 'personview' && !threeComposerNode.opts.person"
                 class="composer-add" :title="threeUploading ? '上传中…' : '上传人物照片'">
            {{ threeUploading ? '…' : '+' }}
            <input type="file" accept="image/*" style="display:none" @change="uploadPersonSource" />
          </label>
          <div v-for="(src, i) in (threeComposerNode.images || [])" :key="'ts' + i" class="tc-src">
            <img :src="src" />
            <span class="tag">{{ threeComposerNode.type === 'personview' ? ('服装' + (i + 1)) : (i === 0 ? '图1' : ('图' + (i + 1))) }}</span>
            <button title="移除这张" @click="removeThreeSource(i)">×</button>
          </div>
          <label v-if="(threeComposerNode.images || []).length < (threeComposerNode.type === 'personview' ? 2 : 3)"
                 class="composer-add"
                 :title="threeUploading ? '上传中…' : '上传图片（最多 ' + (threeComposerNode.type === 'personview' ? 2 : 3) + ' 张）'">
            {{ threeUploading ? '…' : '+' }}
            <input type="file" accept="image/*" multiple style="display:none" @change="uploadThreeSource" />
          </label>
          <div v-if="threeComposerNode.type === 'personview'" class="tc-tip">
            人物占 1 张，服装最多 2 件（共 3 张）<br>超过会串味，不再拼图
          </div>
          <div v-else class="tc-tip">最多 3 张<br>每张都单独传给模型，不拼图</div>
        </div>

        <div class="tc-opts">
          <template v-if="threeComposerNode.type !== 'personview'">
            <label class="mini">来源
              <select v-model="threeComposerNode.opts.source" @change="saveCanvasStateSoon()">
                <option value="garment">服装图 / 平铺</option>
                <option value="worn">穿着图</option>
              </select>
            </label>
            <label class="mini">主体
              <select v-model="threeComposerNode.opts.subject" @change="saveCanvasStateSoon()">
                <option value="mannequin">白色无脸人台</option>
                <option value="person">保留本人</option>
              </select>
            </label>
            <label v-if="threeComposerNode.opts.subject === 'mannequin'" class="mini">人台
              <select v-model="threeComposerNode.opts.full_body" @change="saveCanvasStateSoon()">
                <option :value="false">半身（只有躯干）</option>
                <option :value="true">全身（有腿脚，能穿鞋）</option>
              </select>
            </label>
            <label v-if="threeComposerNode.opts.subject === 'mannequin' && threeComposerNode.opts.full_body"
                   class="mini">头部
              <select v-model="threeComposerNode.opts.head" @change="saveCanvasStateSoon()">
                <option :value="true">有头（无五官）</option>
                <option :value="false">无头</option>
              </select>
            </label>
            <label v-if="(threeComposerNode.images || []).length > 1" class="mini">多张
              <select v-model="threeComposerNode.opts.per_piece" @change="saveCanvasStateSoon()">
                <option :value="false">合成一套</option>
                <option :value="true">每件单独出图</option>
              </select>
            </label>
          </template>
          <label class="mini">输出
            <select v-model="threeComposerNode.opts.split" @change="saveCanvasStateSoon()">
              <option :value="false">一张三视图</option>
              <option :value="true">裁成三张</option>
            </select>
          </label>
        </div>

        <div class="tc-prompt-row">
          <textarea v-model="threeComposerNode.opts.prompt"
                    :placeholder="threeComposerNode.type === 'personview'
                      ? '可选：补充要求（例如“保留她的齐肩发”“鞋子换成白色”）'
                      : '可选：补充要求（例如“只保留这条裙子，不要加上衣”“背面图案要和图2一致”）'"
                    @input="saveCanvasStateSoon()"></textarea>
        </div>
        <div v-if="threeComposer.err" class="tc-err">{{ threeComposer.err }}</div>
      </div>
      <div class="tc-foot">
        <span class="small muted">
          {{ threeComposerNode.type === 'personview'
            ? '约 3 分钟/张；生成的是同一个人的全身三视图。'
            : '约 3 分钟/张；每件单独出图会按张数叠加时间。' }}
        </span>
        <span class="spacer"></span>
        <button class="primary"
                :disabled="threeComposer.busy || (threeComposerNode.type === 'personview'
                  ? (!threeComposerNode.opts.person || !(threeComposerNode.images || []).length)
                  : !(threeComposerNode.images || []).length)"
                @click="startThreeView">
          {{ threeComposer.busy ? '生成中…' : '生成三视图' }}
        </button>
      </div>
    </div>

    <!-- 加号菜单:添加图片 / 文本 / 视频节点 -->
    <input ref="customFile" type="file" style="display:none" @change="onCustomFilePicked" />
    <div v-if="canvas.addMenu" class="node-add-menu"
         :style="{left: canvas.addMenu.x + 'px', top: canvas.addMenu.y + 'px'}"
         @pointerdown.stop @click.stop>
      <div class="head">添加节点</div>
      <button @click="addCustomNode('text')"><span class="ico">T</span>文本</button>
      <button @click="addCustomNode('image')"><span class="ico">▢</span>图片</button>
      <button @click="addCustomNode('video')"><span class="ico">▶</span>视频</button>
    </div>

    <!-- 节点右键菜单 -->
    <div v-if="canvas.menu && menuShot()" class="node-menu"
         :style="{left: canvas.menu.x + 'px', top: canvas.menu.y + 'px'}"
         @pointerdown.stop @click.stop>
      <button @click="nodeMenuAction('open')">打开编辑</button>
      <button @click="nodeMenuAction('render')">生成 / 抽卡</button>
      <button @click="nodeMenuAction('preview')">出预览图</button>
      <button @click="nodeMenuAction('condense')">精简提示词</button>
      <div class="sep"></div>
      <button @click="nodeMenuAction('rename')">重命名节点</button>
      <button @click="nodeMenuAction('copy')">复制提示词</button>
      <button @click="nodeMenuAction('idea')">存为通用分镜</button>
      <button v-if="menuShot().clip_url" @click="nodeMenuAction('download')">下载视频</button>
      <div class="sep"></div>
      <button class="danger" @click="nodeMenuAction('delete')">删除节点</button>
    </div>

    <!-- 大图 / 视频预览 -->
    <div v-if="lightbox" class="lightbox" @click.self="lightbox = null">
      <button class="close" @click="lightbox = null">关闭</button>
      <img v-if="lightbox.type === 'image'" :src="lightbox.url" />
      <video v-else :src="lightbox.url" controls autoplay playsinline></video>
      <div class="cap">{{ lightbox.title }}</div>
    </div>
  </template>
</main>

<!-- 应用内弹窗:替代浏览器原生 confirm / prompt -->
<div v-if="dialog.open" class="dialog-mask" @click.self="dialogCancel">
  <div class="dialog-card">
    <div class="dialog-title">{{ dialog.title }}</div>
    <div v-if="dialog.message" class="dialog-message">{{ dialog.message }}</div>
    <input v-if="dialog.input" v-model="dialog.value" class="dialog-input"
           @keydown.enter.prevent="dialogConfirm" />
    <div class="dialog-actions">
      <button class="ghost" @click="dialogCancel">{{ dialog.cancelText }}</button>
      <button :class="dialog.danger ? 'danger' : 'primary'" @click="dialogConfirm">
        {{ dialog.confirmText }}
      </button>
    </div>
  </div>
</div>

<!-- 素材管理抽屉:人物 / 道具 / 场景 -->
<div v-if="showAssets" class="drawer">
  <div class="head">
    <strong>素材管理</strong>
    <span class="spacer"></span>
    <button class="ghost" @click="showAssets = false">关闭</button>
  </div>
  <div class="body">
    <div class="small muted" style="margin-bottom:12px">
      把图片<b>拖进右侧提示词框</b>即可在提示词里引用;也可以直接点击图片插入。
    </div>

    <div class="tabs">
      <button v-for="c in cats" :key="c.v" :class="{on: assetTab === c.v}" @click="assetTab = c.v">
        {{ c.t }} ({{ assets.filter(a => a.category === c.v).length }})
      </button>
    </div>

    <label style="display:block;margin-bottom:14px;cursor:pointer">
      <input type="file" accept="image/*" style="display:none" @change="uploadAsset" />
      <span class="small muted" style="display:block;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:10px">
        + 上传到「{{ catName(assetTab) }}」
      </span>
    </label>

    <div class="asset-grid">
      <div v-for="a in assets.filter(x => x.category === assetTab)" :key="a.id" class="asset">
        <img :src="a.url" loading="lazy" decoding="async" draggable="true" :title="a.filename" @dragstart="dragAsset($event, a)" @dragend="dragEnd" @click="insertAsset(a)" />
        <template v-if="!a.is_system">
          <input v-model="a.filename" title="可改名后点保存" />
          <select v-model="a.category">
            <option v-for="c in cats" :key="c.v" :value="c.v">{{ c.t }}</option>
          </select>
          <div class="ops">
            <button class="primary" @click="saveAsset(a)">保存</button>
            <button class="danger" @click="deleteAsset(a)">删除</button>
          </div>
        </template>
        <template v-else>
          <div class="name">{{ a.filename }} <span class="sys-tag">内置</span></div>
          <div class="small muted" style="font-size:11px">只读,可直接拖用</div>
        </template>
      </div>
    </div>

    <div v-if="!assets.filter(x => x.category === assetTab).length" class="muted small" style="margin-top:10px">
      该分类下还没有素材。
    </div>
  </div>
</div>

<div v-if="picker" class="mask" style="z-index:70" @click.self="picker = null">
  <div class="modal" style="width:760px;max-height:88vh;overflow:auto">
    <h3 style="margin-top:0">为「{{ picker.name }}」选择素材</h3>
    <p class="small muted">
      点击图片切换选中,<b>可以选多张,顺序就是引用编号</b> <code>&lt;Picture 1&gt;</code>、<code>&lt;Picture 2&gt;</code>…
      (比如人物正面 + 背面)。全部不选 = 不指定,交给模型自己生成。
    </p>

    <div class="tabs" style="align-items:center">
      <button v-for="c in cats" :key="c.v" :class="{on: picker.tab === c.v}" @click="picker.tab = c.v">
        {{ c.t }} ({{ assets.filter(a => a.category === c.v).length }})
      </button>
      <span class="spacer" style="flex:1"></span>
      <label style="cursor:pointer">
        <input type="file" accept="image/*" style="display:none" @change="uploadInPicker" />
        <span class="small" style="display:inline-block;border:1px dashed var(--line);border-radius:8px;padding:5px 12px">
          + 上传到「{{ catName(picker.tab) }}」
        </span>
      </label>
    </div>

    <div class="thumbs">
      <div v-for="a in assets.filter(x => x.category === picker.tab)" :key="a.id" class="thumb"
           :class="{picked: picker.sel.indexOf('asset:' + a.id) >= 0}"
           style="width:104px;height:104px;cursor:pointer" :title="a.filename"
           @click="togglePick(a)">
        <img :src="a.url" loading="lazy" decoding="async" />
        <span v-if="picker.sel.indexOf('asset:' + a.id) >= 0" class="num">
          {{ picker.sel.indexOf('asset:' + a.id) + 1 }}
        </span>
        <button v-if="!a.is_system" class="x" title="删除素材" @click.stop="deleteInPicker(a)">×</button>
        <span v-if="a.is_system" class="num" style="left:auto;right:2px;background:rgba(240,180,41,.85);border-color:transparent;color:#000">内置</span>
      </div>
      <div v-if="!assets.filter(x => x.category === picker.tab).length" class="muted small">
        该分类下还没有素材,点右上角上传。
      </div>
    </div>

    <div v-if="picker.sel.length" class="small muted" style="margin-top:14px">
      已选 {{ picker.sel.length }} 张:
      <span v-for="(r, i) in picker.sel" :key="r" style="margin-right:8px">
        &#60;Picture {{ i + 1 }}&#62;
      </span>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="primary" @click="confirmPicker">确定(选 {{ picker.sel.length }} 张)</button>
      <button class="ghost" :disabled="!picker.sel.length" @click="picker.sel = []">清空选择</button>
      <span class="spacer"></span>
      <button class="ghost" @click="picker = null">取消</button>
    </div>
  </div>
</div>

<div v-if="queueOpen" class="mask" @click.self="closeQueue">
  <div class="modal" style="width:680px;max-width:100%;max-height:86vh;display:flex;flex-direction:column">
    <div class="row">
      <h3 style="margin:0">ComfyUI 队列任务</h3>
      <span class="spacer"></span>
      <button class="ghost" @click="refreshQueue">刷新</button>
      <button class="ghost" @click="closeQueue">关闭</button>
    </div>
    <p class="small muted" style="margin:8px 0 10px">
      每 3 秒自动刷新。终止「运行中」会立刻中断当前这一炉;终止「排队中」会把它从 ComfyUI 队列里删掉。
    </p>
    <div v-if="queueErr" class="notice err">{{ queueErr }}</div>
    <div style="overflow:auto">
      <div class="sub" style="margin:6px 0 2px">运行中 ({{ queueData.running.length }})</div>
      <div v-if="!queueData.running.length" class="small muted">没有正在运行的任务</div>
      <div v-for="it in queueData.running" :key="it.prompt_id" class="pick-row">
        <span style="flex:1">{{ it.title || it.prompt_id }}</span>
        <span class="small muted">{{ it.shot_key }}</span>
        <button class="danger" :disabled="queueBusy === it.prompt_id" @click="cancelQueue(it)">终止</button>
      </div>
      <div class="sub" style="margin:14px 0 2px">排队中 ({{ queueData.pending.length }})</div>
      <div v-if="!queueData.pending.length" class="small muted">队列里没有等待的任务</div>
      <div v-for="(it, i) in queueData.pending" :key="it.prompt_id" class="pick-row">
        <span class="small muted" style="width:22px">#{{ i + 1 }}</span>
        <span style="flex:1">{{ it.title || it.prompt_id }}</span>
        <span class="small muted">{{ it.shot_key }}</span>
        <button class="danger" :disabled="queueBusy === it.prompt_id" @click="cancelQueue(it)">终止</button>
      </div>
    </div>
  </div>
</div>

<div v-if="tplModal" class="mask" @click.self="tplModal = false">
  <div class="modal">
    <h3 style="margin-top:0">另存为我的模板</h3>
    <p class="small muted">把当前项目的全部镜头(提示词、参考图、时长、模式)保存成你自己的模板,以后一键复用。</p>
    <div class="field"><label>模板名称</label><input v-model="tplForm.title" /></div>
    <div class="field"><label>说明(可选)</label><textarea v-model="tplForm.description" style="min-height:80px"></textarea></div>
    <div class="row">
      <button class="primary" @click="saveAsTemplate">保存模板</button>
      <span class="spacer"></span>
      <button class="ghost" @click="tplModal = false">取消</button>
    </div>
  </div>
</div>

<div v-if="showAddGeneral" class="mask" @click.self="showAddGeneral = false">
  <div class="modal" style="width:480px;max-width:100%">
    <h3 style="margin-top:0">添加通用分镜</h3>
    <p class="small muted">从镜头库选一个(含系统镜头和我的镜头),或自定义输入。新分镜会复制现有通用分镜的参考图和提示词结构,只换动作。</p>
    <!-- 镜头库快捷选择 -->
    <div class="field">
      <label>镜头库</label>
      <select v-model="addGeneralPick" @change="onPickShotLib">
        <option value="">— 从镜头库选一个(或下面自定义) —</option>
        <optgroup v-for="g in shotGroups" :key="g.k" :label="g.t">
          <option v-for="it in g.items" :key="it.key || it.id" :value="it.key || String(it.id)">
            {{ it.label }}
          </option>
        </optgroup>
      </select>
    </div>
    <!-- 自定义输入 -->
    <div class="field"><label>标题</label><input v-model="addGeneralForm.title" placeholder="例如:化妆师补右脸" /></div>
    <div class="field"><label>动作描述</label>
      <textarea v-model="addGeneralForm.action" style="min-height:80px"
                placeholder="例如:已经穿好完整套装,半身景别,化妆师手持粉扑在她右脸颊轻轻按压补妆…"></textarea></div>
    <div class="field"><label>时长(秒)</label><input v-model="addGeneralForm.seconds" type="number" step="0.5" min="0.5" max="10" /></div>
    <div v-if="err" class="err" style="margin:8px 0">{{ err }}</div>
    <div class="row">
      <button class="primary" @click="addGeneralShot">添加</button>
      <span class="spacer"></span>
      <button class="ghost" @click="showAddGeneral = false">取消</button>
    </div>
  </div>
</div>

<div v-if="showBind" class="mask" @click.self="showBind = false">
  <div class="modal">
    <h3 style="margin-top:0">绑定邮箱</h3>
    <p class="small muted">绑定后账号可长期保存,当前的项目和素材会自动保留。</p>
    <div class="field"><label>邮箱</label>
      <input v-model="bind.email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" /></div>
    <div class="field"><label>密码(至少 6 位)</label>
      <input v-model="bind.password" type="password" autocomplete="current-password" /></div>
    <div class="field"><label>昵称(可选)</label><input v-model="bind.display_name" autocomplete="nickname" /></div>
    <div class="row"><button class="primary" @click="submitBind">绑定</button>
      <button class="ghost" @click="submitLogin">已有账号,直接登录</button>
      <span class="spacer"></span><button class="ghost" @click="showBind = false">取消</button></div>
  </div>
</div>
`
});
// 渲染阶段抛错会让整个界面变成一片空白,连"哪儿错了"都看不到。
// 兜一手:清掉本地界面状态,并**直接用原生 DOM 把错误写在页面上**(此时 Vue 已经画不出来了),
// 这样至少能看见错误信息、点一下就能重载回可用状态。
app.config.errorHandler = (e) => {
  console.error('[ovs] 界面渲染出错', e);
  try { localStorage.removeItem(UI_KEY); } catch (err) { /* 清不掉也没辙 */ }
  const host = document.getElementById('app');
  if (!host) return;
  // 用原生 DOM 拼这张错误页,报错信息一律走 textContent ——
  // 这是前端唯一会"直接写 DOM"的地方,改成不拼 HTML,后端返回的文本就不会被当标签执行。
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:28px;font:14px/1.7 system-ui,sans-serif;color:#e8e8e8;max-width:900px';
  const title = document.createElement('div');
  title.style.cssText = 'font-size:16px;margin-bottom:10px';
  title.textContent = '界面出错了(已清掉本地保存的界面状态)';
  const body = document.createElement('pre');
  body.style.cssText = 'color:#ff9d9d;white-space:pre-wrap;word-break:break-all;margin:0;font:inherit';
  body.textContent = String((e && (e.stack || e.message)) || e);
  const box = document.createElement('div');
  box.style.marginTop = '16px';
  const btn = document.createElement('button');
  btn.textContent = '重新加载';
  btn.style.cssText = 'padding:8px 15px;border-radius:10px;border:1px solid rgba(255,255,255,.14);'
    + 'background:#192030;color:#edeff5;cursor:pointer';
  btn.addEventListener('click', () => location.reload());
  box.appendChild(btn);
  wrap.append(title, body, box);
  host.replaceChildren(wrap);
};
app.mount('#app');
</script>
</body>
</html>
