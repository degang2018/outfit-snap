<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0a0c11" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>衣秒成片 · AI 带货视频工坊</title>
<style>
:root{
--bg:#0a0c11;--bg-2:#0e1118;--panel:#131722;--panel2:#192030;--panel3:#202839;
--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
--text:#edeff5;--text-dim:#c6cddb;--muted:#8d97aa;--faint:#69738a;
--accent:#6c8cff;--accent2:#a06bff;--accent-soft:rgba(108,140,255,.14);
--ok:#3fcf95;--warn:#f3b64a;--err:#f2687d;
--r-lg:18px;--r:13px;--r-sm:10px;
--shadow:0 14px 34px -18px rgba(0,0,0,.8);
--shadow-lg:0 26px 60px -24px rgba(0,0,0,.88);
--ring:0 0 0 3px rgba(108,140,255,.30);
--topbar-h:60px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);
background:
radial-gradient(1100px 620px at 12% -12%,rgba(108,140,255,.16),transparent 60%),
radial-gradient(900px 560px at 96% 2%,rgba(160,107,255,.12),transparent 58%),
linear-gradient(180deg,var(--bg-2),var(--bg) 42%);
background-attachment:fixed;
font:14px/1.62 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(108,140,255,.35)}
a{color:var(--accent);text-decoration:none;transition:color .15s}
a:hover{color:#91a9ff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);border-radius:99px;border:2px solid transparent;background-clip:content-box}
button{font:inherit;cursor:pointer;color:var(--text);padding:8px 15px;border-radius:var(--r-sm);white-space:nowrap;
border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
transition:border-color .16s,background .16s,transform .12s,box-shadow .16s,color .16s}
button:hover:not(:disabled){border-color:rgba(108,140,255,.55);background:var(--accent-soft)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:var(--ring)}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{border:none;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));
box-shadow:0 10px 24px -14px rgba(108,140,255,.95)}
button.primary:hover:not(:disabled){filter:brightness(1.07)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover:not(:disabled){background:rgba(255,255,255,.06);border-color:transparent}
button.danger{color:var(--err);border-color:rgba(242,104,125,.30);background:rgba(242,104,125,.08)}
button.danger:hover:not(:disabled){background:rgba(242,104,125,.15);border-color:rgba(242,104,125,.5)}
button.on{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
input,textarea,select{font:inherit;color:var(--text);background:#0d1017;border:1px solid var(--line-2);
border-radius:var(--r-sm);padding:9px 11px;width:100%;transition:border-color .16s,box-shadow .16s}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(108,140,255,.6);box-shadow:var(--ring)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
select{appearance:none;-webkit-appearance:none;padding-right:32px;
background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
/* 顶栏:毛玻璃 + 分段式导航 */
header.top{display:flex;align-items:center;gap:18px;padding:10px 24px;min-height:var(--topbar-h);
border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
background:rgba(12,15,22,.74);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;color:#fff;flex:none;
background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px -10px rgba(108,140,255,.95)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand:hover .brand-name{color:#fff}
nav.topnav{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
nav.topnav .tab{display:inline-flex;align-items:center;border:1px solid transparent;background:transparent;color:var(--muted);
border-radius:999px;padding:6px 15px;font-size:13.5px;cursor:pointer;line-height:1.5}
nav.topnav .tab:hover{color:var(--text);background:rgba(255,255,255,.05)}
nav.topnav .tab.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
box-shadow:0 8px 18px -12px rgba(108,140,255,.95)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:12.5px;
color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.03);white-space:nowrap}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill-ok{color:#bff3dd;border-color:rgba(63,207,149,.35);background:rgba(63,207,149,.10)}
.pill-ok .live-dot{background:var(--ok);box-shadow:0 0 0 3px rgba(63,207,149,.18)}
.pill-off{color:#ffd0d6;border-color:rgba(242,104,125,.30);background:rgba(242,104,125,.09)}
.pill-off .live-dot{background:var(--err)}
/* 右上角用户菜单:点用户名展开下拉 */
.user-menu{position:relative}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);
border-radius:999px;padding:3px 12px 3px 4px;color:var(--muted);font-size:13px;line-height:1.5}
.user-chip:hover,.user-chip.on{border-color:rgba(108,140,255,.55);color:var(--text);background:var(--accent-soft)}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none}
.avatar.guest{background:linear-gradient(135deg,#3a4252,#2a3242);color:var(--muted)}
.caret{font-size:9px;opacity:.7}
.menu{position:absolute;right:0;top:calc(100% + 10px);min-width:252px;background:var(--panel2);
border:1px solid var(--line-2);border-radius:14px;padding:7px;z-index:30;box-shadow:var(--shadow-lg)}
.menu-item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);
padding:10px 12px;border-radius:10px;font-size:14px;white-space:normal}
.menu-item:hover{background:rgba(255,255,255,.06);border-color:transparent}
.menu-item.danger{color:var(--err)}
.menu-info{padding:9px 12px 11px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);
margin-bottom:6px;word-break:break-all;line-height:1.6}
.menu-divider{height:1px;background:var(--line);margin:7px 5px}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line)}
.badge.email,.badge.done{color:#bff3dd;border-color:rgba(63,207,149,.35);background:rgba(63,207,149,.10)}
.badge.running,.badge.queued{color:#ffe1a8;border-color:rgba(243,182,74,.35);background:rgba(243,182,74,.10)}
.badge.failed{color:#ffcbd3;border-color:rgba(242,104,125,.35);background:rgba(242,104,125,.10)}
.badge.canceled{color:var(--muted)}
.badge.builtin{color:#a8c8ff;border-color:rgba(108,140,255,.35);background:rgba(108,140,255,.10)}
.badge.custom{color:#d4b3ff;border-color:rgba(168,85,247,.35);background:rgba(168,85,247,.10)}
.data-table{border-collapse:collapse;font-size:14px}
.data-table th{text-align:left;padding:10px 14px;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.data-table tr.muted td{opacity:.45}
.data-table tr:last-child td{border-bottom:none}
.data-table input,.data-table textarea{background:var(--bg-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px}
.page{max-width:1280px;margin:0 auto;padding:28px 24px 96px}
h1{font-size:24px;line-height:1.25;margin:0 0 6px;letter-spacing:-.2px}
h2{font-size:19px;line-height:1.3;letter-spacing:-.2px}
.sub{color:var(--muted);margin-bottom:20px;max-width:840px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.section-title{font-size:14px;font-weight:600;color:var(--text-dim);letter-spacing:.3px;margin:28px 0 12px;
display:flex;align-items:center;gap:10px}
.section-title::before{content:"";width:3px;height:15px;border-radius:2px;
background:linear-gradient(180deg,var(--accent),var(--accent2))}
.empty{padding:28px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);
text-align:center;background:rgba(255,255,255,.02)}
.shot-row{padding:16px 0;border-top:1px solid var(--line)}
.shot-row:first-of-type{border-top:none;padding-top:0}
/* 分镜清单分组:换装链 / 通用分镜分开,一眼能区分 */
.shot-group{display:flex;align-items:center;gap:8px;margin:20px 0 6px;padding:7px 10px;
  border-radius:8px;background:rgba(110,168,254,.08);border:1px solid rgba(110,168,254,.28);
  font-size:12px;font-weight:600;letter-spacing:.2px;color:#cfe0ff}
.shot-group .dot{width:6px;height:6px;border-radius:50%;background:#6ea8fe;flex:none}
.shot-group.gen{background:rgba(255,184,107,.07);border-color:rgba(255,184,107,.26);color:#ffe0bd}
.shot-group.gen .dot{background:#ffb86b}
.shot-row.chain{border-left:2px solid rgba(110,168,254,.4);padding-left:12px;margin-left:-2px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.012));
border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:16px;letter-spacing:-.1px}
.grid .card{transition:transform .18s,border-color .18s,box-shadow .18s}
.grid .card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow-lg)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace}
.notice{padding:12px 15px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel2)}
.notice.err{border-color:rgba(242,104,125,.35);background:rgba(242,104,125,.09);color:#ffd3d9}
.notice.ok{border-color:rgba(63,207,149,.35);background:rgba(63,207,149,.09);color:#c6f4e0}
.editor{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:20px;align-items:start}
.shot-list{position:sticky;top:calc(var(--topbar-h) + 14px);max-height:calc(100vh - var(--topbar-h) - 44px);overflow:auto}
.shot-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;min-width:0;
border:1px solid transparent;transition:background .15s,border-color .15s}
.shot-item:hover{background:rgba(255,255,255,.05)}
.shot-item.active{background:var(--accent-soft);border-color:rgba(108,140,255,.5)}
.shot-item.dragging{opacity:.4}
.shot-item.dropover{border-color:var(--accent);background:rgba(108,140,255,.08)}
.shot-row.dropover{outline:2px solid var(--accent);background:rgba(108,140,255,.06)}
.shot-row.dragging{opacity:.4}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}
.dot.done{background:var(--ok)} .dot.running{background:var(--warn)} .dot.failed{background:var(--err)}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.thumbs{display:flex;gap:9px;flex-wrap:wrap}
.thumb{width:80px;height:80px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);position:relative;background:#0b0d11}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:19px;height:19px;line-height:16px;text-align:center;
border-radius:50%;background:rgba(0,0,0,.68);border:1px solid var(--line-2);font-size:12px;padding:0;color:#fff}
.thumb .x:hover{background:var(--err);border-color:var(--err)}
.thumb.file{display:flex;align-items:center;justify-content:center;padding:4px;font-size:11px;color:var(--muted);text-align:center}
.thumb .num{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.74);border:1px solid var(--line-2);
border-radius:7px;padding:0 6px;font-size:11px;line-height:17px}
.thumb.picked{border-color:var(--accent);box-shadow:0 0 0 2px rgba(108,140,255,.45)}
.thumb.picked .num{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.cand-row{padding:14px 0;border-top:1px solid var(--line)}
.cand-row:first-of-type{border-top:none;padding-top:2px}
.cand-row.on{padding-left:10px;border-left:3px solid var(--ok);border-radius:6px;background:rgba(63,207,149,.06)}
.cand-row video{max-height:340px;display:block;border-radius:10px;background:#000}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:var(--muted);border-radius:999px;
padding:5px 13px;font-size:13px}
.chip:hover{border-color:rgba(108,140,255,.55);color:var(--text)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:600}
.pick-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.progress.indet>i{width:35%;animation:slide 1.3s linear infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
video{width:100%;border-radius:12px;background:#000}
pre{white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;background:#0d1017;
border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:12px;color:var(--muted)}
.mask{position:fixed;inset:0;background:rgba(5,7,11,.74);backdrop-filter:blur(3px);display:flex;
align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{width:400px;max-width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;
padding:22px;box-shadow:var(--shadow-lg)}
.dialog-mask{position:fixed;inset:0;z-index:92;background:rgba(0,0,0,.58);backdrop-filter:blur(5px);
display:grid;place-items:center;padding:20px}
.dialog-card{width:min(440px,calc(100vw - 40px));padding:20px 20px 16px;border-radius:18px;
background:var(--panel2);border:1px solid var(--line-2);box-shadow:var(--shadow-lg)}
.dialog-title{font-size:15px;font-weight:700;margin-bottom:8px}
.dialog-message{font-size:13px;line-height:1.7;color:var(--text-dim);white-space:pre-wrap}
.dialog-input{width:100%;margin-top:12px}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.drawer{position:fixed;top:0;right:0;height:100vh;width:410px;background:var(--panel);border-left:1px solid var(--line-2);
z-index:60;display:flex;flex-direction:column;box-shadow:-26px 0 60px rgba(0,0,0,.6)}
.page.shifted{padding-right:440px}
.drawer .head{display:flex;align-items:center;gap:8px;padding:15px 16px;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:16px 16px 44px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:6px 13px;font-size:12.5px;border-radius:999px}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asset{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;transition:border-color .15s}
.asset:hover{border-color:var(--line-2)}
.asset img{width:100%;height:112px;object-fit:cover;border-radius:9px;cursor:grab;display:block}
.asset img:active{cursor:grabbing}
.asset .name{font-size:11px;margin:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.asset select{padding:4px 7px;font-size:11px;border-radius:7px;margin-bottom:6px}
.asset input{font-size:11px;padding:4px 7px;border-radius:7px;margin:6px 0;width:100%}
.ops{display:flex;gap:6px}
.ops button{padding:4px 10px;font-size:11px;border-radius:7px}
.sys-tag{font-size:10px;color:var(--warn)}
textarea.dropping{border-color:var(--accent);box-shadow:var(--ring)}
/* ============ 分镜节点画布 ============ */
.page.canvas-page{max-width:1680px}
.canvas-topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.canvas-topbar .search{width:168px;padding:6px 10px;font-size:12px}
.canvas-topbar button{padding:6px 11px;font-size:12px}
.canvas-settings{margin:6px 0 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);padding:10px 14px}
.canvas-settings>summary{cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none}
.canvas-settings[open]>summary{color:var(--text-dim);margin-bottom:10px}
.node-stage{position:relative;height:calc(100vh - 300px);min-height:560px;border:1px solid var(--line);border-radius:20px;
overflow:hidden;background-color:#080a0f;
background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1px);
background-size:26px 26px;cursor:grab;user-select:none;touch-action:none;
box-shadow:inset 0 0 140px rgba(0,0,0,.72)}
.node-stage.panning{cursor:grabbing}
.node-stage.linking{cursor:crosshair}
.node-stage::before{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(760px 420px at 26% 14%,rgba(108,140,255,.11),transparent 70%),
radial-gradient(640px 420px at 82% 76%,rgba(160,107,255,.09),transparent 70%)}
.canvas-world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.canvas-links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.canvas-links path{fill:none;stroke-linecap:round;opacity:.42}
/* 连线的命中区 / 线宽按缩放反向补偿(见模板里的 stroke-width 绑定),缩到 20% 也能轻松点到 */
.canvas-links path.link-hit{pointer-events:stroke;stroke:transparent;fill:none}
.canvas-links path.manual{pointer-events:stroke;cursor:pointer}
.canvas-links .link-group:hover path.manual{opacity:.95}
.canvas-links .link-del{pointer-events:none;cursor:pointer;opacity:0;transition:opacity .15s}
.canvas-links .link-group:hover .link-del{pointer-events:auto;opacity:1}
.canvas-links .link-del rect{fill:#1a0e12;stroke:rgba(255,120,140,.55);stroke-width:1}
.canvas-links .link-del:hover rect{fill:var(--err);stroke:var(--err)}
.canvas-links .link-del text{fill:#fff;font-size:10px;text-anchor:middle;font-family:var(--font)}
.ref-group,.node-shot,.add-node,.chain-frame{position:absolute;left:0;top:0}
.ref-group{background:linear-gradient(180deg,rgba(26,33,50,.94),rgba(15,20,31,.96));
border:1px solid rgba(255,255,255,.10);border-radius:16px;overflow:hidden;
box-shadow:0 20px 44px -28px rgba(0,0,0,.95)}
.ref-group:hover{border-color:rgba(108,140,255,.38)}
.ref-group.selected{border-color:rgba(108,140,255,.9);box-shadow:0 0 0 1px rgba(108,140,255,.45),0 22px 48px -26px #000}
.ref-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:grab}
.ref-head strong{font-size:13px;letter-spacing:.2px}
.ref-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none;
box-shadow:0 0 0 3px rgba(108,140,255,.14)}
.ref-grid{display:grid;grid-template-columns:repeat(3,112px);gap:10px;padding:12px 14px 14px}
.ref-item{position:relative;width:112px;height:112px;border-radius:11px;overflow:hidden;background:#0b0e14;
border:1px solid var(--line);transition:border-color .15s,transform .15s}
.ref-item:hover{border-color:rgba(108,140,255,.5);transform:translateY(-1px)}
.ref-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ref-file{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;
font-size:10.5px;color:var(--muted);word-break:break-all}
.ref-name{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 4px;font-size:10px;line-height:1.25;
background:linear-gradient(transparent,rgba(0,0,0,.86));color:#e2e8f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ref-port{position:absolute;right:4px;top:4px;width:20px;height:20px;padding:0;border-radius:50%;font-size:10px;line-height:1;
background:rgba(8,10,16,.82);border:1px solid rgba(255,255,255,.34);opacity:0;transition:opacity .15s,background .15s}
.ref-item:hover .ref-port{opacity:1}
.ref-port:hover{background:var(--accent);border-color:var(--accent)}
.node-shot{width:288px;background:linear-gradient(180deg,rgba(29,36,53,.97),rgba(14,19,29,.98));
border:1px solid rgba(255,255,255,.10);border-radius:16px;overflow:hidden;cursor:grab;
box-shadow:0 24px 48px -30px rgba(0,0,0,.98);
transition:border-color .16s,box-shadow .16s,opacity .2s}
.node-shot:hover{border-color:rgba(108,140,255,.5)}
.node-shot.selected{border-color:rgba(108,140,255,.95);box-shadow:0 0 0 1px rgba(108,140,255,.5),0 24px 52px -28px #000}
.node-shot.drop,.node-custom.drop{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,140,255,.35),0 0 24px rgba(108,140,255,.35)}
.node-shot.running{border-color:rgba(243,182,74,.65);animation:nodePulse 1.9s ease-in-out infinite}
@keyframes nodePulse{0%,100%{box-shadow:0 0 0 1px rgba(243,182,74,.16),0 24px 48px -30px #000}
50%{box-shadow:0 0 0 4px rgba(243,182,74,.24),0 24px 48px -30px #000}}
.node-shot.dim{opacity:.22}
.node-shot.hit{border-color:rgba(243,182,74,.85);box-shadow:0 0 0 2px rgba(243,182,74,.35),0 24px 48px -30px #000}
.node-head{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line);cursor:grab}
.node-head .idx{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.node-head .title{flex:1;min-width:0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-head .dot{width:7px;height:7px;border-radius:50%;flex:none}
.node-more{width:22px;height:22px;padding:0;border-radius:7px;font-size:13px;line-height:1;color:var(--muted);flex:none;
background:transparent;border:1px solid transparent;opacity:0;transition:opacity .15s}
.node-shot:hover .node-more{opacity:1}
.node-custom:hover .node-more{opacity:1}
.node-body{position:relative;height:300px;background:#06080c;overflow:hidden;display:grid;place-items:center}
.node-body img,.node-body video{width:100%;height:100%;object-fit:cover;display:block}
/* 画布节点里的视频:必须精确铺满容器 —— 以前视频按原始比例撑高,底部原生控制条被
   .node-body 的 overflow:hidden 裁掉,看起来就是「点了播放,按钮跑到下面去、还播不了」。
   现在用绝对定位 + contain,整个画面和底部控制条永远都在节点里。 */
.node-body video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:2}
.node-empty{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--faint);font-size:11.5px;padding:18px;text-align:center}
.node-empty .ico{font-size:26px;opacity:.45;line-height:1}
.node-progress{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.10);z-index:2}
.node-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.node-progress.indet i{width:35%;animation:slide 1.3s linear infinite}
.node-badge{position:absolute;left:8px;top:8px;z-index:2;font-size:10px;padding:2px 7px;border-radius:999px;
background:rgba(6,8,12,.78);border:1px solid rgba(255,255,255,.20);color:#dfe6f4;backdrop-filter:blur(4px)}
.node-badge.ok{color:#bff3dd;border-color:rgba(63,207,149,.45)}
.node-badge.bad{color:#ffcbd3;border-color:rgba(242,104,125,.45)}
.node-badge.warn{color:#ffe1a8;border-color:rgba(243,182,74,.45)}
.node-cands{position:absolute;right:8px;top:8px;z-index:2;font-size:10px;padding:2px 7px;border-radius:999px;
background:rgba(6,8,12,.78);border:1px solid rgba(255,255,255,.20);color:#dfe6f4}
.node-foot{display:flex;align-items:center;gap:6px;padding:8px 11px;border-top:1px solid var(--line);
font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.node-chip{padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:10px}
.node-play{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.72);font-size:30px;
pointer-events:none;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.node-open{position:absolute;right:8px;bottom:8px;z-index:2;width:27px;height:27px;padding:0;border-radius:8px;
font-size:13px;line-height:1;color:#e4eaf6;background:rgba(6,8,12,.76);border:1px solid rgba(255,255,255,.24);
opacity:0;transition:opacity .15s,background .15s}
.node-body:hover .node-open{opacity:1}
.node-open:hover{background:var(--accent);border-color:var(--accent)}
.node-play-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
width:52px;height:52px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;
color:#fff;background:rgba(8,10,16,.7);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(4px);
box-shadow:0 8px 26px rgba(0,0,0,.55);padding-left:3px}
.node-play-btn:hover{background:var(--accent);border-color:var(--accent)}
.node-video-close{position:absolute;right:8px;top:8px;z-index:4;width:26px;height:26px;padding:0;border-radius:50%;
font-size:13px;line-height:1;color:#fff;background:rgba(8,10,16,.72);border:1px solid rgba(255,255,255,.3)}
.node-video-close:hover{background:var(--err);border-color:var(--err)}
/* 自定义节点:图片 / 文本 / 视频 */
.node-custom{position:absolute;left:0;top:0;width:240px;background:linear-gradient(180deg,rgba(29,36,53,.97),rgba(14,19,29,.98));
border:1px solid rgba(255,255,255,.10);border-radius:16px;overflow:hidden;cursor:grab;
box-shadow:0 24px 48px -30px rgba(0,0,0,.98);transition:border-color .16s,box-shadow .16s}
.node-custom:hover{border-color:rgba(108,140,255,.5)}
.node-custom.selected{border-color:rgba(108,140,255,.95);box-shadow:0 0 0 1px rgba(108,140,255,.5),0 24px 52px -28px #000}
.custom-body{position:relative;height:160px;background:#06080c;overflow:hidden}
.node-custom.image .custom-body{height:240px}
.node-custom.threeview .custom-body{height:230px}
.node-custom.text .custom-body{height:110px}
.three-node-out{position:relative;width:100%;height:100%}
.three-node-out img{width:100%;height:100%;object-fit:contain;background:#fff}
.three-node-src{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;height:100%;
padding:10px;flex-wrap:wrap;background:rgba(255,255,255,.02)}
.three-node-src img{width:31%;height:78%;object-fit:contain;background:#fff;border-radius:8px;
border:1px solid var(--line-2)}
.three-hint{width:100%;text-align:center;font-size:10px;color:var(--faint)}
.image-node-empty{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:8px;color:var(--faint);font-size:12px;cursor:pointer;
background:radial-gradient(420px 220px at 50% 40%,rgba(108,140,255,.08),transparent 70%)}
.image-node-empty .ico{font-size:28px;opacity:.55}
.img-count{position:absolute;right:8px;top:8px;z-index:2;font-size:10px;padding:1px 6px;border-radius:6px;
background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.2);color:#fff}
.img-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:28px;height:28px;padding:0;border-radius:50%;
font-size:18px;line-height:1;color:#fff;background:rgba(8,10,16,.65);border:1px solid rgba(255,255,255,.25)}
.img-nav:hover{background:var(--accent);border-color:var(--accent)}
.img-nav.prev{left:8px}
.img-nav.next{right:8px}
.custom-body img,.custom-body video{width:100%;height:100%;object-fit:cover;display:block}
.custom-body video{background:#000}
.custom-body textarea{width:100%;height:100%;border:none;background:transparent;resize:none;padding:10px;
font-size:12px;line-height:1.7;color:var(--text);outline:none;border-radius:0;box-shadow:none}
.custom-body textarea:focus{box-shadow:none;border:none}
.custom-upload{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:5px;color:var(--muted);font-size:12px;cursor:pointer;background:rgba(255,255,255,.015)}
.custom-upload:hover{color:var(--text);background:var(--accent-soft)}
.custom-foot{display:flex;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid var(--line);
font-size:10px;color:var(--muted)}
.custom-foot button{padding:2px 7px;font-size:10px;border-radius:6px}
.node-plus{position:absolute;left:0;top:0;width:32px;height:32px;padding:0;border-radius:50%;display:grid;
place-items:center;font-size:18px;line-height:1;color:rgba(235,240,250,.8);background:rgba(10,13,20,.88);
border:1px solid rgba(255,255,255,.24);z-index:6;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.45);
opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s,background .15s,border-color .15s}
.node-plus.show{opacity:1;visibility:visible}
.node-plus:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.node-add-menu{position:fixed;z-index:76;width:180px;padding:6px;border-radius:12px;background:var(--panel2);
border:1px solid var(--line-2);box-shadow:var(--shadow-lg)}
.node-add-menu .head{font-size:11px;color:var(--faint);padding:6px 9px}
.node-add-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;font-size:13px;
border:1px solid transparent;background:none;border-radius:8px;color:var(--text);text-align:left}
.node-add-menu button:hover{background:var(--accent-soft);border-color:rgba(108,140,255,.35)}
.node-add-menu button .ico{width:20px;text-align:center;font-size:14px;color:var(--text-dim)}
.add-node{width:288px;height:112px;border:1px dashed rgba(255,255,255,.22);border-radius:16px;
display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12.5px;
background:rgba(255,255,255,.02);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.add-node:hover{border-color:rgba(108,140,255,.7);color:var(--text);background:var(--accent-soft)}
.chain-frame{border:1px dashed rgba(108,140,255,.34);border-radius:24px;pointer-events:none;
background:linear-gradient(180deg,rgba(108,140,255,.055),rgba(108,140,255,.012))}
.chain-frame>span{position:absolute;left:18px;top:-11px;padding:1px 10px;border-radius:999px;font-size:10.5px;
letter-spacing:.3px;color:#b9c8ff;background:#0e1422;border:1px solid rgba(108,140,255,.34)}
.canvas-tools{position:absolute;left:14px;bottom:14px;z-index:6;display:flex;align-items:center;gap:4px;
padding:5px;border-radius:12px;background:rgba(11,15,22,.88);border:1px solid var(--line-2);backdrop-filter:blur(10px)}
.canvas-tools button{padding:5px 9px;font-size:12px;border-radius:8px}
.canvas-tools .zoom-pill{font-size:11.5px;color:var(--muted);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.canvas-hint{position:absolute;right:14px;bottom:14px;z-index:6;font-size:11px;color:var(--faint);
background:rgba(11,15,22,.82);border:1px solid var(--line);border-radius:9px;padding:5px 10px;backdrop-filter:blur(8px)}
.marquee{position:absolute;z-index:5;border:1px solid rgba(108,140,255,.9);background:rgba(108,140,255,.12);pointer-events:none}
.canvas-link-temp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
.canvas-link-temp line{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 5;opacity:.9}
/* 底部创作面板(点节点后出现) */
.composer{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:46;
width:min(1080px,calc(100vw - 44px));padding:13px 15px 11px;border-radius:20px;
background:rgba(24,25,31,.975);border:1px solid rgba(255,255,255,.14);
box-shadow:0 34px 80px -24px rgba(0,0,0,.96);backdrop-filter:blur(16px) saturate(1.2);
transition:left .2s ease,width .2s ease}
.composer.with-drawer{left:calc(50% - 205px);width:min(1080px,calc(100vw - 450px))}
.composer-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.composer-thumb{position:relative;width:68px;height:68px;border-radius:12px;overflow:hidden;flex:none;
background:#0a0c11;border:1px solid var(--line-2);cursor:zoom-in}
.composer-thumb img,.composer-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.composer-thumb .ph{width:100%;height:100%;display:grid;place-items:center;font-size:10px;color:var(--faint);line-height:1.3;text-align:center;padding:4px}
.composer-thumb .idx{position:absolute;left:4px;top:4px;font-size:10px;padding:0 5px;border-radius:6px;
background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.2)}
.composer-refs{display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-width:0;flex:1}
.composer-ref{position:relative;width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;
background:#0a0c11;border:1px solid var(--line-2)}
.composer-ref img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.composer-ref .num{position:absolute;left:3px;top:3px;font-size:9.5px;line-height:15px;padding:0 4px;border-radius:5px;
background:rgba(0,0,0,.74);border:1px solid rgba(255,255,255,.16)}
.composer-ref button{position:absolute;right:1px;top:1px;width:17px;height:17px;padding:0;border-radius:50%;
font-size:11px;line-height:1;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);opacity:0;transition:opacity .15s}
.composer-ref:hover button{opacity:1}
.composer-ref[draggable="true"]{cursor:grab}
.composer-ref.dragging{opacity:.35}
.composer-ref.over{border-color:var(--accent);box-shadow:0 0 0 2px rgba(108,140,255,.4)}
.composer-ref .ref-role{position:absolute;left:2px;bottom:2px;font-size:9px;line-height:14px;padding:0 4px;
border-radius:5px;background:rgba(108,140,255,.92);color:#fff;letter-spacing:.5px}
/* 换装链尾帧:自动附加、不可拖不可删,用虚线框区分 */
.composer-ref.style-ref{border:1px dashed rgba(108,196,255,.75);cursor:zoom-in}
.composer-ref.style-ref .ref-role{background:rgba(108,196,255,.9);color:#04121c}
.composer-ref.style-ref .style-lock{position:absolute;right:2px;top:2px;font-size:8.5px;line-height:13px;
padding:0 4px;border-radius:5px;background:rgba(0,0,0,.7);border:1px solid rgba(108,196,255,.5);color:#9fd8ff}
.composer-ref .ref-actions{position:absolute;right:2px;bottom:2px;display:flex;gap:2px}
.composer-ref .ref-actions button{position:static;width:auto;height:15px;padding:0 4px;border-radius:4px;
font-size:9.5px;line-height:13px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.28)}
.composer-add{width:54px;height:54px;padding:0;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
font-size:19px;color:var(--muted);background:rgba(255,255,255,.025);border:1px dashed rgba(255,255,255,.22);cursor:pointer}
.composer-add:hover{color:var(--text);border-color:rgba(108,140,255,.7);background:var(--accent-soft)}
/* 最终文案(只读):生成时自动展开 */
.final-prompt-box{margin-top:8px;border:1px solid var(--line-2);border-radius:10px;
background:rgba(255,255,255,.02);padding:8px 10px}
.final-prompt-box .fp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.final-prompt-box .fp-text{margin:0;max-height:26vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
font-family:var(--font);font-size:12px;line-height:1.7;color:var(--text-dim);
background:rgba(0,0,0,.2);border-radius:8px;padding:8px 10px}
.composer-prompt{width:100%;min-height:86px;max-height:230px;resize:vertical;background:transparent;border:none;
padding:3px 5px;font-size:14px;line-height:1.68;border-radius:8px}
.composer-prompt:focus{box-shadow:none;border:none;outline:none}
/* 富文本提示词:内联参考图 chip + @ 引用 */
.composer-prompt.rich-prompt{white-space:pre-wrap;word-break:break-word;overflow:auto;cursor:text;line-height:1.9;
min-height:86px;max-height:230px;padding:3px 5px}
.composer-prompt.rich-prompt:empty:before{content:attr(data-placeholder);color:var(--faint);pointer-events:none}
.composer-prompt.rich-prompt.dropping{box-shadow:inset 0 0 0 1px rgba(108,140,255,.75);background:rgba(108,140,255,.07)}
/* 图片节点创作面板 */
.image-composer{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:47;
width:min(960px,calc(100vw - 44px));padding:13px 16px 12px;border-radius:20px;
background:rgba(24,25,31,.975);border:1px solid rgba(255,255,255,.14);
box-shadow:0 34px 80px -24px rgba(0,0,0,.96);backdrop-filter:blur(16px) saturate(1.2)}
.image-composer .ic-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.image-composer .ic-thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none;background:#0a0c11;
border:1px solid var(--line-2);display:grid;place-items:center;font-size:15px;color:var(--faint)}
.image-composer .ic-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.image-composer .ic-title{font-size:13px;font-weight:600}
.image-composer .ic-prompt{display:flex;align-items:flex-start;gap:10px}
.image-composer .ic-plus{width:40px;height:40px;padding:0;border-radius:10px;flex:none;display:grid;place-items:center;
font-size:20px;color:var(--muted);background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.24)}
.image-composer .ic-plus:hover{color:var(--text);border-color:rgba(108,140,255,.7);background:var(--accent-soft)}
.image-composer textarea{flex:1;min-height:62px;max-height:130px;resize:vertical;border:1px solid var(--line-2);
background:rgba(0,0,0,.18);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.7;color:var(--text)}
.image-composer textarea:focus{border-color:rgba(108,140,255,.6);box-shadow:0 0 0 3px rgba(108,140,255,.12);outline:none}
.image-composer .ic-foot{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}
.image-composer .ic-foot select{width:auto;padding:5px 8px;font-size:11.5px}
.image-composer .ic-foot .primary{min-width:86px}
/* 图片节点 · 局部修理 */
.inpaint-mask{position:fixed;inset:0;z-index:60;background:rgba(4,6,10,.72);
backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px}
.inpaint-box{width:min(880px,calc(100vw - 48px));max-height:calc(100vh - 48px);overflow:auto;
border-radius:20px;background:rgba(24,25,31,.99);border:1px solid rgba(255,255,255,.14);
box-shadow:0 34px 90px -24px rgba(0,0,0,.96);padding:14px 16px 13px;
display:flex;flex-direction:column;gap:10px}
.inpaint-head{display:flex;align-items:center;gap:10px}
.inpaint-head strong{font-size:13.5px}
.inpaint-picks{display:flex;gap:6px;flex-wrap:wrap}
.inpaint-picks button{font-size:11.5px;padding:4px 10px;border-radius:999px;
border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer}
.inpaint-picks button.on{color:var(--text);border-color:rgba(108,140,255,.7);background:var(--accent-soft)}
.inpaint-stage{position:relative;align-self:center;line-height:0;border-radius:12px;overflow:hidden;
background:#0a0c11;border:1px solid var(--line-2);max-width:100%}
.inpaint-stage img{display:block;max-width:100%;max-height:min(56vh,540px);user-select:none;-webkit-user-drag:none}
.inpaint-stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.55;

const DEFAULT_SEED = 639795015; // 「单镜整套换装」的标准种子:填它单独生成就能复现那一版飘入效果

async function req(path, opts = {}) {
  const headers = {};
  const t = localStorage.getItem(TOKEN_KEY);
  if (t) headers.Authorization = 'Bearer ' + t;
  let body;
  if (opts.form) body = opts.form;
  else if (opts.body !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.body); }
  const res = await fetch(path, { method: opts.method || 'GET', headers, body });
  if (res.status === 204) return null;
  if (opts.raw) {
    if (!res.ok) {
      const d = await res.json().catch(() => null);
      throw new Error((d && d.detail) || res.statusText);
    }
    return res.blob();
  }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === 'string' ? d : Array.isArray(d) ? d.map(x => x.msg).join('; ') : res.statusText);

  return data;

  computed: {

    /** 「我的项目」一共有几页(后端只给当前页 + 总数,页数在前端算) */
    projPages() { return Math.max(1, Math.ceil(this.projTotal / this.projPageSize)) },
    // 分镜管理页:搜索 + 分页
    smFiltered() {
      const q = this.smSearch.trim().toLowerCase();
      const items = (this.shotLib && this.shotLib.items) || [];
      if (!q) return items;
      return items.filter(it =>
        (it.label || '').toLowerCase().includes(q) ||
        (it.action || '').toLowerCase().includes(q) ||
        (it.key || '').toLowerCase().includes(q));
    },
    smPages() { return Math.max(1, Math.ceil(this.smFiltered.length / this.smPageSize)) },
    smPageItems() {
      const start = (this.smPage - 1) * this.smPageSize;
      return this.smFiltered.slice(start, start + this.smPageSize);
    },
    // 「换装」父节点只收**前面那串换装镜**(按件链:打底展示 + 每件「展示 → 换装」,
    // 它们带着状态图标记 state_out / state_first 或首尾硬锚 anchor0 / anchor_last)。
    // 后面接的「通用分镜」不在里面 —— 用户要求别把它们混在一起(它们只有 float 标记,没有上面这几个)。
    floatChainEnd() {
      let end = 0;
      for (const s of ((this.project && this.project.shots) || [])) {
        const o = s.options || {};
        if (o.anchor0 || o.anchor_last || o.state_out || o.state_first) end += 1;
        else break;
      }
      return end;
    },
    // 父节点右边那行「N 镜 · X 秒」——只算换装链那几镜
    floatChainSeconds() {
      const shots = (this.project && this.project.shots) || [];
      const fps = (this.project && this.project.fps) || 24;
      return (shots.slice(0, this.floatChainEnd)
        .reduce((n, s) => n + s.duration_frames, 0) / fps).toFixed(1);
    },
    shot() { return this.project ? this.project.shots[this.sel] : null },
    running() { return this.job && ['queued', 'running'].includes(this.job.status) },
    modeHint() { const m = this.modes.find(x => x.v === this.draft?.mode); return m ? m.h : '' },
    shotJob() { return this.shot ? this.shotJobs[this.shot.id] || null : null },
    shotBusy() { return this.shotJob && ['queued', 'running'].includes(this.shotJob.status) },
    /* ---------- 多角度机位 ---------- */
    cameraSummary() {
      const cam = this.draft && this.draft.options && this.draft.options.camera;
      return cam ? this.cameraLabel(cam) : '';
    },
    /** @ 引用候选:当前镜头参考图 + 素材库(人物 / 服装道具 / 场景 / 实拍) */
    mentionItems() {
      if (!this.draft) return [];
      const q = (this.mentionQuery || '').trim().toLowerCase();
      const out = [];
      const seen = new Set();
      const push = (ref, group, asset) => {
        if (!ref || seen.has(ref)) return;
        seen.add(ref);
        const info = this.refInfo[ref] || {};
        const name = info.ai_name || info.filename
          || (asset && (asset.ai_name || asset.filename)) || ref;
        const url = info.url || (asset && asset.url) || '';
        if (q && name.toLowerCase().indexOf(q) < 0 && String(ref).toLowerCase().indexOf(q) < 0) return;
        out.push({ ref, name, url, group, asset: asset || null });
      };
      for (const ref of (this.draft.refs || [])) push(ref, '当前参考图');
      const groups = [
        { k: 'character', t: '人物' },
        { k: 'prop', t: '服装/道具' },
        { k: 'scene', t: '场景' },
        { k: 'wear_ref', t: '实拍参考' }
      ];
      for (const g of groups) {
        for (const a of this.assets) {
          if (a.category === g.k) push('asset:' + a.id, g.t, a);
        }
      }
      return out.slice(0, 60);
    },
    cameraSizeLabel() {
      return this.framingLabel(this.cameraDraft.distance);
    },
    /** 机位有没有被改过:关窗口时自动应用,避免调完角度点 × 就白调了 */
    cameraChanged() {
      const a = this.cameraDraft || {};
      const az = Number(a.azimuth) || 0;
      const el = Number(a.elevation) || 0;
      const dist = Number.isFinite(Number(a.distance)) ? Number(a.distance) : 4;
      const mode = a.subject_mode === 'follow' ? 'follow' : 'fixed';
      const cam = this.draft && this.draft.options ? this.draft.options.camera : null;
      if (!cam) return !(az === 0 && el === 0 && dist === 4 && mode === 'fixed');
      const cdist = Number.isFinite(Number(cam.distance))
        ? Number(cam.distance)
        : 1 + (Number(cam.scale) || 0) / 100 * 9;
      return az !== (Number(cam.azimuth) || 0)
        || el !== (Number(cam.elevation) || 0)
        || Math.abs(dist - cdist) > 0.05
        || mode !== (cam.subject_mode || 'fixed');
    },
    /** 小球上代表摄像机位置的点(az=0 在正下方=正面,顺时针);距离越近,机位离画面越近 */
    cameraDot() {
      const az = (Number(this.cameraDraft.azimuth) || 0) * Math.PI / 180;
      const el = (Number(this.cameraDraft.elevation) || 0) * Math.PI / 180;
      const dist = Number.isFinite(Number(this.cameraDraft.distance))
        ? Number(this.cameraDraft.distance) : 4;
      const R = 118 + ((dist - 1) / 9) * 28;
      return {
        x: 210 + R * Math.cos(el) * Math.sin(az),
        y: 210 + R * Math.cos(el) * Math.cos(az) - R * Math.sin(el)
      };
    },
    /** 摄像机图标朝向:镜头永远指向画面中心 */
    cameraFacing() {
      const p = this.cameraDot;
      return Math.atan2(210 - p.y, 210 - p.x) * 180 / Math.PI;
    },
    // any active job for this project (whole film or single shot)
    anyBusy() {
      if (this.running) return true;
      if (this.previewRunning) return true;
      return Object.values(this.shotJobs).some(j => ['queued', 'running'].includes(j.status));
    },
    previewRunning() {
      return !!this.previewJob && this.previewJob.status === 'running';
    },
    enabledShots() {
      return this.project ? this.project.shots.filter(s => s.enabled) : [];
    },
    cfgDirty() {
      const p = this.project;
      if (!p) return false;
      return Number(this.cfg.w) !== p.out_width || Number(this.cfg.h) !== p.out_height
        || Number(this.cfg.fps) !== p.fps;
    },
    doneShots() { return this.project ? this.project.shots.filter(s => s.clip_url).length : 0 },
    /* ---------- 分镜节点画布 ---------- */
    /** 项目里用到的参考图,按素材分类聚成「参考图组」节点 */
    canvasRefNodes() {
      const order = [
        { k: 'character', t: '人物参考' },
        { k: 'prop', t: '服装 / 道具' },
        { k: 'scene', t: '场景参考' },
        { k: 'wear_ref', t: '实拍参考' },
        { k: 'other', t: '人物服装' }
      ];
      const map = {};
      for (const c of order) map[c.k] = { key: c.k, title: c.t, items: [] };
      const seen = new Set();
      // 已经被某个镜头当作「首帧硬锚」的图,不在参考图组里再出现一次
      // (首帧就在镜头第 0 帧里,重复摆在人物参考里只会干扰)
      const anchorNames = new Set();
      for (const s of ((this.project && this.project.shots) || [])) {
        const a0 = s.options && s.options.anchor0;
        if (a0) anchorNames.add(String(a0).split(/[\\/]/).pop());
      }
      const add = (ref) => {
        if (!ref || seen.has(ref)) return;
        const info = this.refInfo[ref] || {};
        const base = String(info.url || '').split('/').pop();
        if (base && anchorNames.has(base)) return;
        seen.add(ref);
        const k = order.some(x => x.k === info.category) ? info.category : 'other';
        map[k].items.push({
          ref,
          url: info.url || '',
          name: info.ai_name || info.filename || ref,
          kind: info.ai_kind || ''
        });
      };
      for (const s of ((this.project && this.project.shots) || [])) for (const r of (s.refs || [])) add(r);
      if (this.project && this.project.bg_ref) add(this.project.bg_ref);

      let y = 86;
      const out = [];
      for (const c of order) {
        const g = map[c.k];
        if (!g.items.length) continue;
        const size = this.refGroupSize(g);
        const fallback = { x: 60, y };
        y += size.h + 34;
        const p = this.nodePosition('ref:' + g.key, fallback);
        out.push({ key: 'ref:' + g.key, category: g.key, title: g.title, items: g.items,
                   x: p.x, y: p.y, w: size.w, h: size.h });
      }
      return out;
    },
    /** 分镜节点(镜头按 idx 顺序排成网格) */
    canvasShotNodes() {
      const shots = (this.project && this.project.shots) || [];
      return shots.map((s, i) => {
        const p = this.nodePosition('shot:' + s.id, this.shotDefaultPos(i));
        return { shot: s, index: i, x: p.x, y: p.y };
      });
    },
    canvasSelectedShots() {
      if (!this.project) return [];
      const ids = this.canvas.sel.filter(k => k.indexOf('shot:') === 0).map(k => Number(k.slice(5)));
      return this.project.shots.filter(s => ids.indexOf(s.id) >= 0);
    },
    /** 换装链(件链镜)外层的分组框 */
    canvasChainFrame() {
      const end = this.floatChainEnd || 0;
      if (!end) return null;
      const nodes = this.canvasShotNodes.slice(0, end);
      if (!nodes.length) return null;
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for (const n of nodes) {
        x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
        x2 = Math.max(x2, n.x + 288); y2 = Math.max(y2, n.y + 374);
      }
      return { x: x1 - 22, y: y1 - 30, w: x2 - x1 + 44, h: y2 - y1 + 54,
               label: '换装链 · ' + end + ' 镜 · ' + this.floatChainSeconds + 's' };
    },
    /** 「+ 添加分镜」节点:接在最后一个分镜下面 */
    canvasAddNodePos() {
      const nodes = this.canvasShotNodes;
      const last = nodes[nodes.length - 1];
      return last ? { x: last.x, y: last.y + 374 + 34 } : { x: 620, y: 96 };
    },
    customComposerNode() {
      if (!this.customComposer || !this.customComposer.id) return null;
      return this.canvas.customNodes.find((n) => n.id === this.customComposer.id) || null;
    },
    threeComposerNode() {
      if (!this.threeComposer || !this.threeComposer.id) return null;
      return this.canvas.customNodes.find((n) => n.id === this.threeComposer.id) || null;
    },
    repairNode() {
      if (!this.repair || !this.repair.id) return null;
      return this.canvas.customNodes.find((n) => n.id === this.repair.id) || null;
    },
    repairImage() {
      const n = this.repairNode;
      if (!n) return '';
      const imgs = n.images || [];
      return imgs[n.imageIndex || 0] || n.url || '';
    },
    /** 参考图 → 分镜 的引用连线 */
    canvasEdges() {
      if (!this.canvas.showLinks || !this.project) return [];
      const anchor = {};
      for (const g of this.canvasRefNodes) {
        g.items.forEach((it, i) => {
          const row = Math.floor(i / 3), col = i % 3;
          anchor[it.ref] = { x: g.x + 14 + col * 122 + 112, y: g.y + 110 + row * 122 };
        });
      }
      const out = [];
      for (const n of this.canvasShotNodes) {
        for (const ref of (n.shot.refs || [])) {
          const a = anchor[ref];
          if (!a) continue;
          out.push({ id: n.shot.id + ':' + ref, d: this.edgePath(a.x, a.y, n.x, n.y + 56) });
        }
      }
      return out;
    },
    /** 手动连线(从节点左右加号拖出来的) */
    canvasLinkEdges() {
      if (!this.canvas.links || !this.canvas.links.length) return [];
      const out = [];
      for (const l of this.canvas.links) {
        const a = this.nodeRectByKey(l.from);
        const b = this.nodeRectByKey(l.to);
        if (!a || !b) continue;
        const ax = a.x + a.w, ay = a.y + a.h / 2;
        const bx = b.x, by = b.y + b.h / 2;
        out.push({ id: l.id, d: this.edgePath(ax, ay, bx, by),
                   mx: (ax + bx) / 2, my: (ay + by) / 2 });
      }
      return out;
    },
    canvasSelectedCount() { return this.canvas.sel.length },
    sceneHint() {

    contentLines() {

    /** 内容清单按行拆开(给编号预览用) */
    contentList() {

    pieceParts() {

      return Object.keys(this.quick.pieces || {}).filter(k => typeof k === 'string');

      if (mine.length) out.push({ k: 'custom', t: '我的镜头', items: mine });

      return s.slice(0, 1).toUpperCase();

    /* ---------- 图片橡皮擦 ---------- */
    /** destination-out 只看 alpha,颜色无所谓;只有「填白」模式才真的需要白色 */
    eraserRgb() { return this.eraser.mode === 'white' ? '255,255,255' : '0,0,0' },
    /** 画布外框尺寸:「适应宽度」给 100%,否则按倍数给具体像素(外层容器负责滚动) */
    eraserBoxStyle() {

  },
  watch: {
    sel() { this.resetDraft(); this.saveUISoon() },
    view() { this.saveUI() },
    quick: { deep: true, handler() { this.saveUISoon() } },
    scriptForm: { deep: true, handler() { this.saveUISoon() } }
  },
  async mounted() {
    await this.boot();
    // 从 auto.html 跳过来时,按 sessionStorage 指定的视图跳转
    const goto = sessionStorage.getItem('ovs_goto');
    if (goto) { sessionStorage.removeItem('ovs_goto'); this.go(goto); }
    // 轮询:页面切到后台就不发请求(省流量/省电);切回前台立刻补拍一次
    this.timer = setInterval(() => { if (!document.hidden) this.poll(); }, 3000);
    this.comfyTimer = setInterval(() => { if (!document.hidden) this.refreshComfy(); }, 15000);
    document.addEventListener('visibilitychange', this.onVisible);
    // 画布快捷键:空格抓手 / Delete 删节点 / Ctrl+S 保存 / Esc 关面板
    document.addEventListener('keydown', this.onCanvasKeyDown);
    document.addEventListener('keyup', this.onCanvasKeyUp);
    // 点页面其它地方就收起用户下拉(几处 @click.stop 保证点菜单本身不会关)
    document.addEventListener('click', () => { this.userOpen = false });
  },
  beforeUnmount() {
    clearInterval(this.timer);
    clearInterval(this.comfyTimer);
    if (this.queueTimer) clearInterval(this.queueTimer);
    document.removeEventListener('visibilitychange', this.onVisible);
    document.removeEventListener('keydown', this.onCanvasKeyDown);
    document.removeEventListener('keyup', this.onCanvasKeyUp);
    window.removeEventListener('pointermove', this.onCanvasMove);
    window.removeEventListener('pointerup', this.onCanvasUp);
    window.removeEventListener('pointermove', this.onCameraDragMove);
    window.removeEventListener('pointerup', this.onCameraDragEnd);
    window.removeEventListener('pointermove', this.onPlusMove);
    window.removeEventListener('pointerup', this.onPlusUp);
  },
  methods: {
    /* ---------- 应用内弹窗 ---------- */
    askConfirm(title, message, opts = {}) {
      return new Promise((resolve) => {
        this.dialog = {
          open: true, title, message,
          confirmText: opts.confirmText || '确定',
          cancelText: opts.cancelText || '取消',
          danger: !!opts.danger,
          input: false, value: '', resolve
        };
      });
    },
    askInput(title, message, value = '', opts = {}) {
      return new Promise((resolve) => {
        this.dialog = {
          open: true, title, message,
          confirmText: opts.confirmText || '确定',
          cancelText: opts.cancelText || '取消',
          danger: false,
          input: true, value: value || '', resolve
        };
      });
    },
    dialogConfirm() {
      const d = this.dialog;
      const resolve = d.resolve;
      const value = d.input ? d.value : true;
      this.dialog = { ...d, open: false, resolve: null };
      if (resolve) resolve(value);
    },
    dialogCancel() {
      const d = this.dialog;
      const resolve = d.resolve;
      this.dialog = { ...d, open: false, resolve: null };
      if (resolve) resolve(d.input ? null : false);
    },
    /* ---------- 镜头草稿:改完必须点「保存」 ---------- */
    resetDraft() {
      const s = this.shot;
      this.draft = s ? {
        title: s.title || '',
        mode: s.mode,
        sec: Number((s.duration_frames / this.project.fps).toFixed(2)),
        prompt: s.prompt || '',
        refs: [...(s.refs || [])],
        options: this._optsWithSeed(s),
        enabled: s.enabled
      } : null;
      this.dirty = false;
      this.seedDirty = false;   // 打开镜头 = 不指定种子,生成时由后端随机
      this.$nextTick(() => this.renderPromptEditor());
    },
    /** 草稿用的 options:原样返回(不要再预填默认种子)。
     *
     * 用户 2026-10-23:以前这里把没种子的镜头默认填成 639795015,前端生成时又把它带上,
     * 结果**每一镜都被钉在同一个种子上** —— 反复重渲出来的永远是同一段画面、
     * 同一个位置反复出现同一处瑕疵。现在留空 = 单张生成时由后端取随机种子。
     */
    _optsWithSeed(s) {
      return JSON.parse(JSON.stringify(s.options || {}));
    },
    /** 用户手动改过种子才按固定种子生成(可复现) */
    onSeedInput() { this.seedDirty = true; this.markDirty(); },
    snapshot(s) {
      return JSON.stringify({
        title: s.title || '', mode: s.mode,
        sec: Number((s.duration_frames / this.project.fps).toFixed(2)),
        prompt: s.prompt || '', refs: s.refs || [], options: this._optsWithSeed(s), enabled: s.enabled
      });
    },
    markDirty() { this.dirty = this.shot && this.draft && this.snapshot(this.shot) !== JSON.stringify(this.draft) },
    async saveDraft() {
      if (!this.shot || !this.draft) return false;
      this.saving = true; this.err = '';
      try {
        // 种子清空时不落库(留空 = 用默认种子;真想要随机就点「抽卡」)
        const options = { ...this.draft.options };
        const seed = Number(options.seed);
        if (options.seed === '' || options.seed === null || !Number.isFinite(seed) || seed <= 0) {
          delete options.seed;
        } else {
          options.seed = Math.floor(seed);
        }
        const updated = await req(`/api/projects/${this.project.id}/shots/${this.shot.id}`, {
          method: 'PATCH',
          body: {
            title: this.draft.title,
            mode: this.draft.mode,
            duration_frames: Math.max(4, Math.round(Number(this.draft.sec) * this.project.fps)),
            prompt: this.draft.prompt,
            refs: this.draft.refs,
            options,
            enabled: this.draft.enabled
          }
        });
        Object.assign(this.shot, updated);
        this.resetDraft();
        return true;
      } catch (e) { this.err = e.message; return false } finally { this.saving = false }
    },
    revertDraft() { this.resetDraft() },
    /** 让模型优化当前草稿里的提示词(只写回编辑框,不落库) */
    async optimizePrompt() {
      if (!this.draft) return;
      this.err = ''; this.optimizeMsg = '';
      if (!this.draft.prompt.trim()) { this.err = '提示词是空的,没什么可优化'; return; }
      this.optimizing = true;
      try {
        const res = await req(`/api/projects/${this.project.id}/shots/${this.shot.id}/optimize`, {
          method: 'POST',
          body: { prompt: this.draft.prompt, instruction: this.optimizeAsk }
        });
        this.draft.prompt = res.prompt;
        this.markDirty();
        this.$nextTick(() => this.renderPromptEditor());
        this.optimizeMsg = `已由 ${res.engine_detail} 优化,确认没问题后点「保存」生效;不满意可以直接改回或再优化一次。`;
      } catch (e) { this.err = e.message }
      finally { this.optimizing = false }
    },
    async selectShot(i) {
      if (i === this.sel) return;
      if (this.dirty && !(await this.askConfirm('切换镜头',
        '当前镜头有未保存的修改，切换会丢失。确定切换吗？',
        { confirmText: '切换' }))) return;
      this.sel = i;
    },
    async deleteShot() {
      if (!this.shot) return;
      if (!(await this.askConfirm('删除镜头',
        '删除镜头 ' + this.shot.idx + '(' + (this.shot.title || this.shot.key) + ')?此操作不可撤销。',
        { danger: true, confirmText: '删除' }))) return;
      this.err = '';
      try {
        await req(`/api/projects/${this.project.id}/shots/${this.shot.id}`, { method: 'DELETE' });
        await this.openProject({ id: this.project.id });
      } catch (e) { this.err = e.message }
    },
    /** 把这一镜存成「通用分镜」:标题当名字、提示词正文当动作 —— 以后在「上传衣服 · 一键出稿」页能勾到 */
    async saveAsIdea() {
      if (!this.shot) return;
      this.err = ''; this.notice = '';
      try {
        this.shotLib = await req('/api/shots/from-shot', {
          method: 'POST', body: { shot_id: this.shot.id }
        });
        this.applyShotLib();
        this.notice = `已把「${this.shot.title || this.shot.key}」存成通用分镜`
          + `(名字可在「管理细节镜头」里改)。到「上传衣服 · 一键出稿」页就能勾到它。`;
      } catch (e) { this.err = e.message }
    },
    /** 分镜列表按索引删除(通用分镜用,件链镜不显示删除按钮) */
    async deleteShotByIndex(i) {
      const s = (this.project && this.project.shots || [])[i];
      if (!s) return;
      if (!(await this.askConfirm('删除镜头',
        '删除镜头 ' + (i + 1) + '(' + (s.title || s.key) + ')?此操作不可撤销。',
        { danger: true, confirmText: '删除' }))) return;
      this.err = '';
      try {
        await req(`/api/projects/${this.project.id}/shots/${s.id}`, { method: 'DELETE' });
        await this.openProject({ id: this.project.id });
      } catch (e) { this.err = e.message }
    },
    /** 打开添加通用分镜对话框:先确保镜头库已加载 */
    async openAddGeneral() {
      if (!this.shotLib || !(this.quickOpts.shot_library || []).length) {
        await this.loadShots();
      }
      this.err = '';
      this.showAddGeneral = true;
    },
    /** 从镜头库下拉框选一个填入添加表单 */
    onPickShotLib() {
      const key = this.addGeneralPick;
      if (!key) return;
      const it = (this.quickOpts.shot_library || []).find(s => (s.key || String(s.id)) === key);
      if (it) this.pickShotLibForAdd(it);
    },
    /** 从镜头库选一个填入添加表单 */
    pickShotLibForAdd(it) {
      this.addGeneralForm = { title: it.label, action: it.action, seconds: it.seconds || 3.0 };
    },
    /** 添加通用分镜:复制现有通用分镜的提示词结构,替换标题/动作 */
    async addGeneralShot() {
      console.log('[addGeneralShot] 点击, project=', this.project && this.project.id, 'form=', this.addGeneralForm);
      if (!this.addGeneralForm.title.trim() || !this.addGeneralForm.action.trim()) {
        this.err = '标题和动作都要填';
        return;
      }
      if (!this.project || !this.project.id) {
        this.err = '项目信息丢失,请重新打开项目';
        return;
      }
      this.err = '';
      try {
        const body = {
          title: this.addGeneralForm.title.trim(),
          action: this.addGeneralForm.action.trim(),
          seconds: parseFloat(this.addGeneralForm.seconds) || 3.0
        };
        const created = await req(`/api/projects/${this.project.id}/shots/add-general`, {
          method: 'POST', body
        });
        console.log('[addGeneralShot] 成功:', created);
        this.showAddGeneral = false;
        this.addGeneralForm = { title: '', action: '', seconds: 3.0 };
        await this.openProject({ id: this.project.id });
        this.notice = '已添加分镜: ' + (created && created.title);
      } catch (e) {
        console.error('[addGeneralShot] 失败:', e);
        this.err = e.message;
      }
    },
    /* ---------- 镜头拖拽排序 ---------- */
    onDragStartShot(i) { this.dragFrom = i; },
    onDragOverShot(i, ev) { ev.preventDefault(); this.dragOver = i; },
    onDragLeaveShot() { /* keep dragOver until enter another */ },
    async onDropShot(i) {
      const from = this.dragFrom;
      this.dragFrom = -1; this.dragOver = -1;
      if (from < 0 || from === i) return;
      // 换装分镜(件链镜)不能排序,也不能把别的镜拖进换装区
      const chainEnd = this.floatChainEnd || 0;
      if (from < chainEnd || i < chainEnd) return;
      const shots = [...this.project.shots];
      const [moved] = shots.splice(from, 1);
      shots.splice(i, 0, moved);
      try {
        await req(`/api/projects/${this.project.id}/shots/reorder`, {
          method: 'POST',
          body: { shot_ids: shots.map(s => s.id) }
        });
        await this.openProject({ id: this.project.id });
      } catch (e) { this.err = e.message }
    },
    /* ---------- 多选下载 ---------- */
    toggleShotSelect(id) {
      const s = new Set(this.selectedShots);
      if (s.has(id)) s.delete(id); else s.add(id);
      this.selectedShots = s;
    },
    selectAllShots() {
      const all = this.project.shots.filter(s => s.clip_url).map(s => s.id);
      this.selectedShots = new Set(all);
    },
    clearShotSelect() { this.selectedShots = new Set(); },
    async downloadSelectedShots() {
      const ids = [...this.selectedShots].filter(id =>
        this.project.shots.find(s => s.id === id && s.clip_url));
      if (!ids.length) { this.err = '请先勾选已生成的镜头'; return; }
      this.err = '';
      try {
        const blob = await req(`/api/projects/${this.project.id}/shots/download-zip`, {
          method: 'POST', body: { shot_ids: ids }, raw: true
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${this.project.title || 'project'}_shots.zip`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) { this.err = e.message }
    },
    /** 不看勾选,把整个项目所有已生成的分镜片段按顺序打包下载 */
    async downloadAllShots() {
      if (!this.project.shots.some(s => s.clip_url)) {
        this.err = '这个项目还没有已生成的镜头片段';
        return;
      }
      this.err = '';
      try {
        const blob = await req(`/api/projects/${this.project.id}/shots/download-zip`, { raw: true });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${this.project.title || 'project'}_全部分镜.zip`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) { this.err = e.message }
    },
    /* ---------- 单镜手动生成 / 抽卡(可反复重跑) ---------- */
    async renderShot() {
      if (!this.shot) return;
      this.err = '';
      if (this.dirty) { this.err = '当前镜头有未保存的修改,请先点「保存」再生成'; return; }
      const count = Math.max(1, Math.min(Number(this.drawCount) || 1, 8));
      let url = `/api/projects/${this.project.id}/shots/${this.shot.id}/render?count=${count}`;
      // 种子:只有用户手动改过这一栏才带上(单张 = 精确复现);留空 = 后端每张取随机种子,
      // 这样反复点「生成」不会永远得到同一段画面。
      if (this.seedDirty) {
        const seed = Number(this.draft?.options?.seed);
        if (Number.isFinite(seed) && seed > 0) url += `&seed=${Math.floor(seed)}`;
      }
      // 抽卡:没手动填种子时,默认每张都换随机种子(否则第一张永远钉在同一个种子上)
      if (count > 1 && (this.drawRandomSeed || !this.seedDirty)) url += '&random_seed=1';
      try {
        const job = await req(url, { method: 'POST' });
        this.shotJobs = { ...this.shotJobs, [this.shot.id]: job };
      } catch (e) { this.err = e.message }
    },
    /** 从抽卡候选里挑一张,设为这一镜最终用的片段 */
    async pickCandidate(url) {
      if (!this.shot) return;
      this.err = '';
      try {
        const updated = await req(`/api/projects/${this.project.id}/shots/${this.shot.id}/pick`,
          { method: 'POST', body: { clip: url } });
        Object.assign(this.shot, updated);
        this.candMsg = '已选用这一张,整片合成会用这一段';
      } catch (e) { this.candMsg = '选用失败:' + e.message }
    },
    /** 删除抽卡候选里的某一张 */
    async deleteCandidate(url) {
      if (!this.shot) return;
      if (!(await this.askConfirm('删除候选',
        '确定删除这张候选视频？此操作不可撤销。',
        { danger: true, confirmText: '删除' }))) return;
      this.err = '';
      try {
        const updated = await req(`/api/projects/${this.project.id}/shots/${this.shot.id}/delete-candidate`,
          { method: 'POST', body: { clip: url } });
        Object.assign(this.shot, updated);
        this.notice = '已删除该候选';
      } catch (e) { this.err = e.message }
    },
    async cancelShot() {
      const j = this.shotJob;
      if (!j) return;
      try {
        const r = await req(`/api/jobs/${j.id}/cancel`, { method: 'POST' });
        this.shotJobs = { ...this.shotJobs, [this.shot.id]: r };
      } catch (e) { this.err = e.message }
    },
    async boot() {
      try {
        const t = localStorage.getItem(TOKEN_KEY);
        if (t) {
          try { this.user = await req('/api/auth/me'); }
          catch (e) {
            localStorage.removeItem(TOKEN_KEY);
            this.sessionNotice = '登录状态已失效(服务端数据库被重建或令牌过期),已为你重新分配游客账号,原项目无法找回。';
          }
        }
        if (!this.user) {
          const g = await req('/api/auth/guest', { method: 'POST' });
          localStorage.setItem(TOKEN_KEY, g.access_token); this.user = g.user;
        }
        await this.refreshComfy();
        await this.loadTemplates();
        await this.restoreUI();
      } catch (e) { this.err = e.message }
    },
    async refreshComfy() { try { this.comfy = await req('/api/system/comfy') } catch (e) { this.comfy = { up: false } } },
    /** 从后台切回前台:立刻补一次状态(不等下一个轮询周期) */
    onVisible() { if (!document.hidden) { this.poll(); this.refreshComfy(); } },
    async loadTemplates() { this.templates = await req('/api/templates') },
    /** 拉「我的项目」当前这一页(轮询也走它) */
    async fetchProjects() {
      const r = await req(`/api/projects?page=${this.projPage}&page_size=${this.projPageSize}`);
      this.projects = r.items || []; this.projTotal = r.total || 0;
      // 删掉当前页最后一条之后页码会越界 —— 自动退回最后一页(不然会看到一片空白)
      if (this.projPage > this.projPages) { this.projPage = this.projPages; await this.fetchProjects() }
    },
    async loadProjects() { this.projPage = 1; await this.fetchProjects() },
    async gotoPage(n) {
      if (n < 1 || n > this.projPages || n === this.projPage) return;
      this.projPage = n;
      try { await this.fetchProjects() } catch (e) { this.err = e.message }
    },
    // 切回「我的项目」时**留在原来那一页**(从第 3 页点进详情、再点「← 我的项目」不该跳回第 1 页)
    go(v) {
      this.view = v;
      if (v === 'projects') this.fetchProjects().catch(e => { this.err = e.message });
      if (v === 'shot-mgr') this.loadShots().catch(e => { this.err = e.message });
      if (v === 'assets') this.loadAssets().catch(e => { this.err = e.message });
      if (v === 'film-settings') this.loadSpeed().catch(e => { this.err = e.message });
      if (v === 'api-settings') this.loadApiCfg().catch(e => { this.err = e.message });
      if (v === 'garment-split') this.saveUISoon();
      if (v === 'garment-extract') this.saveUISoon();
      if (v === 'image-edit') this.saveUISoon();
    },

    /* ---------- ComfyUI 队列:查看 / 终止 ---------- */
    async openQueue() {
      this.queueOpen = true;
      this.queueErr = '';
      await this.refreshQueue();
      if (this.queueTimer) clearInterval(this.queueTimer);
      this.queueTimer = setInterval(() => { this.refreshQueue(); }, 3000);
    },
    closeQueue() {
      this.queueOpen = false;
      if (this.queueTimer) { clearInterval(this.queueTimer); this.queueTimer = null; }
    },
    async refreshQueue() {
      try {
        const d = await req('/api/system/queue');
        this.queueData = { running: d.running || [], pending: d.pending || [] };
        this.queueErr = '';
      } catch (e) { this.queueErr = e.message; }
    },
    async cancelQueue(it) {
      const ok = await this.askConfirm(
        '终止队列任务',
        `确定终止「${it.title || it.prompt_id}」吗?` +
        (it.state === 'running' ? '\n运行中的任务会被立刻中断。' : '\n排队的任务会从 ComfyUI 队列里删掉。'),
        { confirmText: '终止', danger: true }
      );
      if (!ok) return;
      this.queueBusy = it.prompt_id;
      try {
        const r = await req('/api/system/queue/cancel', { method: 'POST', body: { prompt_id: it.prompt_id } });
        this.notice = r && r.ok ? '已终止队列任务' : ((r && r.message) || '任务已不在队列里');
        await this.refreshQueue();
      } catch (e) { this.err = e.message; }
      finally { this.queueBusy = ''; }
    },

    /* ---------- 界面状态:刷新后回到原来的页面 ---------- */
    /**
     * 恢复「上传衣服」页填的东西。
     * 必须**按类型逐字段**挑:存下来的是旧版本写的值,一个类型不对的字段(比如本该是数组的
     * 存成了 null)直接 Object.assign 进来,渲染时就会抛错 → 整页白屏(实测刷新后白屏就是这个)。
     */
    _mergeQuick(saved) {
      const q = this.quick;
      for (const k of ['garments', 'props', 'pickedShots', 'extraProps']) {
        if (Array.isArray(saved[k])) q[k] = saved[k];
      }
      for (const k of ['shots', 'seconds', 'playbookId']) {
        if (typeof saved[k] === 'number') q[k] = saved[k];
      }
      if (typeof saved.showLib === 'boolean') q.showLib = saved.showLib;
      for (const k of ['garmentDesc', 'scene', 'sceneDesc', 'style', 'extra', 'descMsg',
                       'why', 'baseOutfit', 'customActions']) {
        if (typeof saved[k] === 'string') q[k] = saved[k];
      }
      if (saved.pieces && typeof saved.pieces === 'object' && !Array.isArray(saved.pieces)) {
        q.pieces = saved.pieces;
      }
      // 兜底:这几个字段后面到处当数组用,取不到就给空数组,别留下 undefined / null
      for (const k of ['garments', 'props', 'pickedShots', 'extraProps']) {
        if (!Array.isArray(q[k])) q[k] = [];
      }
      if (!q.pieces || typeof q.pieces !== 'object' || Array.isArray(q.pieces)) q.pieces = {};

    saveUI() {

          scriptForm: this.scriptForm,
          quick: this.quick,
          // 第 2 步(指定素材)整页都靠 plan 渲染 —— 不存它,刷新后就是一张空页
          plan: this.view === 'script' ? this.plan : null,

          autoAssigned: this.autoAssigned,

          extract: { slot: this.extract.slot, desc: this.extract.desc, result: this.extract.result },

    async loadProject(id) {
      this.err = '';
      this.project = await req('/api/projects/' + id);
      this.sel = 0; this.job = this.project.latest_job;
      this.selectedShots = new Set();   // 换项目时清空多选
      this.canvas.sel = []; this.canvas.menu = null; this.composer.open = false;
      this.cameraModal = false;
      this.mentionOpen = false; this.mentionRange = null; this.promptCaretRange = null;
      this.canvas.customNodes = []; this.canvas.links = [];
      this.canvas.addMenu = null; this.canvas.plusDrag = null;
      this.customComposer.open = false;
      this.threeComposer.open = false;
      this.canvas.ready = false; this.canvas.loadedFor = null;
      this.previewJob = null;   // 预览图任务在内存里,进页面时问一次当前进度
      try { this.previewJob = await req(`/api/projects/${id}/preview-images`) } catch (e) { /* 无所谓 */ }
      await this.loadSpeed();

    async restoreUI() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); } catch (e) { saved = null }
      if (!saved || !saved.view || saved.view === 'templates') return;
      if (saved.scriptForm) Object.assign(this.scriptForm, saved.scriptForm);
      if (saved.scriptStep) this.scriptStep = saved.scriptStep;

      if (saved.view === 'quick') {
        try {
          if (!this.quickOpts.scenes.length) this.quickOpts = await req('/api/projects/quick-options');
        } catch (e) { /* 选项拉不到也能用 */ }
        // 玩法列表也要拉:漏了它,刷新后「3. 玩法」下拉就只剩「不使用玩法」一项
        try { this.playbooks = await req('/api/playbooks') } catch (e) { this.playbooks = [] }
        try { this.assets = await req('/api/assets') } catch (e) { /* 同上 */ }
        this._mergeQuick(saved.quick || {});
        this.view = 'quick';
        return;
      }
      if (saved.view === 'script') {
        // 第 2 步(指定素材)整页靠 plan 渲染,老状态里没存 plan 就退回第 1 步,别甩一张空页
        if (saved.plan) {
          this.plan = saved.plan;
          this.assignments = saved.assignments || {};
          this.autoAssigned = saved.autoAssigned || 0;
          this.entityTab = saved.entityTab || 'characters';
        } else if (this.scriptStep === 2) {
          this.scriptStep = 1;
        }
        this.view = 'script'; return
      }
      if (saved.view === 'projects') { await this.loadProjects(); this.view = 'projects'; return }
      if (saved.view === 'shot-mgr') { await this.loadShots(); this.view = 'shot-mgr'; return }
      if (saved.view === 'assets') { await this.loadAssets(); this.view = 'assets'; return }
      if (saved.view === 'film-settings') { await this.loadSpeed(); this.view = 'film-settings'; return }
      if (saved.view === 'garment-split') { this.view = 'garment-split'; return }
      if (saved.view === 'garment-extract') {
        // 结果图是服务器 URL,直接恢复;原图预览(blob)刷新后本来就拿不回
        if (saved.extract && typeof saved.extract === 'object') {
          if (typeof saved.extract.slot === 'string') this.extract.slot = saved.extract.slot;
          if (typeof saved.extract.desc === 'string') this.extract.desc = saved.extract.desc;
          if (saved.extract.result && typeof saved.extract.result === 'object') {
            // 老版本存的是整个响应 {original, result},兼容拆一下
            const r = saved.extract.result;
            this.extract.result = (r.result && r.result.url) ? r.result : r;
          }
        }
        this.view = 'garment-extract'; return
      }
      if (saved.view === 'image-edit') {
        if (saved.ie && typeof saved.ie === 'object') {
          if (typeof saved.ie.instruction === 'string') this.ie.instruction = saved.ie.instruction;
          if (saved.ie.result && typeof saved.ie.result === 'object') this.ie.result = saved.ie.result;
        }
        this.view = 'image-edit'; return
      }
      if (saved.view === 'image-eraser') { this.view = 'image-eraser'; return }
      if ((saved.view === 'editor' || saved.view === 'detail') && saved.projectId) {
        try {
          await this.loadProject(saved.projectId);
          this.sel = Math.max(0, Math.min(saved.sel || 0, this.project.shots.length - 1));
          this.resetDraft();
          this.view = saved.view;
          if (saved.view === 'editor') this.ensureCanvasLayout();
        } catch (e) {
          await this.loadProjects(); this.view = 'projects';   // 项目没了就退回列表
        }
      }
    },

    /* 服装图可以多张:同一套衣服一件一张 —— 读图时模型会逐张认出"这是哪一件" */
    isGarmentPicked(ref) { return this.quick.garments.indexOf(ref) >= 0 },
    toggleGarment(ref) {
      const i = this.quick.garments.indexOf(ref);
      if (i >= 0) this.quick.garments.splice(i, 1);
      else if (this.quick.garments.length >= 8) { this.err = '一套服装最多 8 张图'; return }
      else this.quick.garments.push(ref);

    removeGarment(ref) {
      this.quick.garments = this.quick.garments.filter(g => g !== ref);
      this.quick.pieces = {}; this.quick.descMsg = '';

    /** 这张图被读图认成了哪一件(还没读图就返回空) */
    partOf(ref) {
      const hit = Object.entries(this.quick.pieces || {}).find(([, r]) => r === ref);
      return hit ? hit[0] : '';
    },
    assetOf(ref) {
      const id = Number((ref || '').split(':')[1]);
      return this.assets.find(a => a.id === id) || null;
    },
    async uploadGarment(ev) {
      const files = Array.from((ev.target.files || [])); ev.target.value = '';
      if (!files.length) return;
      this.err = '';
      for (const f of files) {
        const form = new FormData();
        form.append('file', f);
        form.append('category', 'character');
        try {
          const a = await req('/api/assets', { method: 'POST', form });
          this.assets = [a, ...this.assets];
          if (this.quick.garments.length < 8) this.quick.garments.push('asset:' + a.id);
        } catch (e) { this.err = e.message }
      }
      this.quick.pieces = {}; this.quick.descMsg = '';
      this.quick.showLib = false;
    },
    async describeGarment() {
      if (!this.quick.garments.length) { this.err = '先选至少一张服装图'; return; }
      this.err = ''; this.busyQuick = true; this.quick.descMsg = '正在读图(逐张认件)…';
      try {
        const r = await req('/api/projects/describe-garment',
          { method: 'POST', body: { refs: this.quick.garments.slice() } });
        this.quick.garmentDesc = r.description;
        // 「这张图是哪一件」——读图后自动绑图要用它
        this.quick.pieces = {};
        for (const p of (r.pieces || [])) if (p.part) this.quick.pieces[p.part] = p.ref;
        // 风格由衣服决定:调性 / 空间 / 道具都按推荐自动选好
        if (r.style) this.quick.style = r.style;
        if (r.scene) this.quick.scene = r.scene;
        this.quick.props = (r.props || []).slice();
        this.quick.extraProps = (r.extra_props || []).slice();
        this.quick.why = r.why || '';
        // 清单外的建议写进「补充要求」,用户可以直接改
        this.quick.extra = this.quick.extraProps.length
          ? '建议补充道具/动作:' + this.quick.extraProps.join(';')
          : '';

        this.quick.descMsg = `已由 ${r.engine_detail} 读出` + (parts.length
