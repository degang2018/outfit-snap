      if (!cv) return;
      const ctx = cv.getContext('2d');
      const r = cv.getBoundingClientRect();
      const w = Math.max(4, Number(this.staticRr.brush) * (cv.width / Math.max(1, r.width)));
      ctx.globalCompositeOperation = this.staticRr.erasing ? 'destination-out' : 'source-over';
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#fff';
      ctx.lineWidth = w;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
      if (from.x === to.x && from.y === to.y) {
        ctx.beginPath();
        ctx.arc(to.x, to.y, w / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    srSyncMask() {
      const cv = this.$refs.staticRrCanvas;
      if (!cv) return;
      const data = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
      let hit = false;
      for (let i = 3; i < data.length; i += 28) {
        if (data[i] > 8) { hit = true; break; }
      }
      this.staticRr.hasMask = hit;
    },
    srUndo() {
      const cv = this.$refs.staticRrCanvas;
      const hist = this.staticRr.history;
      if (!cv || !hist.length) return;
      const url = hist.pop();
      const img = new Image();
      img.onload = () => {
        const ctx = cv.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        this.srSyncMask();
      };
      img.src = url;
    },
    srClear() {
      const cv = this.$refs.staticRrCanvas;
      if (!cv) return;
      cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
      this.staticRr.hasMask = false;
      this.staticRr.history = [];
    },
    async runStaticRerender() {
      const r = this.staticRr;
      const cv = this.$refs.staticRrCanvas;
      if (!r.open || !r.shotId || r.busy) return;
      r.busy = true;
      r.err = '';
      try {
        const fd = new FormData();
        if (r.hasMask && cv) {
          const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
          if (blob) fd.append('mask', blob, 'mask.png');
        }
        fd.append('instruction', r.prompt || '');
        // req() 默认走 JSON,这里要传 FormData —— 用 fetch 直接发
        const token = (localStorage.getItem('ovs_token') || '').trim();
        const resp = await fetch(`/api/projects/${this.project.id}/shots/${r.shotId}/rerender-static`, {
          method: 'POST',
          headers: token ? { 'Authorization': 'Bearer ' + token } : {},
          body: fd,
        });
        if (!resp.ok) {
          const text = await resp.text();
          let msg = text;
          try { msg = JSON.parse(text).detail || text; } catch (e) {}
          throw new Error(msg || ('HTTP ' + resp.status));
        }
        const updated = await resp.json();
        // 更新 project 里那一镜的 clip_url(加上破缓存参数)
        const cur = this.project && this.project.shots.find(s => s.id === r.shotId);
        if (cur) {
          const bust = '?t=' + Date.now();
          cur.clip_url = (updated.clip_url || '').split('?')[0] + bust;
          cur.thumb_url = cur.clip_url;
          cur.options = updated.options || cur.options;
          cur.status = updated.status || cur.status;
        }
        // 如果这是最后一镜静态图,还要刷 project.final_url
        if (this.project) {
          const staticShots = this.project.shots
            .filter(s => s.options && s.options.static_image)
            .sort((a, b) => a.idx - b.idx);
          if (staticShots.length && staticShots[staticShots.length - 1].id === r.shotId) {
            this.project.final_url = cur ? cur.clip_url : this.project.final_url;
          }
        }
        r.open = false;
        this.notice = '静态图重渲完成';
      } catch (e) {
        r.err = e.message;
      } finally {
        r.busy = false;
      }
    },

    /* ---------- 平移 / 缩放 / 框选 / 拖拽 ---------- */
    stagePointerDown(ev) {
      if (ev.button !== 0) return;
      this.canvas.menu = null;
      this.canvas.addMenu = null;
      const stage = this.$refs.stage;
      if (!stage) return;
      const rect = stage.getBoundingClientRect();
      const sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
      const marquee = (ev.ctrlKey || ev.metaKey) && !this.canvas.space;
      if (marquee) {
        this.canvas.marquee = { x: sx, y: sy, w: 0, h: 0, sx, sy };
      } else {
        if (!this.canvas.space && this.canvas.sel.length) this.canvas.sel = [];
        this.canvas.pan = { sx: ev.clientX, sy: ev.clientY, px: this.canvas.panX, py: this.canvas.panY, moved: false };
      }
      window.addEventListener('pointermove', this.onCanvasMove);
      window.addEventListener('pointerup', this.onCanvasUp);
    },
    nodePointerDown(ev, key) {
      if (ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      this.canvas.menu = null;
      this.canvas.addMenu = null;
      // 触屏没有 hover:按下时也把这一对加号亮出来
      this.canvas.hoverKey = key;
      const multi = ev.shiftKey || ev.ctrlKey || ev.metaKey;
      let sel = [...this.canvas.sel];
      if (multi) {
        if (sel.indexOf(key) >= 0) sel = sel.filter(k => k !== key);
        else sel.push(key);
      } else if (sel.indexOf(key) < 0) {
        sel = [key];
      }
      this.canvas.sel = sel;
      const origins = {};
      for (const k of sel) {
        const p = this.canvas.positions[k];
        if (p) origins[k] = { x: p.x, y: p.y };
      }
      // 只有从预览画面(.node-body)按下去,松手才打开创作面板;点标题栏只选中节点
      const fromBody = !!(ev.target && ev.target.closest && ev.target.closest('.node-body'));
      this.canvas.drag = { key, startX: ev.clientX, startY: ev.clientY, origins, moved: false, multi, fromBody };
      window.addEventListener('pointermove', this.onCanvasMove);
      window.addEventListener('pointerup', this.onCanvasUp);
    },
    startLink(ev, ref) {
      if (ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      const stage = this.$refs.stage;
      if (!stage) return;
      const rect = stage.getBoundingClientRect();
      const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
      this.canvas.link = { ref, sx: x, sy: y, x, y };
      this.canvas.menu = null;
      window.addEventListener('pointermove', this.onCanvasMove);
      window.addEventListener('pointerup', this.onCanvasUp);
    },
    onCanvasMove(ev) {
      // 平移
      if (this.canvas.pan) {
        const p = this.canvas.pan;
        const dx = ev.clientX - p.sx, dy = ev.clientY - p.sy;
        if (Math.abs(dx) + Math.abs(dy) > 3) p.moved = true;
        this.canvas.panX = p.px + dx;
        this.canvas.panY = p.py + dy;
        return;
      }
      // 拖动节点
      if (this.canvas.drag) {
        const d = this.canvas.drag;
        const dx = (ev.clientX - d.startX) / this.canvas.zoom;
        const dy = (ev.clientY - d.startY) / this.canvas.zoom;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) d.moved = true;
        if (!d.moved) return;
        const positions = { ...this.canvas.positions };
        for (const k of Object.keys(d.origins)) {
          const o = d.origins[k];
          let x = Math.round(o.x + dx), y = Math.round(o.y + dy);
          if (this.canvas.snap && !ev.altKey) {
            x = Math.round(x / 20) * 20;
            y = Math.round(y / 20) * 20;
          }
          positions[k] = { x, y };
        }
        this.canvas.positions = positions;
        return;
      }
      // 框选
      if (this.canvas.marquee) {
        const m = this.canvas.marquee;
        const stage = this.$refs.stage;
        const rect = stage.getBoundingClientRect();
        const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
        m.x = Math.min(m.sx, x); m.y = Math.min(m.sy, y);
        m.w = Math.abs(x - m.sx); m.h = Math.abs(y - m.sy);
        return;
      }
      // 拖连线
      if (this.canvas.link) {
        const stage = this.$refs.stage;
        const rect = stage.getBoundingClientRect();
        this.canvas.link.x = ev.clientX - rect.left;
        this.canvas.link.y = ev.clientY - rect.top;
      }
    },
    async onCanvasUp(ev) {
      window.removeEventListener('pointermove', this.onCanvasMove);
      window.removeEventListener('pointerup', this.onCanvasUp);
      // 平移收尾
      if (this.canvas.pan) {
        const moved = this.canvas.pan.moved;
        this.canvas.pan = null;
        if (moved) this.saveCanvasStateSoon();
        return;
      }
      // 节点点击 / 拖动收尾
      if (this.canvas.drag) {
        const d = this.canvas.drag;
        this.canvas.drag = null;
        if (d.moved) {
          this.canvas.lastDragAt = Date.now();
          this.saveCanvasStateSoon();
        } else if (!d.multi && d.fromBody && d.key.indexOf('shot:') === 0 && this.project) {
          const id = Number(d.key.slice(5));
          const idx = this.project.shots.findIndex(s => s.id === id);
          if (idx >= 0) this.openComposer(this.project.shots[idx], idx);
        }
        return;
      }
      // 框选收尾
      if (this.canvas.marquee) {
        const m = this.canvas.marquee;
        this.canvas.marquee = null;
        const x1 = (m.x - this.canvas.panX) / this.canvas.zoom;
        const y1 = (m.y - this.canvas.panY) / this.canvas.zoom;
        const x2 = x1 + m.w / this.canvas.zoom;
        const y2 = y1 + m.h / this.canvas.zoom;
        const hit = [];
        for (const g of this.canvasRefNodes) {
          if (g.x < x2 && g.x + g.w > x1 && g.y < y2 && g.y + g.h > y1) hit.push(g.key);
        }
        for (const n of this.canvasShotNodes) {
          if (n.x < x2 && n.x + 288 > x1 && n.y < y2 && n.y + 374 > y1) hit.push('shot:' + n.shot.id);
        }
        for (const n of this.canvas.customNodes) {
          const r = this.nodeRectByKey('custom:' + n.id);
          if (r && r.x < x2 && r.x + r.w > x1 && r.y < y2 && r.y + r.h > y1) {
            hit.push('custom:' + n.id);
          }
        }
        this.canvas.sel = hit;
        return;
      }
      // 连线落点:丢到哪个分镜节点上,就把它加成该镜的参考图
      if (this.canvas.link) {
        const link = this.canvas.link;
        this.canvas.link = null;
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        const host = el && el.closest ? el.closest('[data-shot-id]') : null;
        if (host && this.project) {
          const id = Number(host.getAttribute('data-shot-id'));
          const s = this.project.shots.find(x => x.id === id);
          if (s) await this.addRefToShot(s, link.ref);
        }
      }
    },
    stageWheel(ev) {
      const stage = this.$refs.stage;
      if (!stage) return;
      const rect = stage.getBoundingClientRect();
      this.zoomAt(ev.clientX - rect.left, ev.clientY - rect.top,
        this.canvas.zoom * (ev.deltaY > 0 ? 0.9 : 1.1));
    },
    zoomAt(mx, my, target) {
      const z = Math.min(2.2, Math.max(0.2, target));
      const old = this.canvas.zoom;
      if (!old) return;
      this.canvas.panX = mx - (mx - this.canvas.panX) * (z / old);
      this.canvas.panY = my - (my - this.canvas.panY) * (z / old);
      this.canvas.zoom = z;
      this.saveCanvasStateSoon();
    },
    zoomBy(f) {
      const stage = this.$refs.stage;
      if (!stage) return;
      this.zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, this.canvas.zoom * f);
    },
    canvasBounds() {
      const rects = [];
      for (const g of this.canvasRefNodes) rects.push({ x: g.x, y: g.y, w: g.w, h: g.h });
      for (const n of this.canvasShotNodes) rects.push({ x: n.x, y: n.y, w: 288, h: 374 });
      for (const n of this.canvas.customNodes) {
        const r = this.nodeRectByKey('custom:' + n.id);
        if (r) rects.push(r);
      }
      const add = this.canvasAddNodePos;
      rects.push({ x: add.x, y: add.y, w: 288, h: 112 });
      if (!rects.length) return null;
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      for (const r of rects) {
        x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y);
        x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h);
      }
      return { x: x1, y: y1, w: Math.max(1, x2 - x1), h: Math.max(1, y2 - y1) };
    },
    fitCanvas() {
      const stage = this.$refs.stage;
      if (!stage) return;
      const b = this.canvasBounds();
      if (!b) return;
      const pad = 56;
      const z = Math.min(1.15, Math.max(0.22, Math.min(
        (stage.clientWidth - pad * 2) / b.w,
        (stage.clientHeight - pad * 2) / b.h)));
      this.canvas.zoom = z;
      this.canvas.panX = (stage.clientWidth - b.w * z) / 2 - b.x * z;
      this.canvas.panY = (stage.clientHeight - b.h * z) / 2 - b.y * z;
      this.saveCanvasStateSoon();
    },
    autoLayout() {
      this.ensureCanvasLayout(true, false);
      this.notice = '已按镜头顺序重新排列节点';
    },
    /* ---------- 节点操作 ---------- */
    async openComposer(s, i) {
      if (!s || !this.project) return;
      const idx = (i === undefined || i === null)
        ? this.project.shots.findIndex(x => x.id === s.id) : i;
      if (idx < 0) return;
      if (this.shot && this.shot.id !== s.id && this.dirty
          && !(await this.askConfirm('切换镜头',
            '当前镜头有未保存的修改，切换会丢失。确定切换吗？',
            { confirmText: '切换' }))) return;
      if (this.sel !== idx) this.sel = idx;
      else if (!this.draft) this.resetDraft();
      this.composer.open = true;
      this.customComposer.open = false;
      this.threeComposer.open = false;
      this.candMsg = '';
      this.finalPrompt = { open: false, loading: false, text: '', notes: [], warnings: [], refs: 0 };
      this.styleRef = { url: '', picture: 0, loading: false };
      this.loadStyleRef(s);
      this.canvas.sel = ['shot:' + s.id];
      this.canvas.menu = null;
      this.cameraModal = false;
      this.mentionOpen = false;
      this.$nextTick(() => this.renderPromptEditor());
    },
    closeComposer() {
      this.composer.open = false;
      this.mentionOpen = false;
      this.mentionRange = null;
      this.promptCaretRange = null;
    },
    /** 通用 / 自定义分镜:换装链尾帧会被自动当作参考图,这里只读展示出来 */
    async loadStyleRef(s) {
      const sid = s && s.id;
      if (!sid || !this.project) return;
      try {
        const r = await req('/api/projects/' + this.project.id + '/shots/' + sid + '/style-ref');
        if (!this.shot || this.shot.id !== sid) return;
        // 换装镜重渲后,尾帧文件会被覆盖但 URL 没变 —— 不加版本号浏览器会一直用缓存的旧图
        const u = (r && r.url) || '';
        this.styleRef = {
          url: u ? u + (u.includes('?') ? '&' : '?') + 'v=' + Date.now() : '',
          picture: (r && r.picture) || 0, loading: false
        };
      } catch (e) { /* 取不到就不显示,不影响编辑 */ }
    },
    /** 部分浏览器 / 自动化只发 click,不出 pointer 事件 —— 兜一手,避免节点点不开 */
    onShotNodeClick(s) {
      if (Date.now() - (this.canvas.lastDragAt || 0) < 250) return;
      if (this.composer.open && this.shot && this.shot.id === s.id) return;
      this.openComposer(s);
    },
    async composerGenerate() {
      if (!this.shot) return;
      if (this.dirty) {
        const ok = await this.saveDraft();
        if (!ok) return;
      }
      // 生成时把真正发给模型的文案亮出来(不阻塞生成)
      this.finalPrompt.open = true;
      this.loadFinalPrompt();
      await this.renderShot();
    },
    /** 展开 / 收起「最终文案」;展开时重新拉一次,保证和已保存的设置一致 */
    async toggleFinalPrompt() {
      if (this.finalPrompt.open) {
        this.finalPrompt.open = false;
        return;
      }
      this.finalPrompt.open = true;
      await this.loadFinalPrompt();
    },
    async loadFinalPrompt() {
      if (!this.shot || !this.project) return;
      this.finalPrompt.loading = true;
      try {
        // 有未保存修改先落库,否则看到的文案和生成时发出去的不是同一份
        if (this.dirty) await this.saveDraft();
        const res = await req(`/api/projects/${this.project.id}/shots/${this.shot.id}/final-prompt`);
        this.finalPrompt.text = res.prompt || '';
        this.finalPrompt.notes = res.notes || [];
        this.finalPrompt.warnings = res.warnings || [];
        this.finalPrompt.refs = res.refs || 0;
      } catch (e) {
        this.finalPrompt.text = '读取失败:' + e.message;
        this.finalPrompt.notes = [];
        this.finalPrompt.warnings = [];
      } finally {
        this.finalPrompt.loading = false;
      }
    },
    async copyFinalPrompt() {
      const text = this.finalPrompt.text || '';
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      this.notice = '已复制最终文案';
    },
    /** 底部面板的 AI 优化:先问一句想怎么改,再调模型(留空 = 整体润色) */
    async composerOptimize() {
      const text = await this.askInput('AI 优化',
        '告诉 AI 想怎么改这一镜（留空 = 整体润色）', this.optimizeAsk || '',
        { confirmText: '开始优化' });
      if (text === null) return;
      this.optimizeAsk = String(text);
      await this.optimizePrompt();
    },
    /** 单镜精简:把当前草稿里的长提示词压成 2-5 句自然语言(只改草稿,保存后生效) */
    async condensePrompt() {
      if (!this.draft || this.condensing) return;
      this.err = '';
      this.optimizeMsg = '';
      this.condensing = true;
      try {
        const res = await req(`/api/projects/${this.project.id}/condense-prompt`, {
          method: 'POST', body: { prompt: this.draft.prompt }
        });
        this.draft.prompt = res.prompt;
        this.$nextTick(() => this.renderPromptEditor());
        this.markDirty();
        this.optimizeMsg = `${res.engine_detail}完成，确认后点「保存」生效。`;
      } catch (e) { this.err = e.message }
      finally { this.condensing = false }
    },
    /* ---------- 多角度机位 ---------- */
    /** 距离(米) -> 景别,和后端 camera.py 的阈值保持一致 */
    framingLabel(d) {
      const v = Number(d);
      const x = Number.isFinite(v) ? v : 4;
      if (x <= 1.8) return '特写';
      if (x <= 2.8) return '近景';
      if (x <= 4.6) return '中景';
      if (x <= 6.6) return '中近景';
      if (x <= 8.6) return '全身';
      return '远景';
    },
    /** 把机位参数翻译成给人看的短句(和前端按钮/摘要保持一致) */
    cameraLabel(cam) {
      const sides = [[0, '正面'], [45, '右前方'], [90, '右侧'], [135, '右后方'],
                     [180, '背面'], [225, '左后方'], [270, '左侧'], [315, '左前方']];
      const az = ((Number(cam && cam.azimuth) || 0) % 360 + 360) % 360;
      let side = '正面', best = 999;
      for (const p of sides) {
        const d = Math.min(Math.abs(az - p[0]), 360 - Math.abs(az - p[0]));
        if (d < best) { best = d; side = p[1]; }
      }
      const el = Number(cam && cam.elevation) || 0;
      const tilt = Math.abs(el) < 8 ? '平视' : ((el > 0 ? '俯拍 ' : '仰拍 ') + Math.abs(Math.round(el)) + '°');
      const dist = Number.isFinite(Number(cam && cam.distance))
        ? Number(cam.distance)
        : 1 + (Number.isFinite(Number(cam && cam.scale)) ? Number(cam.scale) : 50) / 100 * 9;
      const mode = cam && cam.subject_mode === 'follow' ? '人随镜头转' : '人朝正前方';
      return side + ' · ' + tilt + ' · ' + dist.toFixed(1) + '米 ' + this.framingLabel(dist) + ' · ' + mode;
    },
    openCamera() {
      if (!this.draft) return;
      const cam = (this.draft.options && this.draft.options.camera) || {};
      const hasDist = Number.isFinite(Number(cam.distance));
      const sc = Number.isFinite(Number(cam.scale)) ? Number(cam.scale) : 50;
      this.cameraDraft = {
        azimuth: Number.isFinite(Number(cam.azimuth)) ? Number(cam.azimuth) : 0,
        elevation: Number.isFinite(Number(cam.elevation)) ? Number(cam.elevation) : 0,
        distance: hasDist ? Number(cam.distance) : Math.round((1 + sc / 100 * 9) * 10) / 10,
        subject_mode: cam.subject_mode === 'follow' ? 'follow' : 'fixed'
      };
      this.cameraModal = true;
      this.canvas.menu = null;
    },
    closeCamera() {
      this.onCameraDragEnd();
      const changed = this.cameraChanged;
      this.cameraModal = false;
      // 调完角度直接点 × / 点遮罩关闭时,把改动带上,免得白调一场
      if (changed) this.cameraApply(false);
    },
    cameraReset() {
      this.cameraDraft = { azimuth: 0, elevation: 0, distance: 4, subject_mode: 'fixed' };
    },
    applyCameraPreset(p) {
      this.cameraDraft.azimuth = p.az;
      this.cameraDraft.elevation = p.el;
    },
    cameraPresetActive(p) {
      const az = Number(this.cameraDraft.azimuth) || 0;
      const el = Number(this.cameraDraft.elevation) || 0;
      return Math.min(Math.abs(az - p.az), 360 - Math.abs(az - p.az)) <= 3
        && Math.abs(el - p.el) <= 3;
    },
    nudgeCamera(daz, del) {
      this.cameraDraft.azimuth = (((Number(this.cameraDraft.azimuth) || 0) + daz) % 360 + 360) % 360;
      this.cameraDraft.elevation = Math.max(-30, Math.min(60,
        (Number(this.cameraDraft.elevation) || 0) + del));
    },
    /* ---------- 直接在圆球/画面上拖动摄像机 ---------- */
    startCameraDrag(ev) {
      if (ev.button !== undefined && ev.button !== 0) return;
      // 上一次拖拽如果没收到 pointerup(松手在窗口外),这里会一直卡着 —— 先收尾再重新开始
      if (this.cameraDrag) this.onCameraDragEnd();
      ev.preventDefault();
      this.cameraDrag = {
        startX: ev.clientX,
        startY: ev.clientY,
        az: Number(this.cameraDraft.azimuth) || 0,
        el: Number(this.cameraDraft.elevation) || 0
      };
      try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) { /* 不支持就算了 */ }
      window.addEventListener('pointermove', this.onCameraDragMove);
      window.addEventListener('pointerup', this.onCameraDragEnd);
      window.addEventListener('pointercancel', this.onCameraDragEnd);
    },
    onCameraDragMove(ev) {
      const d = this.cameraDrag;
      if (!d) return;
      const dx = ev.clientX - d.startX, dy = ev.clientY - d.startY;
      this.cameraDraft.azimuth = Math.round(((d.az + dx * 0.55) % 360 + 360) % 360);
      this.cameraDraft.elevation = Math.round(Math.max(-30, Math.min(60, d.el - dy * 0.35)));
    },
    onCameraDragEnd() {
      this.cameraDrag = null;
      window.removeEventListener('pointermove', this.onCameraDragMove);
      window.removeEventListener('pointerup', this.onCameraDragEnd);
      window.removeEventListener('pointercancel', this.onCameraDragEnd);
    },
    /** 滚轮在画面上推拉机位(改变到人物的距离,单位米) */
    cameraWheel(ev) {
      const d = Number(this.cameraDraft.distance);
      const base = Number.isFinite(d) ? d : 4;
      const next = base + (ev.deltaY > 0 ? 0.3 : -0.3);
      this.cameraDraft.distance = Math.max(1, Math.min(10, Math.round(next * 10) / 10));
    },
    /** 把当前机位写进这一镜的 options.camera;生成时后端会转成提示词子句 */
    cameraApply(generate) {
      if (!this.draft) return;
      const az = ((Math.round(Number(this.cameraDraft.azimuth) || 0) % 360) + 360) % 360;
      const el = Math.max(-30, Math.min(60, Math.round(Number(this.cameraDraft.elevation) || 0)));
      const dist = Math.max(1, Math.min(10, Math.round((Number(this.cameraDraft.distance) || 4) * 10) / 10));
      const mode = this.cameraDraft.subject_mode === 'follow' ? 'follow' : 'fixed';
      // scale 只为兼容旧数据/小球位置;真正进提示词的是 distance + subject_mode
      const sc = Math.max(0, Math.min(100, Math.round((dist - 1) / 9 * 100)));
      const cam = { azimuth: az, elevation: el, distance: dist, subject_mode: mode, scale: sc };
      this.draft.options = { ...(this.draft.options || {}), camera: cam };
      this.markDirty();
      this.cameraModal = false;
      const label = this.cameraLabel(cam);
      this.notice = generate
        ? '机位已写入提示词:' + label + ',正在按这个角度生成…'
        : '机位已写入提示词:' + label + '(记得保存或直接生成)';
      if (generate) this.composerGenerate();
    },
    cameraClear() {
      if (!this.draft) return;
      const opts = { ...(this.draft.options || {}) };
      delete opts.camera;
      this.draft.options = opts;
      this.markDirty();
      this.cameraModal = false;
    },
    clearCanvasSel() { this.canvas.sel = [] },
    menuShot() {
      const k = this.canvas.menu && this.canvas.menu.key;
      if (!k || k.indexOf('shot:') !== 0 || !this.project) return null;
      const id = Number(k.slice(5));
      return this.project.shots.find(s => s.id === id) || null;
    },
    openNodeMenu(ev, key) {
      ev.preventDefault();
      ev.stopPropagation();
      if (this.canvas.sel.indexOf(key) < 0) this.canvas.sel = [key];
      this.canvas.menu = {
        x: Math.min(ev.clientX, window.innerWidth - 210),
        y: Math.min(ev.clientY, window.innerHeight - 300),
        key
      };
    },
    async nodeMenuAction(action) {
      const s = this.menuShot();
      this.canvas.menu = null;
      if (!s) return;
      const idx = this.project.shots.findIndex(x => x.id === s.id);
      if (action === 'open') {
        this.openComposer(s, idx);
      } else if (action === 'render') {
        this.openComposer(s, idx);
        await this.$nextTick();
        if (!this.dirty) await this.renderShot();
      } else if (action === 'preview') {
        this.openComposer(s, idx);
        await this.$nextTick();
        await this.previewOneShot();
      } else if (action === 'condense') {
        this.openComposer(s, idx);
        await this.$nextTick();
        await this.condensePrompt();
      } else if (action === 'download') {
        if (s.clip_url) {
          const a = document.createElement('a');
          a.href = s.clip_url; a.download = ''; a.click();
        }
      } else if (action === 'copy') {
        try { await navigator.clipboard.writeText(s.prompt || ''); this.notice = '提示词已复制' }
        catch (e) { this.err = '复制失败,请手动选中提示词' }
      } else if (action === 'rename') {
        const t = await this.askInput('重命名节点', '输入新的镜头名称', s.title || s.key);
        if (t === null) return;
        const title = String(t).trim();
        if (!title) return;
        try {
          const updated = await req('/api/projects/' + this.project.id + '/shots/' + s.id, {
            method: 'PATCH', body: { title }
          });
          Object.assign(s, updated);
          if (this.shot && this.shot.id === s.id) this.resetDraft();
          this.notice = '已重命名';
        } catch (e) { this.err = e.message }
      } else if (action === 'idea') {
        this.openComposer(s, idx);
        await this.$nextTick();
        await this.saveAsIdea();
      } else if (action === 'delete') {
        await this.deleteCanvasShot(s);
      }
    },
    async addRefToShot(s, ref) {
      if (!s || !ref || !this.project) return;
      if ((s.refs || []).indexOf(ref) >= 0) {
        this.notice = '这张参考图已经在这个镜头里了';
        return;
      }
      this.err = '';
      try {
        const refs = [...(s.refs || []), ref];
        const updated = await req('/api/projects/' + this.project.id + '/shots/' + s.id, {
          method: 'PATCH', body: { refs }
        });
        Object.assign(s, updated);
        if (this.shot && this.shot.id === s.id && this.draft) {
          this.draft.refs = [...(updated.refs || refs)];
          this.markDirty();
        }
        this.notice = '已把参考图接进「' + (s.title || s.key) + '」';
      } catch (e) { this.err = e.message }
    },
    async deleteCanvasShot(s) {
      if (!s || !this.project) return;
      const idx = this.project.shots.findIndex(x => x.id === s.id);
      if (idx < this.floatChainEnd) {
        this.err = '换装链上的分镜属于核心结构,不能删除;可以删除后面的通用分镜。';
        return;
      }
      if (!(await this.askConfirm('删除镜头',
        '删除镜头 ' + (idx + 1) + '(' + (s.title || s.key) + ')?此操作不可撤销。',
        { danger: true, confirmText: '删除' }))) return;
      this.err = '';
      try {
        await req('/api/projects/' + this.project.id + '/shots/' + s.id, { method: 'DELETE' });
        this.composer.open = false;
        await this.openProject({ id: this.project.id });
      } catch (e) { this.err = e.message }
    },
    async canvasBatchDelete() {
      const customKeys = this.canvas.sel.filter((k) => k.indexOf('custom:') === 0);
      if (customKeys.length) {
        if (!(await this.askConfirm('删除节点',
          '删除选中的 ' + customKeys.length + ' 个自定义节点?',
          { danger: true, confirmText: '删除' }))) return;
        const ids = new Set(customKeys.map((k) => k.slice(7)));
        this.canvas.customNodes = this.canvas.customNodes.filter((n) => !ids.has(n.id));
        const positions = { ...this.canvas.positions };
        customKeys.forEach((k) => { delete positions[k]; });
        this.canvas.positions = positions;
        this.canvas.links = this.canvas.links.filter((l) =>
          customKeys.indexOf(l.from) < 0 && customKeys.indexOf(l.to) < 0);
        this.canvas.sel = [];
        this.saveCanvasState();
        return;
      }
      const all = this.canvasSelectedShots;
      const chainEnd = this.floatChainEnd;
      const del = all.filter(s => this.project.shots.findIndex(x => x.id === s.id) >= chainEnd);
      if (!del.length) {
        this.err = '选中的节点里没有可删除的通用分镜(换装链不能删)';
        return;
      }
      if (!(await this.askConfirm('删除分镜',
        '删除选中的 ' + del.length + ' 个通用分镜?此操作不可撤销。',
        { danger: true, confirmText: '删除' }))) return;
      this.err = '';
      try {
        for (const s of del) {
          await req('/api/projects/' + this.project.id + '/shots/' + s.id, { method: 'DELETE' });
        }
        this.composer.open = false;
        await this.openProject({ id: this.project.id });
      } catch (e) { this.err = e.message }
    },
    async canvasBatchDownload() {
      const ids = this.canvasSelectedShots.filter(s => s.clip_url).map(s => s.id);
      if (!ids.length) { this.err = '请先选中已生成片段的镜头'; return }
      this.err = '';
      try {
        const blob = await req('/api/projects/' + this.project.id + '/shots/download-zip', {
          method: 'POST', body: { shot_ids: ids }, raw: true
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (this.project.title || 'project') + '_shots.zip';
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) { this.err = e.message }
    },
    async sortShotsByCanvas() {
      if (!this.project) return;
      const end = this.floatChainEnd || 0;
      const posOf = {};
      for (const n of this.canvasShotNodes) posOf[n.shot.id] = n;
      const head = this.project.shots.slice(0, end);
      const rest = this.project.shots.slice(end).sort((a, b) => {
        const na = posOf[a.id], nb = posOf[b.id];
        if (!na || !nb) return 0;
        return (na.y - nb.y) || (na.x - nb.x);
      });
      const ids = head.concat(rest).map(s => s.id);
      try {
        await req('/api/projects/' + this.project.id + '/shots/reorder', {
          method: 'POST', body: { shot_ids: ids }
        });
        await this.openProject({ id: this.project.id });
        this.notice = '已按画布位置重排镜头';
      } catch (e) { this.err = e.message }
    },
    canvasMatch(s) {
      const q = (this.canvas.search || '').trim().toLowerCase();
      if (!q) return null;
      return (s.title || '').toLowerCase().indexOf(q) >= 0
        || (s.prompt || '').toLowerCase().indexOf(q) >= 0;
    },
    jumpToSearch() {
      const q = (this.canvas.search || '').trim().toLowerCase();
      if (!q) return;
      const n = this.canvasShotNodes.find(x =>
        (x.shot.title || '').toLowerCase().indexOf(q) >= 0
        || (x.shot.prompt || '').toLowerCase().indexOf(q) >= 0);
      if (!n) { this.err = '没有找到匹配的镜头'; return }
      this.err = '';
      const stage = this.$refs.stage;
      if (!stage) return;
      const z = Math.max(0.55, this.canvas.zoom);
      this.canvas.zoom = z;
      this.canvas.panX = stage.clientWidth / 2 - (n.x + 144) * z;
      this.canvas.panY = stage.clientHeight / 2 - (n.y + 187) * z;
      this.canvas.sel = ['shot:' + n.shot.id];
      this.saveCanvasStateSoon();
    },
    /* ---------- 预览 / 视频悬停 ---------- */
    openLightboxShot(s) {
      if (!s) return;
      // 静态图分镜的 clip_url 是 .png —— 必须当图片预览;塞进 <video> 只会得到黑屏播放器
      const kind = (u) => (this.isImageUrl(u) ? 'image' : 'video');
      if (s.clip_url) this.lightbox = { type: kind(s.clip_url), url: s.clip_url, title: s.title || s.key };
      else if (s.preview_url) this.lightbox = { type: 'image', url: s.preview_url, title: s.title || s.key };
      else if (s.candidates && s.candidates.length) {
        this.lightbox = { type: kind(s.candidates[0]), url: s.candidates[0], title: s.title || s.key };
      }
    },
    openLightboxImage(url, title) { if (url) this.lightbox = { type: 'image', url, title: title || '' } },
    // 静态图镜的候选是 PNG,不能塞进视频播放器(会黑屏)
    openLightboxVideo(url, title) {
      if (url) this.lightbox = { type: this.isImageUrl(url) ? 'image' : 'video', url, title: title || '' };
    },
    /** 画布节点:点播放才加载这一个视频,默认只显示首帧图 */
    playNodeVideo(s) {
      if (s && s.clip_url) this.playingShotId = s.id;
    },
    onThumbError(ev, s) {
      const img = ev && ev.target;
      if (!img) return;

        return;
      }
      img.style.display = 'none';

    shotNodeStatus(s) {
      if (this.jobForShot(s)) return { t: '生成中', cls: 'warn' };
      if (s.clip_url) return { t: '已生成', cls: 'ok' };
      if (s.status === 'failed') return { t: '失败', cls: 'bad' };
      return { t: '未生成', cls: '' };

    /* ---------- 快捷键 ---------- */
    isTypingTarget(el) {
      return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'
        || el.tagName === 'SELECT' || el.isContentEditable);
    },
    onCanvasKeyDown(ev) {
      if (this.view !== 'editor') return;
      if (ev.code === 'Space' && !this.isTypingTarget(ev.target)) {
        this.canvas.space = true;
        ev.preventDefault();
        return;
      }
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') {
        if (this.draft && this.dirty) { ev.preventDefault(); this.saveDraft() }
        return;
      }
      if (ev.key === 'Escape') {
        if (this.mentionOpen) { this.mentionOpen = false; this.mentionRange = null; return; }
        if (this.cameraModal) { this.cameraModal = false; return; }
        this.canvas.menu = null;
        this.canvas.addMenu = null;
        this.lightbox = null;
        this.composer.open = false;
        return;
      }
      if ((ev.key === 'Delete' || ev.key === 'Backspace') && !this.isTypingTarget(ev.target)) {
        if (this.canvas.sel.length) { ev.preventDefault(); this.canvasBatchDelete() }
      }
    },
    onCanvasKeyUp(ev) {
      if (ev.code === 'Space') this.canvas.space = false;
    },

    async cancel() { if (this.job) this.job = await req(`/api/jobs/${this.job.id}/cancel`, { method: 'POST' }) },
    async poll() {
      // 「我的项目」页:只有真的有任务在跑时才刷新,免得列表每 3 秒重渲染一次
      if (this.view === 'projects' && this.projects.some(p => ['queued', 'running'].includes(p.status))) {
        try { await this.fetchProjects() } catch (e) { /* transient */ }
      }
      // 「项目详情」页:同样只在有任务在跑时刷新片段与成片
      if (this.view === 'detail' && this.project && this.anyBusy) {
        try { await this.refreshShots() } catch (e) { /* transient */ }
      }
      // 整片任务
      if (this.job && ['queued', 'running'].includes(this.job.status)) {
        try {
          this.job = await req('/api/jobs/' + this.job.id);
          if (!['queued', 'running'].includes(this.job.status)) await this.refreshShots();
        } catch (e) { /* transient */ }
      }
      // 预览图任务
      if (this.previewRunning && this.project) {
        try {
          const st = await req(`/api/projects/${this.project.id}/preview-images`);
          this.previewJob = st;
          if (st.status !== 'running') await this.refreshShots();
        } catch (e) { /* transient */ }
      }
      // 单镜任务
      const active = Object.entries(this.shotJobs).filter(([, j]) => ['queued', 'running'].includes(j.status));
      for (const [sid, j] of active) {
        try {
          const updated = await req('/api/jobs/' + j.id);
          this.shotJobs = { ...this.shotJobs, [sid]: updated };
          if (!['queued', 'running'].includes(updated.status)) await this.refreshShots();
        } catch (e) { /* transient */ }
      }
    },

    async refreshShots() {

      for (const s of p.shots) {
        const cur = this.project.shots.find(x => x.id === s.id);
        if (cur) { cur.status = s.status; cur.clip_url = s.clip_url; cur.preview_url = s.preview_url;
                   cur.candidates = s.candidates || []; }
      }
      this.project.status = p.status;

    /* ---------- 衣服分割:平铺商品图 → 每件单独一张(后端按原像素无损裁出) ---------- */
    splitPickFile(ev) {
      const f = ev.target.files && ev.target.files[0];
      ev.target.value = '';          // 清空,同一张图再选一次也能触发 change
      if (f) this.splitSetFile(f);
    },
    splitDropFile(ev) {
      this.split.drag = false;
      const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (f) this.splitSetFile(f);
    },
    splitSetFile(f) {
      if (!/^image\//.test(f.type || '')) { this.err = '请选择图片文件(PNG / JPG / WEBP)'; return }
      this.err = '';
      if (this.split.srcUrl) URL.revokeObjectURL(this.split.srcUrl);
      this.splitFile = f;
      this.split.name = f.name;
      this.split.w = 0; this.split.h = 0;
      this.split.result = null;
      this.split.srcUrl = URL.createObjectURL(f);
      const im = new Image();
      im.onload = () => { this.split.w = im.naturalWidth; this.split.h = im.naturalHeight };
      im.src = this.split.srcUrl;
    },
    async splitRun() {
      if (!this.splitFile || this.split.busy) return;
      this.err = ''; this.notice = ''; this.split.busy = true;
      try {
        const form = new FormData();
        form.append('file', this.splitFile);
        form.append('parts', String(this.split.parts || 0));
        form.append('tolerance', String(this.split.tolerance || 20));
        form.append('transparent', this.split.transparent ? 'true' : 'false');
        this.split.result = await req('/api/split', { method: 'POST', form });
        this.notice = `已分割出 ${this.split.result.parts.length} 件(原图像素 1:1,PNG 无损)`;
      } catch (e) {
        this.err = e.message;
      } finally { this.split.busy = false }
    },
    /** 取回文件再另存:这样下载文件名由我们定(分割件 / 擦除结果 / 素材图都用它) */
    async fileDownload(url, filename) {
      try {
        const blob = await req(url, { raw: true });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      } catch (e) { this.err = e.message }
    },
    splitDownload(p) { return this.fileDownload(p.url, p.filename) },
    async splitDownloadAll() {
      const parts = (this.split.result && this.split.result.parts) || [];
      for (const p of parts) {
        await this.splitDownload(p);
        await new Promise(r => setTimeout(r, 300));   // 连着点太密浏览器会拦
      }
    },

    /* ---------- 提取衣服:真人穿着照 → 白底平铺商品图(后端走 FLUX3 Klein) ---------- */
    extractPickFile(ev) {

      this.err = '';

      this.extract.result = null;

    async extractRun() {

      try {

        this.notice = '提取完成(白底平铺图,PNG)';
        this.extract.imgOk = false; this.extract.imgErr = false; this.extract.imgRetry = 0; this.extract.imgTick = Date.now();
        this.saveUISoon();   // 结果存进 localStorage,刷新后还在

    /* 结果图加载失败时先自动重试 3 次(后端正在忙别的生成时图片请求会被挂起),
       3 次都失败才亮出「重新加载」按钮 */
    _imgAutoRetry(state) {
      if (state.imgRetry >= 3) { state.imgErr = true; return }
      state.imgRetry++;
      setTimeout(() => { state.imgOk = false; state.imgTick = Date.now() }, 1500 * state.imgRetry);
    },
    extractImgFail() { this._imgAutoRetry(this.extract) },
    extractImgReload() {
      const e = this.extract;
      e.imgErr = false; e.imgOk = false; e.imgRetry = 0; e.imgTick = Date.now();
    },

    /* ---------- 图片编辑:多图 + 一句话(Nano Banana 玩法),可涂抹局部编辑 ---------- */
    iePickFiles(ev) {
      const fs = Array.from(ev.target.files || []);
      ev.target.value = '';
      this.ieAdd(fs);
    },
    ieDropFiles(ev) {
      this.ie.drag = false;
      this.ieAdd(Array.from((ev.dataTransfer && ev.dataTransfer.files) || []));
    },
    ieAdd(fs) {
      this.err = '';
      for (const f of fs) {
        if (this.ie.files.length >= 6) { this.err = '最多 6 张图'; break }
        if (!/^image\//.test(f.type || '')) { this.err = '只支持图片文件'; continue }
        const it = { f, url: URL.createObjectURL(f), name: f.name, w: 0, h: 0 };
        const im = new Image();
        im.onload = () => {
          it.w = im.naturalWidth; it.h = im.naturalHeight;
          if (this.ie.files[0] === it) this.ieResetMask();
        };
        im.src = it.url;
        this.ie.files.push(it);
      }
      this.ie.result = null;
    },
    ieRemove(i) {
      const it = this.ie.files.splice(i, 1)[0];
      if (it) URL.revokeObjectURL(it.url);
      if (i === 0) this.ieResetMask();
    },
    /* 把 @N 插入输入框光标处(点徽章 / 拖图都走这里) */
    ieInsertRef(i) {
      const ta = this.$refs.ieText;
      const token = `@${i + 1}`;
      if (!ta) { this.ie.instruction += (this.ie.instruction ? ' ' : '') + token; return }
      const s = ta.selectionStart ?? this.ie.instruction.length;
      const e = ta.selectionEnd ?? s;
      const cur = this.ie.instruction;
      this.ie.instruction = cur.slice(0, s) + token + cur.slice(e);
      this.$nextTick(() => { ta.focus(); ta.selectionStart = ta.selectionEnd = s + token.length });
    },
    ieDragThumb(ev, i) {
      ev.dataTransfer.setData('text/ie-ref', String(i));
      ev.dataTransfer.effectAllowed = 'copy';
    },
    ieDropToText(ev) {
      ev.preventDefault();
      const raw = ev.dataTransfer.getData('text/ie-ref');
      const i = raw === '' ? -1 : parseInt(raw, 10);
      if (i >= 0 && i < this.ie.files.length) {
        this.ieInsertRef(i);
      } else {
        // 从外部拖入图片文件 → 先上传,再把新图的 @N 插到光标处
        const fs = Array.from((ev.dataTransfer && ev.dataTransfer.files) || []);
        if (fs.length) {
          const before = this.ie.files.length;
          this.ieAdd(fs);
          setTimeout(() => this.ieInsertRef(before), 100);
        }
      }
    },
    /* 局部编辑:笔迹坐标全部按图1原始像素存,提交时重放成黑底白mask PNG */
    ieResetMask() {
      this.ie.strokes = []; this.ie.hasMask = false;
      this.$nextTick(() => {
        const c = this.$refs.iePaint;
        if (c) { const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height) }
      });
    },
    ieCanvasPos(ev) {
      const c = this.$refs.iePaint;
      const r = c.getBoundingClientRect();
      const it = this.ie.files[0];
      return [(ev.clientX - r.left) * (it.w / r.width), (ev.clientY - r.top) * (it.h / r.height)];
    },
    ieDown(ev) {
      if (!this.ie.localMode || !this.ie.files.length) return;
      ev.preventDefault();
      this.ie.painting = true;
      const p = this.ieCanvasPos(ev);
      this.ie.strokes.push({ size: this.ie.brush, pts: [p] });
      this.ie.hasMask = true;
      this.ieDrawStroke(this.ie.strokes[this.ie.strokes.length - 1], true);
    },
    ieMove(ev) {
      if (!this.ie.painting) return;
      const st = this.ie.strokes[this.ie.strokes.length - 1];
      st.pts.push(this.ieCanvasPos(ev));
      this.ieDrawStroke(st, false);
    },
    ieUp() { this.ie.painting = false; },
    ieDrawStroke(st, dot) {
      const c = this.$refs.iePaint;
      if (!c) return;
      const x = c.getContext('2d');
      x.strokeStyle = 'rgba(255,70,70,.5)'; x.fillStyle = 'rgba(255,70,70,.5)';
      x.lineWidth = st.size; x.lineCap = 'round'; x.lineJoin = 'round';
      const pts = st.pts;
      if (dot || pts.length < 2) {
        const p = pts[pts.length - 1];
        x.beginPath(); x.arc(p[0], p[1], st.size / 2, 0, Math.PI * 2); x.fill();
        return;
      }
      const a = pts[pts.length - 2], b = pts[pts.length - 1];
      x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke();
    },
    async ieRun() {
      if (!this.ie.files.length || !this.ie.instruction.trim() || this.ie.busy) return;
      this.err = ''; this.notice = ''; this.ie.busy = true;
      try {
        const form = new FormData();
        for (const it of this.ie.files) form.append('files', it.f, it.name);
        form.append('instruction', this.ie.instruction.trim());
        if (this.ie.localMode && this.ie.hasMask && this.ie.strokes.length) {
          const it = this.ie.files[0];
          const off = document.createElement('canvas');
          off.width = it.w; off.height = it.h;
          const x = off.getContext('2d');
          x.fillStyle = '#000'; x.fillRect(0, 0, off.width, off.height);
          x.strokeStyle = '#fff'; x.fillStyle = '#fff'; x.lineCap = 'round'; x.lineJoin = 'round';
          for (const st of this.ie.strokes) {
            x.lineWidth = st.size;
            if (st.pts.length < 2) {
              x.beginPath(); x.arc(st.pts[0][0], st.pts[0][1], st.size / 2, 0, Math.PI * 2); x.fill();
            } else {
              x.beginPath(); x.moveTo(st.pts[0][0], st.pts[0][1]);
              for (const p of st.pts.slice(1)) x.lineTo(p[0], p[1]);
              x.stroke();
            }
          }
          const blob = await new Promise(res => off.toBlob(res, 'image/png'));
          if (blob) form.append('mask', blob, 'mask.png');
        }
        const resp = await req('/api/imgedit', { method: 'POST', form });
        this.ie.result = resp.result || resp;
        this.notice = '编辑完成';
        this.ie.imgOk = false; this.ie.imgErr = false; this.ie.imgRetry = 0; this.ie.imgTick = Date.now();
        this.saveUISoon();
      } catch (e) {
        this.err = e.message;
      } finally { this.ie.busy = false }
    },
    ieDownload() {
      const r = this.ie.result;
      if (r) return this.fileDownload(r.url, r.filename);
    },
    ieImgFail() { this._imgAutoRetry(this.ie) },
    ieImgReload() {
      const e = this.ie;
      e.imgErr = false; e.imgOk = false; e.imgRetry = 0; e.imgTick = Date.now();
    },

    /* ---------- 图片橡皮擦:画布上涂掉不要的地方 → 后端按 mask 无损抠图 ---------- */
    eraserPickFile(ev) {
      const f = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (f) this.eraserSetFile(f);
    },
    eraserDropFile(ev) {
      this.eraser.drag = false;
      const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (f) this.eraserSetFile(f);
    },
    eraserSetFile(f) {
      if (!/^image\//.test(f.type || '')) { this.err = '请选择图片文件(PNG / JPG / WEBP)'; return }
      this.err = ''; this.notice = '';
      if (this.eraser.srcUrl) URL.revokeObjectURL(this.eraser.srcUrl);
      this.eraserFile = f;
      this.eraser.name = f.name;
      this.eraser.w = 0; this.eraser.h = 0;
      this.eraser.strokes = []; this.eraser.redo = [];
      this.eraser.hasEdit = false; this.eraser.out = null;
      this.eraser.srcUrl = URL.createObjectURL(f);
      const im = new Image();
      im.onload = () => {
        this.eraserImage = im;
        this.eraser.w = im.naturalWidth;
        this.eraser.h = im.naturalHeight;
        this.$nextTick(() => this.eraserRender());
      };
      im.src = this.eraser.srcUrl;
    },
    /** 把「原图 + 全部笔迹」重画一遍(撤销 / 重做 / 换擦除方式都走这里) */
    eraserRender() {
      const cv = this.$refs.ecanvas, im = this.eraserImage;
      if (!cv || !im) return;
      if (cv.width !== im.naturalWidth || cv.height !== im.naturalHeight) {
        cv.width = im.naturalWidth; cv.height = im.naturalHeight;
      }
      const ctx = cv.getContext('2d');
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(im, 0, 0);                    // 1:1 贴原图,不缩放
      const op = this.eraser.mode === 'white' ? 'source-over' : 'destination-out';
      for (const s of this.eraser.strokes) this.eraserPaint(ctx, s, this.eraserRgb, op);
      this.eraser.hasEdit = this.eraser.strokes.length > 0;
    },
    /** 一笔 = 一条轨迹;每小段按步长盖章,软边靠径向渐变 */
    eraserPaint(ctx, s, rgb, op) {
      ctx.globalCompositeOperation = op;
      const pts = s.pts || [];
      if (!pts.length) return;
      if (pts.length === 1) { this.eraserStamp(ctx, pts[0][0], pts[0][1], s.r, s.hard / 100, rgb); return }
      const step = Math.max(1, s.r / 4);
      for (let i = 1; i < pts.length; i++) {
        const x0 = pts[i - 1][0], y0 = pts[i - 1][1], x1 = pts[i][0], y1 = pts[i][1];
        const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
        for (let k = 1; k <= n; k++) {
          this.eraserStamp(ctx, x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n, s.r, s.hard / 100, rgb);
        }
      }
    },
    eraserStamp(ctx, x, y, r, hard, rgb) {
      if (r <= 0) return;
      const inner = Math.max(0, Math.min(r * 0.97, r * hard));   // hard=1 → 近乎硬边
      const g = ctx.createRadialGradient(x, y, inner, x, y, r);
      g.addColorStop(0, `rgba(${rgb},1)`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    },
    /** 指针位置 → 画布**原始分辨率**坐标(显示可能被缩放,所以按 rect 比例换算) */
    eraserPos(ev) {
      const cv = this.$refs.ecanvas;
      const rc = cv.getBoundingClientRect();
      return [(ev.clientX - rc.left) * (cv.width / rc.width), (ev.clientY - rc.top) * (cv.height / rc.height)];
    },
    /** 笔刷圆环(画在上层的 overlay 上,overlay 不接事件) */
    eraserHover(ev) {
      const ov = this.$refs.eoverlay, cv = this.$refs.ecanvas;
      if (!ov || !cv || !this.eraser.w) return;
      const rc = cv.getBoundingClientRect();
      const W = Math.round(rc.width), H = Math.round(rc.height);
      if (ov.width !== W || ov.height !== H) { ov.width = W; ov.height = H }
      const ctx = ov.getContext('2d');
      ctx.clearRect(0, 0, ov.width, ov.height);
      const x = ev.clientX - rc.left, y = ev.clientY - rc.top;
      const rad = Math.max(3, this.eraser.brush * (rc.width / cv.width));
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1; ctx.stroke();
    },
    eraserClearCursor() {
      const ov = this.$refs.eoverlay;
      if (ov) ov.getContext('2d').clearRect(0, 0, ov.width, ov.height);
    },
    eraserDown(ev) {
      if (!this.eraserFile || !this.eraserImage) return;
      ev.preventDefault();
      this.$refs.ecanvas.setPointerCapture(ev.pointerId);
      const p = this.eraserPos(ev);
      this.eraser.strokes.push({ r: this.eraser.brush, hard: this.eraser.hard, pts: [p] });
      this.eraser.redo = [];
      this.eraser.painting = true;
      this.eraser.hasEdit = true;
      const ctx = this.$refs.ecanvas.getContext('2d');
      ctx.globalCompositeOperation = this.eraser.mode === 'white' ? 'source-over' : 'destination-out';
      this.eraserStamp(ctx, p[0], p[1], this.eraser.brush, this.eraser.hard / 100, this.eraserRgb);
    },
    eraserMove(ev) {
      this.eraserHover(ev);
      if (!this.eraser.painting) return;
      const s = this.eraser.strokes[this.eraser.strokes.length - 1];
      if (!s) return;
      const p = this.eraserPos(ev);
      const last = s.pts[s.pts.length - 1];
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 0.6) return;
      const ctx = this.$refs.ecanvas.getContext('2d');
      ctx.globalCompositeOperation = this.eraser.mode === 'white' ? 'source-over' : 'destination-out';
      const step = Math.max(1, this.eraser.brush / 4);
      const n = Math.max(1, Math.ceil(Math.hypot(p[0] - last[0], p[1] - last[1]) / step));
      for (let k = 1; k <= n; k++) {
        this.eraserStamp(ctx, last[0] + (p[0] - last[0]) * k / n, last[1] + (p[1] - last[1]) * k / n,
                         this.eraser.brush, this.eraser.hard / 100, this.eraserRgb);
      }
      s.pts.push(p);
    },
    eraserUp(ev) {
      this.eraser.painting = false;
      try { this.$refs.ecanvas.releasePointerCapture(ev.pointerId) } catch (e) { /* 已释放 */ }
    },
    eraserUndo() {
      if (!this.eraser.strokes.length) return;
      this.eraser.redo.push(this.eraser.strokes.pop());
      this.eraserRender();
    },
    eraserRedo() {
      if (!this.eraser.redo.length) return;
      this.eraser.strokes.push(this.eraser.redo.pop());
      this.eraserRender();
    },
    eraserClearAll() {
      if (!this.eraser.strokes.length) return;
      this.eraser.strokes = []; this.eraser.redo = [];
      this.eraserRender();
    },
    /** 只把笔迹画成一张黑白 mask(白 = 擦掉)。后端不认画布,只认这张 mask */
    async eraserMaskBlob() {
      const im = this.eraserImage;
      const mc = document.createElement('canvas');
      mc.width = im.naturalWidth; mc.height = im.naturalHeight;
      const ctx = mc.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, mc.width, mc.height);
      for (const s of this.eraser.strokes) this.eraserPaint(ctx, s, '255,255,255', 'source-over');
      return await new Promise(r => mc.toBlob(r, 'image/png'));
    },
    async eraserSave() {
      if (!this.eraserFile || this.eraser.busy) return;
      if (!this.eraser.strokes.length) { this.err = '先用画笔涂掉要去掉的地方,再点生成'; return }
      this.err = ''; this.notice = ''; this.eraser.busy = true;
      try {
        const blob = await this.eraserMaskBlob();
        if (!blob) throw new Error('擦除区域编码失败,换张图或换个浏览器再试');
        const form = new FormData();
        form.append('file', this.eraserFile);
        form.append('mask', blob, 'mask.png');
        form.append('mode', this.eraser.mode);
        this.eraser.out = await req('/api/erase', { method: 'POST', form });
        this.notice = '已生成:没涂到的像素与原图完全一致(PNG 无损)';
      } catch (e) {
        this.err = e.message;
      } finally { this.eraser.busy = false }
    },

    /* ---------- 成片设置:分辨率 / 帧率(改完必须点「保存设置」) ---------- */
    syncConfig() {
      const p = this.project;
      if (!p) return;
      const key = `${p.out_width}x${p.out_height}`;
      this.cfg = {
        preset: this.resPresets.some(r => r.v === key) ? key : 'custom',
        w: p.out_width, h: p.out_height, fps: p.fps
      };
    },
    applyPreset() {
      if (this.cfg.preset === 'custom') return;
      const [w, h] = this.cfg.preset.split('x').map(Number);
      this.cfg.w = w; this.cfg.h = h;
    },
    async saveConfig() {
      if (!this.project) return;
      this.err = ''; this.saving = true;
      try {
        const updated = await req(`/api/projects/${this.project.id}`, {
          method: 'PATCH',
          body: { out_width: Number(this.cfg.w), out_height: Number(this.cfg.h), fps: Number(this.cfg.fps) }
        });
        // 后端会按新帧率重算每个镜头的帧数,并作废旧成片 / 镜头片段
        Object.assign(this.project, updated);
        this.job = null; this.shotJobs = {};
        this.syncConfig();
        this.resetDraft();
      } catch (e) { this.err = e.message } finally { this.saving = false }
    },
    async saveTitle() { if (this.project) await req('/api/projects/' + this.project.id, { method: 'PATCH', body: { title: this.project.title } }) },
    async removeProject(p) {
      if (!(await this.askConfirm('删除项目', '删除项目「' + p.title + '」？',
        { danger: true, confirmText: '删除' }))) return;
      await req('/api/projects/' + p.id, { method: 'DELETE' });
      this.fetchProjects();          // 留在当前页(越界会自动退回最后一页)
    },
    /* ---------- 右上角用户菜单 ---------- */
    openBind() { this.userOpen = false; this.bind.email = ''; this.bind.password = ''; this.showBind = true },
    async logout() {
      this.userOpen = false;
      if (!(await this.askConfirm('退出登录',
        '退出后会以新的游客身份进入；原账号可以随时用邮箱重新登录。',
        { confirmText: '退出登录' }))) return;
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(UI_KEY);      // 换账号了,别把上一个人的页面状态带过来
      this.user = null; this.project = null; this.projects = [];
      this.view = 'templates'; this.job = null; this.shotJobs = {};
      this.boot();
    },
    async submitBind() {
      this.err = '';
      try {
        const r = await req('/api/auth/bind', { method: 'POST', body: this.bind });
        localStorage.setItem(TOKEN_KEY, r.access_token); this.user = r.user; this.showBind = false; this.bind.password = '';
      } catch (e) { this.err = e.message }
    },
    async submitLogin() {
      this.err = '';
      try {
        const r = await req('/api/auth/login', { method: 'POST', body: this.bind });
        localStorage.setItem(TOKEN_KEY, r.access_token); this.user = r.user; this.showBind = false; this.bind.password = '';
      } catch (e) { this.err = e.message }
    }
  },

                  style="left:auto;right:2px;background:rgba(240,180,41,.85);border-color:transparent;color:#000">内置</span>
          </div>
          <div v-if="!assets.length" class="small muted">素材库是空的,用上面的「上传服装图」传一张。</div>
        </div>
      </div>

      <div class="row" style="margin-bottom:12px">
        <button :disabled="!quick.garments.length || busyQuick" @click="describeGarment">
          {{ busyQuick ? '处理中…' : '读取这件衣服' }}
        </button>
        <span class="small muted">{{ quick.descMsg }}</span>
      </div>

      <div class="field">
        <label>2. 服装描述(模型读出来的,可以直接改;也可以自己写)</label>
        <textarea v-model="quick.garmentDesc" style="min-height:96px"
          placeholder="点上面的「读取这件衣服」会自动填;也可以自己写,例如:浅灰色三件套,长袖开衫 + 蕾丝边吊带 + 高腰阔腿裤,针织莫代尔,慵懒居家风……"></textarea>
      </div>

      <div v-if="quick.why" class="notice ok small" style="margin:0 0 14px">
        <b>推荐理由</b>:{{ quick.why }}
        <div v-if="quick.extraProps.length" style="margin-top:6px">
          清单里没有、但更适合这件衣服的:<b>{{ quick.extraProps.join('、') }}</b>
          —— 已经填进下面的「补充要求」,可以直接改。
        </div>
      </div>

      <div class="field">
        <label>3. 玩法(可选,推荐)—— 选一个就把整套拍摄规则套上,换任何衣服都能用</label>
        <div class="row wrap" style="gap:10px;align-items:center">
          <select v-model.number="quick.playbookId" @change="onPlaybookChange" style="max-width:300px">
            <option :value="0">不使用玩法(按下面的调性自由发挥)</option>
            <option v-for="pb in playbooks" :key="pb.id" :value="pb.id">
              {{ pb.title }}{{ pb.is_system ? '' : ' · 我的' }}
            </option>
          </select>
          <span v-if="pickedPlaybook" class="small muted" style="flex:1;min-width:260px">
            {{ pickedPlaybook.description }}
          </span>
          <span v-else class="small muted" style="flex:1;min-width:260px">
            选一个玩法 → 下面会展开它的参数(打底穿搭 / 自定义动作),改完点「存为我的玩法」就能存下来复用。
          </span>
        </div>
      </div>

      <div v-if="pickedPlaybook" class="field"
           style="border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2)">
        <label>打底穿搭 —— 招牌镜里她穿什么(不是要展示的那套衣服)</label>
        <input v-model="quick.baseOutfit"
               :placeholder="'留空用默认:' + ((pickedPlaybook.params || {}).base_outfit || '一件极简的米白色无肩带抹胸和一条超级短的米白色紧身平角短裤、赤脚')" />
        <div class="row wrap" style="gap:10px;align-items:center;margin-top:12px">
          <label style="margin:0">细节镜头(点一下选中 / 取消)—— <b>只有勾中的才会出现在片子里</b></label>
          <button class="ghost" style="margin-left:auto" @click="toggleShotMgr">
            {{ shotMgr ? '收起管理' : '管理细节镜头' }}
          </button>
        </div>

        <div v-if="shotMgr" style="border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:8px">
          <div class="small muted" style="margin-bottom:8px">
            系统镜头可以改文案、删除(只影响你自己,随时能「恢复默认」);也可以加你自己的镜头。
          </div>
          <div v-for="it in shotLib.items" :key="it.kind + '-' + (it.id || it.key)"
               style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px">
            <div class="row wrap" style="gap:6px;align-items:center;margin-bottom:6px">
              <span class="badge">{{ it.kind === 'custom' ? '我的' : '内置' }}</span>
              <span v-if="it.hidden" class="small muted">已删除</span>
              <span v-else-if="it.edited" class="small muted">已改过</span>
              <span style="flex:1"></span>
              <button class="ghost" @click="saveShotEdit(it)">保存</button>
              <button v-if="it.kind === 'builtin' && !it.hidden" class="ghost" @click="hideBuiltinShot(it)">删除</button>
              <button v-if="it.kind === 'builtin' && it.hidden" class="ghost" @click="restoreBuiltinShot(it)">恢复默认</button>
              <button v-if="it.kind === 'custom'" class="ghost" @click="deleteMyShot(it)">删除</button>
            </div>
            <input v-model="it.label" placeholder="名字" style="margin-bottom:6px" />
            <textarea v-model="it.action" style="min-height:64px" placeholder="画面描述"></textarea>
          </div>
          <div style="border-top:1px dashed var(--line);padding-top:10px">
            <div class="small muted" style="margin-bottom:6px">添加一个我自己的镜头</div>
            <input v-model="shotMgrNew.label" placeholder="名字,例如:抱起一只猫" style="margin-bottom:6px" />
            <textarea v-model="shotMgrNew.action" style="min-height:64px"
              placeholder="画面描述,例如:已经穿好完整套装,近景(带到上半身),她怀里抱着一只短毛猫,轻轻抚摸"></textarea>
            <div style="margin-top:6px"><button class="ghost" @click="addMyShot">添加</button></div>
          </div>
        </div>

        <div v-for="g in shotGroups" :key="g.k" style="margin-top:8px">
          <div class="small muted" style="margin-bottom:4px">{{ g.t }} · {{ g.items.length }} 个</div>
          <div class="row wrap" style="gap:6px">
            <button v-for="s in g.items" :key="s.key" class="chip"
                    :class="{on: pickedShots.includes(s.key)}"
                    @click="toggleShot(s.key)">{{ s.label }}</button>
          </div>
        </div>
        <div class="row wrap small muted" style="margin-top:6px;gap:10px;align-items:center">
          <span>已选 <b>{{ pickedShots.length }}</b> 个细节镜 → 加第 1 镜(招牌变装),共
            <b>{{ pickedShots.length + 1 }}</b> 个镜头</span>
          <button class="ghost" @click="pickAllShots">全选</button>
          <button class="ghost" @click="clearShots">全不选</button>
        </div>

        <label style="margin-top:12px">自定义动作(一行一个)—— 写进来的也会全部用上</label>
        <textarea v-model="quick.customActions" style="min-height:82px"
          placeholder="例:&#10;抱起一只短毛猫&#10;撑一把透明雨伞&#10;端起一杯奶茶喝一口"></textarea>
        <div class="row wrap" style="margin-top:8px;gap:10px;align-items:center">
          <button class="ghost" @click="saveAsPlaybook">存为我的玩法</button>
          <button v-if="!pickedPlaybook.is_system" class="ghost"
                  @click="deletePlaybook(pickedPlaybook.id)">删除这个玩法</button>
          <span class="small muted">改完存下来,以后换别的衣服直接选这个玩法就能套用</span>
        </div>
      </div>

      <div class="row wrap" style="gap:14px">
        <div class="field" style="width:250px">
          <label>4. 拍摄空间</label>
          <select v-model="quick.scene">
            <option v-for="s in quickOpts.scenes" :key="s.v" :value="s.v">{{ s.t }}</option>
          </select>
          <div class="small muted" style="margin-top:5px">{{ sceneHint }}</div>
        </div>
        <div class="field" style="width:200px">
          <label>调性</label>
          <select v-model="quick.style">
            <option v-for="s in quickOpts.styles" :key="s.v" :value="s.t">{{ s.t }}</option>
          </select>
        </div>
        <div class="field" style="width:130px">
          <label>分成几个镜头</label>
          <input type="number" min="1" max="60" step="1" v-model.number="quick.shots" />
        </div>
        <div class="field" style="width:130px">
          <label>总时长(秒)</label>
          <input type="number" min="2" max="600" step="1" v-model.number="quick.seconds" />
        </div>
      </div>
      <div class="small muted" style="margin:-8px 0 14px">
        每镜约 {{ perShot }} 秒。单个镜头一次生成上限约 5 秒(124 帧),所以每镜别超过 5 秒。
      </div>

      <div v-if="quick.scene === 'custom'" class="field">
        <label>自定义空间描述</label>
        <input v-model="quick.sceneDesc"
               placeholder="例:一间带落地窗的米色卧室,木地板,床上铺着白色床品,午后自然光" />
      </div>

      <div class="field">
        <label>5. 道具 / 身体动作(可多选,不选也行)</label>
        <div v-for="g in quickOpts.props" :key="g.t" style="margin-bottom:10px">
          <div class="small muted" style="margin-bottom:5px">{{ g.t }}</div>
          <div class="row wrap" style="gap:6px">
            <button v-for="p in g.items" :key="p" class="chip" :class="{on: quick.props.includes(p)}"
                    @click="toggleProp(p)">{{ p }}</button>
          </div>
        </div>
        <div class="small muted">提示:道具只出现在它所在的那个镜头里,所以建议选和镜头数差不多的量;不选就让模型自己安排。</div>
      </div>

      <div class="field">
        <label>补充要求(可选)</label>
        <input v-model="quick.extra" placeholder="例:开头别太慢;多给裤子的垂坠一个镜头" />
      </div>

      <div class="row" style="margin-top:14px">
        <button class="primary" :disabled="busyQuick || !quick.garmentDesc.trim()" @click="draftScript">
          {{ busyQuick ? '正在写剧本…' : '生成剧本' }}
        </button>
        <button class="ghost" v-if="pieceParts.length"
          :disabled="busyQuick" @click="draftPieceScript">
          按件排镜（{{ pieceShotParts.length }} 件{{ pickedShots.length ? ' + ' + pickedShots.length + ' 细节' : '' }} → {{ pieceShotParts.length + pickedShots.length + 1 }} 镜）
        </button>
        <span class="spacer"></span>
        <button class="ghost" @click="go('templates')">取消</button>
      </div>
      <div class="small muted" v-if="pieceParts.length" style="margin-top:6px">
        按件排镜 = 参考片那种剪辑：<b>一件一镜</b>，每镜只演「这件整件平移进来、挡住要换的部位」，
        换装藏在两镜之间的硬切里，最后一镜是「已穿好整套」的展示镜。件数由你上传的衣服决定，
        4 件、5 件都能排。<b>你上面勾的细节镜会自动接在换装后面</b>（合排：换装一件一镜 → 细节镜 → 展示镜），
        不勾就只出换装 + 展示。
        <b v-if="alwaysWornParts.length">小件配饰（{{ alwaysWornParts.join('、') }}）不单独占镜，从一开始就戴着。</b>
      </div>
    </div>
  </template>

  <!-- 从剧本创建项目(独立页面,两步:填写剧本 -> 指定素材) -->
  <template v-else-if="view === 'script'">
    <div class="row wrap" style="gap:10px;margin-bottom:4px">
      <button class="ghost" @click="go('templates')">← 返回模板</button>
      <h2 style="margin:0">从剧本创建项目</h2>
      <span class="badge" :class="{email: scriptStep === 2}">第 {{ scriptStep }} / 2 步</span>
      <span class="spacer"></span>
      <span class="small muted">1 填写内容 · 2 指定素材</span>
    </div>
    <div class="sub">
      <template v-if="scriptStep === 1">
        把要拍的内容<b>一行一条</b>写进来 —— 分镜模型只负责把你的每条内容排成一个镜头
        (补景别、光线、时长),不会自己编内容。下一步会让模型把内容里的<b>人物 / 道具 / 场景</b>列出来,
        你可以逐个指定自己上传的素材图片;不指定的就交给模型自己生成。
      </template>
      <template v-else>
        下面是模型从内容清单里识别出的实体,以及它排出的 {{ (plan && plan.shots.length) || 0 }} 个镜头。
        给某个实体选一张素材图,它就会成为「出现该实体的那些镜头」的参考图;
        <b>保持「不指定」就让模型自己生成。</b>
        <span v-if="autoAssigned" style="color:var(--ok)">
          已按读图认出的件名自动绑好 {{ autoAssigned }} 件(不对可以自己改)。
        </span>
      </template>
    </div>

    <!-- 第 1 步:剧本 -->
    <div v-if="scriptStep === 1" class="card" style="max-width:780px">
      <div v-if="llm" class="small" style="margin-bottom:12px">
        <span class="badge" :class="{email: llm.up}">
          分镜模型:{{ llm.up ? llm.model + ' 可用' : '不可用(将退回规则切分,且无法识别实体)' }}
        </span>
      </div>
      <div class="field"><label>项目名称</label><input v-model="scriptForm.title" /></div>
      <div class="field">
        <label>服装描述(可选,<b>填了才能把一整套拆成单件</b>让你逐件绑参考图)</label>
        <textarea v-model="scriptForm.garmentDesc" style="min-height:64px"
          placeholder="例:浅灰色莫代尔三件套家居服:①蕾丝边吊带背心 ②同色系七分袖开衫 ③高腰阔腿长裤 ④(想加几件都行,比如再加一件棉袄)"></textarea>
        <div class="small muted" style="margin-top:5px">
          填了它,分析时会按你写的件数把「套装」拆成一件件独立道具,名字是「套装-单件名」
          (你写几件就拆几件 —— 写了一件棉袄,就会多出一个「套装-棉袄」),这样你能给每一件各绑一张参考图。
          不填就只会有一个笼统的「套装」(模型容易把几件揉成一件)。
        </div>
      </div>
      <div v-if="scriptForm.fromModel" class="notice ok small" style="margin:0 0 14px">
        这份内容清单是<b>上一步「一键出稿」里模型按「玩法 + 这件衣服」写的草稿</b>,自动带过来的 ——
        它现在就是<b>你的</b>内容,你可以随便改、删行、加行,或者清空自己写。
        <button class="ghost" style="margin-left:8px" @click="scriptForm.script = ''; scriptForm.fromModel = false">
          清空,我自己写
        </button>
      </div>
      <div class="field">
        <label>内容清单 —— 一行一条,写你要拍到的东西(分镜模型只负责把它们排成镜头,不自己编内容)</label>
        <textarea v-model="scriptForm.script" style="min-height:260px"
          placeholder="例:&#10;她只穿黑色细吊带和黑色短裤,站在白棚正中,双手捧着套装举到胸口&#10;双臂向上完全张开,把套装抛起,套装悬在头顶上方&#10;已经穿上套装,化妆师的手从画面右侧入画,拿粉扑给她补右侧脸颊的妆&#10;已经穿上套装,拿着口红补涂嘴唇,顺便带出耳钉"></textarea>
        <div class="small muted" style="margin-top:5px">
          共 <b>{{ contentLines }}</b> 条 → 会生成 <b>{{ contentLines }}</b> 个镜头;一条对应一个镜头,顺序就是你写的顺序。
          <span v-if="!contentLines">(把要拍的内容一行一条写进来)</span>
        </div>
        <div v-if="contentLines" style="margin-top:10px;border:1px solid var(--line);border-radius:8px;
             padding:10px 12px;background:var(--panel2);max-height:200px;overflow:auto">
          <div class="small muted" style="margin-bottom:6px">下面就是这条清单会变成的镜头(框里保持纯内容,编号只是给你对照):</div>
          <div v-for="(l, i) in contentList" :key="i" class="small" style="margin-bottom:5px">
            <b>镜头{{ i + 1 }}:</b>{{ l }}
          </div>
        </div>
      </div>
      <div class="row wrap" style="gap:14px">
        <div class="field" style="width:170px">
          <label>总时长(秒)</label>
          <input type="number" min="2" max="600" step="1" v-model.number="scriptForm.total_seconds" />
        </div>
        <div class="field" style="width:170px">
          <label>镜头数</label>
          <div class="small muted" style="padding-top:8px">{{ contentLines }} 个(由内容条数决定)</div>
        </div>
        <div class="field" style="flex:1;min-width:180px">
          <label>时长分配</label>
          <div class="small muted" style="padding-top:8px">由模型按每条内容需要多少秒决定</div>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="primary" :disabled="busyScript" @click="analyzeScript">
          {{ busyScript ? '模型正在分析…' : '下一步:分析人物 / 道具 / 场景' }}
        </button>
        <span class="spacer"></span>
        <button class="ghost" @click="go('templates')">取消</button>
      </div>
    </div>

    <!-- 第 2 步:指定素材 -->
    <div v-else class="card" style="max-width:1000px">
      <div class="tabs">
        <button v-for="c in cats" :key="c.v" :class="{on: entityTab === c.k}" @click="entityTab = c.k">
          {{ c.t }} ({{ (plan && plan[c.k] ? plan[c.k].length : 0) }})
          <span v-if="assignedCount(c.k)" style="color:var(--ok)">· 已指定 {{ assignedCount(c.k) }}</span>
        </button>
      </div>

      <div v-for="c in cats" :key="c.k">
        <template v-if="entityTab === c.k">
          <div v-if="!(plan && plan[c.k] && plan[c.k].length)" class="muted small" style="margin:10px 0">
            剧本里没有识别到{{ c.t }}。
          </div>
          <div v-for="e in (plan && plan[c.k] || [])" :key="e.name" class="pick-row">
            <span style="width:110px"><b>{{ e.name }}</b></span>
            <span class="small muted" style="flex:1;min-width:150px">{{ e.desc }}</span>

            <div class="thumbs" style="flex:none">
              <div v-for="a in assetsOf(c.k + ':' + e.name)" :key="a.id" class="thumb"
                   style="width:46px;height:46px" :title="a.filename">
                <img :src="a.url" loading="lazy" decoding="async" />
              </div>
              <span v-if="!(assignments[c.k + ':' + e.name] || []).length" class="small muted">未指定</span>
            </div>

            <button @click="openPicker(c.k, e.name)">
              {{ (assignments[c.k + ':' + e.name] || []).length ? '更换素材(' + (assignments[c.k + ':' + e.name] || []).length + ')' : '选择素材' }}
            </button>
          </div>
        </template>
      </div>

      <div v-if="!assets.length" class="small muted" style="margin-top:10px">
        素材库里还没有图片。可以先创建项目,之后在编辑器里用「素材管理」上传并逐镜头指定。
      </div>

      <details style="margin-top:14px">
        <summary class="small muted" style="cursor:pointer">查看分镜({{ (plan && plan.shots.length) || 0 }} 个镜头)</summary>
        <div v-for="(s, i) in (plan && plan.shots || [])" :key="i" class="small" style="padding:6px 0;border-bottom:1px solid var(--line)">
          <b>{{ i + 1 }}. {{ s.title }}</b>
          <span class="muted"> · {{ s.seconds ? s.seconds.toFixed(1) + 's 建议' : '按时长均分' }}
            <span v-if="(s.characters || []).length"> · 人物:{{ s.characters.join('、') }}</span>
            <span v-if="(s.props || []).length"> · 道具:{{ s.props.join('、') }}</span>
            <span v-if="(s.scenes || []).length"> · 场景:{{ s.scenes.join('、') }}</span>
          </span>
          <div class="muted">{{ s.action }}</div>
        </div>
      </details>

      <div class="row" style="margin-top:16px">
        <button class="primary" :disabled="busyScript" @click="createFromScript">
          {{ busyScript ? '正在创建…' : '切分镜头并创建项目' }}
        </button>
        <button class="ghost" :disabled="busyScript" @click="scriptStep = 1">返回修改剧本</button>
        <span class="spacer"></span>
        <button class="ghost" @click="go('templates')">取消</button>
      </div>
    </div>
  </template>

  <!-- garment-split:衣服分割(平铺商品图 → 每件单独一张,无损) -->
  <template v-else-if="view === 'garment-split'">
    <div class="row" style="margin-bottom:10px">
      <h1 style="margin:0">衣服分割</h1>
      <span class="spacer"></span>
      <button class="ghost" @click="go('templates')">← 返回模板</button>
    </div>
    <div class="sub">
      传一张<b>平铺 / 白底商品图</b>(比如一套三件套摆在一起),按背景自动把画面里每件拆成一张独立图片。
      拆出来的图是<b>原像素 1:1 裁的</b> —— 不缩放、不重采样,输出 PNG 无损,颜色和纹理和原图完全一致;

      <input v-model="smSearch" placeholder="搜索分镜名 / 描述…" style="width:260px" @input="smPage = 1" />
      <button class="primary" @click="smShowAdd = true" style="margin-left:8px">+ 添加分镜</button>
    </div>
    <div class="sub">管理系统内置分镜和你自己的分镜。内置分镜只能改文案或隐藏,自定义分镜可以编辑、删除、禁用。</div>

    <div class="card" style="margin-top:14px;padding:0;overflow:hidden">
      <table class="data-table" style="width:100%">
        <thead>
          <tr>
            <th style="width:70px">类型</th>
            <th style="width:180px">名字</th>
            <th>画面描述</th>
            <th style="width:80px">状态</th>
            <th style="width:200px">操作</th>
          </tr>
        </thead>
        <tbody>
          <template v-for="it in smPageItems" :key="(it.kind || 'x') + '-' + (it.id || it.key)">
            <!-- 编辑行 -->
            <tr v-if="(it.kind === 'builtin' && smEditKey === it.key) || (it.kind === 'custom' && smEditId === it.id)">
              <td><span class="badge" :class="it.kind === 'builtin' ? 'builtin' : 'custom'">{{ it.kind === 'builtin' ? '内置' : '我的' }}</span></td>
              <td><input v-model="smEditLabel" style="width:100%" /></td>
              <td><textarea v-model="smEditAction" style="width:100%;min-height:60px" /></td>
              <td>—</td>
              <td>
                <button class="small primary" @click="smSaveEdit">保存</button>
                <button class="small ghost" @click="smCancelEdit">取消</button>
              </td>
            </tr>
            <!-- 展示行 -->
            <tr v-else :class="{muted: it.hidden}">
              <td><span class="badge" :class="it.kind === 'builtin' ? 'builtin' : 'custom'">{{ it.kind === 'builtin' ? '内置' : '我的' }}</span></td>
              <td><strong>{{ it.label }}</strong>
                <span v-if="it.kind === 'builtin' && it.edited" class="small muted" style="margin-left:4px">(已改)</span>
              </td>
              <td class="small muted" style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.action }}</td>
              <td>
                <span v-if="it.hidden" class="badge" style="color:var(--muted);border-color:var(--line-2)">已禁用</span>
                <span v-else class="badge" style="color:var(--ok);border-color:#2a4a2a">启用</span>
              </td>
              <td>
                <button class="small" @click="smStartEdit(it)">编辑</button>
                <button class="small" @click="smToggleHidden(it)">{{ it.hidden ? '启用' : '禁用' }}</button>
                <button v-if="it.kind === 'builtin' && (it.edited || it.hidden)" class="small" @click="smRestoreBuiltin(it)">恢复默认</button>
                <button class="small danger" @click="smDelete(it)">{{ it.kind === 'builtin' ? '删除' : '删除' }}</button>
              </td>
            </tr>
          </template>
          <tr v-if="!smPageItems.length">
            <td colspan="5" class="small muted" style="text-align:center;padding:24px">没有匹配的分镜</td>
          </tr>
        </tbody>

      <!-- 分页 -->

        <button class="small ghost" :disabled="smPage <= 1" @click="smPage = 1">«</button>
        <button class="small ghost" :disabled="smPage <= 1" @click="smPage--">‹ 上一页</button>
        <span class="small muted">第 {{ smPage }} / {{ smPages }} 页</span>
        <button class="small ghost" :disabled="smPage >= smPages" @click="smPage++">下一页 ›</button>
        <button class="small ghost" :disabled="smPage >= smPages" @click="smPage = smPages">»</button>
      </div>
    </div>

    <!-- 添加分镜弹窗 -->

        <div class="field"><label>画面描述</label>
          <textarea v-model="smAddForm.action" style="min-height:100px"
            placeholder="例如:已经穿好完整套装,半身景别,她双手抱起一只橘猫,猫趴在她肩膀上…"></textarea></div>
        <div class="row">

        </div>
      </div>

    </div>

    <div class="card" style="margin-top:14px;max-width:720px">
      <h3 style="margin-top:0">ComfyUI</h3>

      <div class="field">
        <label>接口类型</label>
        <select v-model="apiCfg.llm_api_style" style="width:100%">
          <option value="ollama">Ollama（本机）</option>
          <option value="openai">OpenAI 兼容（DeepSeek / vLLM / OpenAI）</option>

      <div class="field">

        <input type="password" v-model="apiCfg.llm_api_key"

        <label class="row small" style="gap:6px;align-items:center;margin-top:6px">
          <input type="checkbox" v-model="apiCfg.clear_api_key" style="width:auto" />

        <div class="small muted" style="margin-top:8px">
          帧率可选:{{ fpsOptions.join(' / ') }} fps。分辨率和帧率在每个项目的编辑器里单独配置,改完会作废旧片段需要重新生成。
