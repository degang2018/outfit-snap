  <!-- assets:资源管理(素材库 —— 人物 / 道具 / 场景 / 实拍参考图) -->
  <template v-else-if="view === 'assets'">
    <div class="row wrap" style="gap:10px;align-items:flex-end;margin-bottom:6px">
      <h1 style="margin:0">资源管理</h1>
      <span class="badge">共 {{ assets.length }} 张</span>
      <span class="spacer"></span>
      <label style="cursor:pointer">
        <input type="file" accept="image/*" style="display:none" @change="uploadAsset" />
        <span class="pill" style="cursor:pointer;padding:8px 14px">+ 上传到「{{ catName(assetTab) }}」</span>
      </label>
    </div>
    <div class="sub">
      这里放的是你上传的图片(人物参考图 / 服装商品图 / 道具 / 实拍参考图),内置素材只读。
      改文件名或分类后要点「保存」才生效;删除后所有引用它的镜头参考图都会失效。
    </div>

    <div class="tabs" style="margin-top:12px">
      <button v-for="c in cats" :key="c.v" :class="{on: assetTab === c.v}" @click="assetTab = c.v">
        {{ c.t }} ({{ assets.filter(a => a.category === c.v).length }})
      </button>
    </div>

    <div class="row wrap" style="gap:10px;align-items:center;margin-bottom:12px">
      <span class="small muted">已勾选 {{ assetSel.size }} 张 · 本分类可删
        {{ assets.filter(a => a.category === assetTab && !a.is_system).length }} 张(内置素材不能删)</span>
      <span class="spacer"></span>
      <button class="small" @click="selectAllAssets">全选本分类</button>
      <button class="small" @click="clearAssetSel">清空勾选</button>
      <button class="small danger" :disabled="!assetSel.size" @click="deleteSelectedAssets">
        批量删除({{ assetSel.size }})
      </button>
    </div>

    <div class="asset-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
      <div v-for="a in assets.filter(x => x.category === assetTab)" :key="a.id" class="asset"
           :style="assetSel.has(a.id) ? 'border-color:var(--accent);background:var(--accent-soft)' : ''">
        <div class="row" style="gap:6px;align-items:center;margin-bottom:6px">
          <input v-if="!a.is_system" type="checkbox" :checked="assetSel.has(a.id)"
                 @change="toggleAssetSel(a.id)" style="width:auto" />
          <span v-else class="sys-tag">内置</span>
          <span class="small" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)"
                :title="a.ai_name || a.filename">{{ assetTitle(a) }}</span>
        </div>
        <img :src="a.url" loading="lazy" decoding="async" :title="a.filename" style="cursor:default" />
        <template v-if="!a.is_system">
          <input v-model="a.filename" title="文件名:改完点「保存」" />
          <select v-model="a.category">
            <option v-for="c in cats" :key="c.v" :value="c.v">{{ c.t }}</option>
          </select>
          <select v-model="a.ai_close" title="开合:上衣的扣子 / 外套的拉链要不要合上(只对有前襟的件有效)">
            <option value="">开合:自动(按全局默认)</option>
            <option value="closed">扣上 / 拉链拉满</option>
            <option value="half">半开(扣一半)</option>
            <option value="open">敞开</option>
          </select>
          <div class="ops">
            <button class="primary" @click="saveAsset(a)">保存</button>
            <button class="danger" @click="deleteAsset(a)">删除</button>
          </div>
        </template>
      </div>

    <div v-if="!assets.filter(x => x.category === assetTab).length" class="empty" style="margin-top:12px">
      「{{ catName(assetTab) }}」分类下还没有素材,点右上角就能上传。
    </div>
  </template>

  <!-- projects -->
  <template v-else-if="view === 'projects'">
    <h1>我的资产</h1>
    <div class="sub">每个项目都是一份可以反复修改、反复重出的分镜方案。</div>
    <div class="grid">
      <div v-for="p in projects" :key="p.id" class="card">
        <div class="row">
          <h3 style="margin:0;cursor:pointer" @click="openDetail(p)">{{ p.title }}</h3><span class="spacer"></span>
          <span class="badge" :class="p.status">{{ statusText[p.status] || p.status }}</span></div>
        <div class="small muted" style="margin:8px 0 12px">{{ p.total_frames }} 帧 · {{ p.duration_seconds }} 秒 ·
          {{ p.out_width }}×{{ p.out_height }} @ {{ p.fps }}fps</div>
        <video v-if="p.final_url && !isImageUrl(p.final_url)" :src="p.final_url" controls preload="metadata" style="max-height:260px;margin-bottom:12px"></video>
        <img v-else-if="p.final_url" :src="p.final_url" loading="lazy" style="max-height:260px;max-width:100%;border-radius:8px;margin-bottom:12px;display:block" />
        <div v-else class="small muted" style="margin-bottom:12px">
          {{ p.status === 'running' || p.status === 'queued' ? '正在生成,完成后这里会出现成片。' : '还没有成片,打开编辑器点「开始生成」。' }}
        </div>
        <div class="row wrap" style="gap:8px">
          <button class="primary" @click="openDetail(p)">查看分镜与成片</button>
          <button class="ghost" @click="openProject(p)">节点画布</button>
          <a v-if="p.final_url" :href="p.final_url" download><button class="ghost">{{ isImageUrl(p.final_url) ? '下载图片' : '下载成片' }}</button></a>
          <span class="spacer"></span><button class="danger" @click="removeProject(p)">删除</button>
        </div>
      </div>
    </div>
    <div v-if="!projects.length" class="empty">还没有项目,先去「模板」里选一个吧。</div>
    <!-- 分页:项目较多,一次只列一页 -->
    <div v-if="projPages > 1" class="row wrap" style="justify-content:center;gap:10px;margin:20px 0 4px">
      <button class="ghost" :disabled="projPage <= 1" @click="gotoPage(projPage - 1)">← 上一页</button>
      <span class="small muted">第 {{ projPage }} / {{ projPages }} 页 · 共 {{ projTotal }} 个项目</span>
      <button class="ghost" :disabled="projPage >= projPages" @click="gotoPage(projPage + 1)">下一页 →</button>
    </div>

  <!-- project detail:合成视频 + 每个分镜的成品清单 -->
  <template v-else-if="view === 'detail' && project">
    <div class="row wrap" style="gap:10px;margin-bottom:6px">
      <button class="ghost" @click="go('projects')">← 我的资产</button>
      <h2 style="margin:0">{{ project.title }}</h2>
      <span class="badge" :class="project.status">{{ statusText[project.status] || project.status }}</span>
      <span class="spacer"></span>
      <!-- 断点续传:随时终止,已生成的镜头片段都留着;再点「继续生成」只补没做完的镜头 -->
      <button v-if="running" class="danger" @click="cancel">终止生成</button>
      <button v-else-if="doneShots && project.shots.length > doneShots" class="primary"
              :disabled="anyBusy" @click="render">
        继续生成(已完成 {{ doneShots }}/{{ project.shots.length }})
      </button>
      <button v-else class="primary" :disabled="anyBusy" @click="render">
        {{ doneShots ? '合成整片' : '开始生成' }}
      </button>
      <button @click="enterEditor">节点画布</button>
      <button class="ghost" @click="openAssets">素材管理</button>
    </div>
    <div class="sub">{{ project.shots.length }} 个分镜 · {{ doneShots }} 个已生成 · {{ project.total_frames }} 帧 ·
      {{ project.duration_seconds }} 秒 · {{ project.out_width }}×{{ project.out_height }} @ {{ project.fps }}fps</div>

    <div v-if="job && ['queued','running'].includes(job.status)" class="card" style="margin-bottom:16px">
      <div class="row" style="margin-bottom:8px">
        <strong>正在生成</strong>
        <span class="badge running">{{ statusText[job.status] || job.status }}</span>
        <span class="spacer"></span>
        <span class="small muted">{{ job.message }}</span>
      </div>
      <div class="progress"><i :style="{width: job.progress + '%'}"></i></div>
      <div class="small muted" style="margin-top:8px">
        已生成 {{ doneShots }} / {{ project.shots.length }} 个镜头。可以随时点「终止生成」停下,
        已做好的镜头片段会保留,之后再点「继续生成」就接着跑,不重做。
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="row" style="margin-bottom:10px">
        <strong>{{ project.final_url && isImageUrl(project.final_url) ? '成片(静态图)' : '合成视频(整片)' }}</strong>
        <span class="spacer"></span>
        <a v-if="project.final_url" :href="project.final_url" download><button class="ghost">下载</button></a>
        <button v-if="project.final_url" class="danger" @click="deleteFilm">删除</button>
      </div>
      <video v-if="project.final_url && !isImageUrl(project.final_url)" :src="project.final_url" controls preload="metadata" style="max-height:440px"></video>
      <img v-else-if="project.final_url" :src="project.final_url" style="max-height:440px;max-width:100%;border-radius:8px;display:block" />
      <div v-else class="small muted">
        还没有合成成片。{{ doneShots && project.shots.length > doneShots
          ? '点上面的「继续生成」把剩下的 ' + (project.shots.length - doneShots) + ' 个镜头做完,做完会自动合成整片。'
          : '点上面的「开始生成」开始出片,全部镜头做好后会自动合成整片。' }}
      </div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <strong>分镜清单</strong>
        <span class="spacer"></span>
        <button class="small" @click="openAddGeneral">+ 添加通用分镜</button>
        <button class="small" style="margin-left:8px" @click="downloadAllShots">打包下载全部</button>
        <span class="small muted" style="margin-left:8px">已生成 {{ doneShots }} / {{ project.shots.length }}</span>
        <button v-if="selectedShots.size" class="small primary" style="margin-left:8px" @click="downloadSelectedShots">打包下载({{ selectedShots.size }})</button>
      </div>
      <template v-for="(s,i) in project.shots" :key="s.id">
      <div v-if="i === 0 && floatChainEnd > 0" class="shot-group">
        <span class="dot"></span>换装链 · {{ floatChainEnd }} 镜
        <span class="muted" style="font-weight:400">（打底展示 + 每件「穿好展示 → 飞入换装」，不可拖拽排序）</span>
      </div>
      <div v-if="i === floatChainEnd && floatChainEnd < project.shots.length" class="shot-group gen">
        <span class="dot"></span>通用 / 自定义分镜 · {{ project.shots.length - floatChainEnd }} 镜
        <span class="muted" style="font-weight:400">（换装链之后的独立镜头，可拖拽排序）</span>
      </div>
      <div class="shot-row" :class="{chain: i < floatChainEnd, dropover: dragOver===i && i >= floatChainEnd, dragging: dragFrom===i}"
           :draggable="i >= floatChainEnd"
           @dragstart="i >= floatChainEnd && onDragStartShot(i)"
           @dragover.prevent="i >= floatChainEnd && onDragOverShot(i, $event)"
           @drop="i >= floatChainEnd && onDropShot(i)"
           @dragend="dragFrom=-1;dragOver=-1">
        <div class="row wrap" style="gap:8px;margin-bottom:8px">
          <span class="small muted" :style="i >= floatChainEnd ? 'width:18px;cursor:grab' : 'width:18px;opacity:.3'" :title="i >= floatChainEnd ? '拖拽排序' : '换装分镜不可排序'">{{ i >= floatChainEnd ? '⋮⋮' : '' }}</span>
          <label class="row" style="gap:4px;margin:0" @click.stop>
            <input type="checkbox" :checked="selectedShots.has(s.id)" @change="toggleShotSelect(s.id)" style="width:auto" />
          </label>
          <span class="small muted" style="width:24px">{{ s.idx }}</span>
          <strong class="small">{{ s.title || s.key }}</strong>
          <span class="badge" :class="shotBadge(s)">{{ shotLabel(s) }}</span>
          <span class="small muted">{{ (s.duration_frames / project.fps).toFixed(1) }}s · {{ s.duration_frames }} 帧</span>
          <span class="spacer"></span>
          <button v-if="jobForShot(s)" class="danger" @click="cancelShotRender(s)">取消生成</button>
          <a v-if="s.clip_url" :href="s.clip_url" download><button class="ghost">下载</button></a>
          <button v-if="s.clip_url" class="danger" @click="deleteShotClip(s)">删除</button>
        </div>
        <img v-if="s.clip_url && isImageUrl(s.clip_url)" :src="s.clip_url" alt="静态图" loading="lazy" decoding="async"
             style="max-height:300px;border-radius:8px;display:block" />
        <video v-else-if="s.clip_url" :src="s.clip_url" controls preload="metadata" style="max-height:300px"></video>
        <img v-if="s.preview_url" :src="s.preview_url" alt="预览图" loading="lazy" decoding="async"
             style="max-height:300px;border-radius:8px;display:block;margin-top:6px" />
        <div v-if="!s.clip_url" class="small muted">{{ jobForShot(s) ? '正在生成中…' : '未生成' }}</div>
      </div>
      </template>
    </div>
  </template>

  <!-- editor:分镜节点画布(点节点 → 底部创作面板) -->
  <template v-else-if="project">
    <div class="row wrap" style="gap:10px;margin-bottom:6px">
      <button class="ghost" @click="go('detail')">← 分镜详情</button>
      <input v-model="project.title" style="max-width:360px;font-size:16px;font-weight:600" @blur="saveTitle" />
      <span class="badge" :class="project.status">{{ statusText[project.status] || project.status }}</span>
      <span class="spacer"></span>
      <span v-if="saving" class="small muted">保存中…</span>
      <button @click="openSaveTemplate">另存为我的模板</button>
      <button @click="openAssets">素材管理</button>
      <button v-if="!running" :disabled="anyBusy || dirty" @click="previewImages">
        {{ previewRunning ? ('出预览图中 ' + previewJob.done + '/' + previewJob.total) : ('生成 ' + enabledShots.length + ' 张预览图') }}
      </button>
      <button v-if="!running" class="danger" :disabled="anyBusy || dirty" @click="rerenderAll">
        全部重跑
      </button>
      <button v-if="!running" class="primary" :disabled="anyBusy" @click="render">
        {{ doneShots && project.shots.length > doneShots
          ? '继续生成(已完成 ' + doneShots + '/' + project.shots.length + ')'
          : (doneShots ? '合成整片' : '开始生成') }}
      </button>
      <button v-else class="danger" @click="cancel">终止生成</button>
    </div>
    <div class="sub">{{ project.shots.length }} 个分镜节点 · {{ project.total_frames }} 帧 ·
      {{ project.duration_seconds }} 秒 · {{ project.out_width }}×{{ project.out_height }} @ {{ project.fps }}fps</div>

    <details class="canvas-settings">
      <summary>成片设置 / 出片速度 · {{ project.out_width }}×{{ project.out_height }} @ {{ project.fps }}fps</summary>
      <div class="row wrap" style="gap:10px;align-items:center">
        <span class="small muted">成片设置</span>
        <select v-model="cfg.preset" style="width:auto" :disabled="anyBusy" @change="applyPreset">
          <option v-for="r in resPresets" :key="r.v" :value="r.v">{{ r.t }}</option>
        </select>
        <template v-if="cfg.preset === 'custom'">
          <input type="number" min="128" max="4096" step="2" v-model.number="cfg.w" style="width:96px" :disabled="anyBusy" />
          <span class="muted">×</span>
          <input type="number" min="128" max="4096" step="2" v-model.number="cfg.h" style="width:96px" :disabled="anyBusy" />
        </template>
        <label class="small muted row" style="gap:6px">
          <span>帧率</span>
          <select v-model.number="cfg.fps" style="width:auto" :disabled="anyBusy">
            <option v-for="f in fpsOptions" :key="f" :value="f">{{ f }} fps</option>
          </select>
        </label>
        <label class="small muted row" style="gap:6px" title="决定出片快慢的是这个,不是上面的成片分辨率">
          <span>出片速度</span>
          <select v-model.number="speed.gen_short" style="width:auto" :disabled="anyBusy" @change="saveSpeed">
            <option v-for="g in speed.presets" :key="g.short" :value="g.short">
              生成 {{ g.w }}×{{ g.h }}{{ g.short === 432 ? '(最快)' : (g.short === 720 ? '(最清楚)' : '') }}
            </option>
          </select>
        </label>
        <label class="small muted row" style="gap:6px" title="参考图越大越保真、也越慢(每张约多 1 分钟)">
          <span>参考图</span>
          <select v-model="speed.ref_size" style="width:auto" :disabled="anyBusy" @change="saveSpeed">
            <option v-for="t in speed.ref_tiers" :key="t" :value="t">
              {{ t === 'match' ? 'match(快一倍)' : 'max(最保真)' }}
            </option>
          </select>
        </label>
        <span v-if="cfgDirty" class="badge" style="color:var(--warn);border-color:#5a4a1c">设置未保存</span>
        <span class="spacer"></span>
        <button :disabled="!cfgDirty || saving || anyBusy" @click="saveConfig">
          {{ saving ? '保存中…' : '保存设置' }}
        </button>
      </div>
      <div class="small muted" style="margin-top:10px">
        改分辨率或帧率会让已生成的成片与镜头片段作废,需要重新点「开始生成」。帧率越高,单镜头一次能生成的时长越短。<br>
        <b>出片速度</b>是全局设置(所有项目共用),改完立即生效并记到后端配置里,不用点「保存设置」;
        它只影响之后新生成的镜头 —— 想让整片都按新档重出,把已有片段删掉再重新生成即可。
        分辨率先调「生成」那一档;「成片分辨率」只是最后放大到多大,不影响生成快慢。
      </div>
    </details>

    <!-- 只显示「整片任务」:单镜任务在对应节点 / 创作面板里看 -->
    <div v-if="job && !job.shot_id" class="card" style="margin-bottom:12px">
      <div class="row" style="margin-bottom:8px">
        <strong>整片任务 #{{ job.id }}</strong>
        <span class="badge">{{ statusText[job.status] || job.status }}</span>
        <span v-if="job.current_shot" class="badge">当前 {{ job.current_shot }}</span>
        <span class="spacer"></span><span class="small muted">{{ job.message }}</span>
      </div>
      <div class="progress"><i :style="{width: job.progress + '%'}"></i></div>
      <div v-if="job.error" class="notice err small" style="margin-top:10px">{{ job.error }}</div>
      <div v-if="job.out_url" style="margin-top:12px">
        <a :href="job.out_url" download><button class="ghost">下载成片</button></a>
      </div>
      <div v-else-if="doneShots && project.shots.length > doneShots"
           class="small muted" style="margin-top:10px">
        还没有成片 —— 整片要等 {{ project.shots.length }} 个镜头全部生成完才会合成。
        点上面的「继续生成」把剩下的 {{ project.shots.length - doneShots }} 个镜头做完。
      </div>
    </div>

    <div v-if="previewJob && previewJob.status !== 'idle'" class="card" style="margin-bottom:12px">
      <div class="row" style="margin-bottom:8px">
        <strong>预览图</strong>
        <span class="badge">{{ { running: '生成中', done: '已完成', failed: '失败' }[previewJob.status] || previewJob.status }}</span>
        <span v-if="previewJob.current" class="badge">当前 {{ previewJob.current }}</span>
        <span class="spacer"></span>
        <span class="small muted">{{ previewJob.done }} / {{ previewJob.total }}</span>
      </div>
      <div class="progress"><i :style="{width: (previewJob.total ? Math.round(previewJob.done / previewJob.total * 100) : 0) + '%'}"></i></div>
      <div v-if="previewJob.error" class="notice err small" style="margin-top:10px">{{ previewJob.error }}</div>
      <div class="small muted" style="margin-top:8px">
        按每个镜头的提示词出的构图参考图(SDXL 纯文生图,不锁脸)。<b>不是成片用的模型</b>,
        所以人物长相和衣服纹理都不会跟素材一致 —— 主要用来提前确认景别、有没有切头、构图对不对。
      </div>
    </div>

    <div class="canvas-topbar">
      <strong class="small" style="letter-spacing:.4px">分镜画布</strong>
      <span class="badge">{{ project.shots.length }} 个镜头节点</span>
      <input class="search" v-model="canvas.search" placeholder="搜索镜头标题 / 提示词…" @keydown.enter="jumpToSearch" />
      <button class="ghost" @click="jumpToSearch">定位</button>
      <span class="spacer"></span>
      <template v-if="canvasSelectedShots.length">
        <span class="badge">已选 {{ canvasSelectedShots.length }} 个</span>
        <button class="ghost" @click="canvasBatchDownload">打包下载</button>
        <button class="danger" @click="canvasBatchDelete">删除</button>
        <button class="ghost" @click="clearCanvasSel">取消选择</button>
      </template>
      <button class="ghost" @click="downloadAllShots">打包下载全部</button>
      <button @click="openAddGeneral">+ 添加通用分镜</button>
      <button class="ghost" @click="autoLayout">自动排列</button>
      <button class="ghost" @click="fitCanvas">适应画布</button>
      <button class="ghost" :class="{on: canvas.showLinks}" @click="canvas.showLinks = !canvas.showLinks; saveCanvasStateSoon()">引用连线</button>
      <button class="ghost" :class="{on: canvas.snap}" @click="canvas.snap = !canvas.snap; saveCanvasStateSoon()">网格吸附</button>
      <button class="ghost" @click="sortShotsByCanvas" title="按节点在画布上的位置重排镜头顺序">按位置排序</button>
    </div>

    <div class="node-stage" ref="stage" :class="{panning: canvas.pan, linking: canvas.link}"
         @pointerdown="stagePointerDown" @wheel.prevent="stageWheel"
         @contextmenu.prevent="canvas.menu = null">
      <div class="canvas-world" :style="worldStyle()">
        <svg class="canvas-links" aria-hidden="true">
          <path v-for="e in canvasEdges" :key="e.id" :d="e.d" stroke="rgba(120,150,255,.55)"
                stroke-width="1.5"></path>
          <g v-for="e in canvasLinkEdges" :key="'link-' + e.id" class="link-group">
            <path :d="e.d" class="link-hit" stroke="transparent"
                  :stroke-width="26 / canvas.zoom"
                  @contextmenu.prevent.stop="removeLink(e)"
                  @dblclick.prevent.stop="removeLink(e)"></path>
            <path :d="e.d" class="manual" stroke="rgba(160,107,255,.62)"
                  :stroke-width="1.8 / canvas.zoom"
                  title="悬停中点可点「删除连线」，双击/右键也能删"
                  @contextmenu.prevent.stop="removeLink(e)"
                  @dblclick.prevent.stop="removeLink(e)"></path>
            <g class="link-del"
               :transform="'translate(' + e.mx + ',' + e.my + ') scale(' + (1 / canvas.zoom) + ')'"
               @click.stop="removeLink(e)" @pointerdown.stop>
              <rect x="-40" y="-12" width="80" height="24" rx="12"></rect>
              <text y="4">删除连线</text>
            </g>
          </g>
        </svg>

        <div v-if="canvasChainFrame" class="chain-frame" :style="chainFrameStyle(canvasChainFrame)">
          <span>{{ canvasChainFrame.label }}</span>
        </div>

        <!-- 参考图组节点:人物 / 服装道具 / 场景 … -->
        <div v-for="g in canvasRefNodes" :key="g.key" class="ref-group"
             :class="{selected: canvas.sel.indexOf(g.key) >= 0}"
             :style="refNodeStyle(g)" :data-node-key="g.key"
             @pointerenter="nodeEnter(g.key)" @pointerleave="nodeLeave(g.key)"
             @pointerdown.stop="nodePointerDown($event, g.key)">
          <div class="ref-head">
            <span class="ref-dot"></span>
            <strong>{{ g.title }}</strong>
            <span class="small muted">{{ g.items.length }} 张</span>
            <span class="spacer"></span>
            <span class="small muted" style="font-size:10px">拖 ◎ 到分镜上连线</span>
          </div>
          <div class="ref-grid">
            <div v-for="it in g.items" :key="it.ref" class="ref-item" :title="it.name">
              <img v-if="it.url" :src="it.url" loading="lazy" decoding="async"
                   @error="$event.target.style.display='none'"
                   @click.stop="openLightboxImage(it.url, it.name)" />
              <div v-else class="ref-file"></div>
              <span class="ref-name">{{ it.name }}</span>
              <button class="ref-port" title="拖到分镜节点上,添加为该镜参考图"
                      @pointerdown.stop="startLink($event, it.ref)">◎</button>
            </div>
          </div>
        </div>

        <!-- 分镜节点 -->
        <div v-for="n in canvasShotNodes" :key="'shot-' + n.shot.id" class="node-shot"
             :class="{selected: canvas.sel.indexOf('shot:' + n.shot.id) >= 0,
                      running: jobForShot(n.shot),
                      drop: canvas.dropKey === 'shot:' + n.shot.id,
                      dim: canvasMatch(n.shot) === false,
                      hit: canvasMatch(n.shot) === true}"
             :style="shotNodeStyle(n)" :data-shot-id="n.shot.id"
             :data-node-key="'shot:' + n.shot.id"
             :title="n.shot.title || n.shot.key"
             @pointerenter="nodeEnter('shot:' + n.shot.id)"
             @pointerleave="nodeLeave('shot:' + n.shot.id)"
             @pointerdown.stop="nodePointerDown($event, 'shot:' + n.shot.id)"
             @contextmenu.prevent.stop="openNodeMenu($event, 'shot:' + n.shot.id)">
          <div class="node-head">
            <span class="idx">#{{ n.index + 1 }}</span>
            <span class="dot" :class="n.shot.clip_url ? 'done' : (jobForShot(n.shot) ? 'running' : (n.shot.status === 'failed' ? 'failed' : ''))"></span>
            <span class="title">{{ n.shot.title || n.shot.key }}</span>
            <button class="node-more" title="节点菜单"
                    @pointerdown.stop @click.stop="openNodeMenu($event, 'shot:' + n.shot.id)">⋯</button>
          </div>
          <div class="node-body" @click.stop="onShotNodeClick(n.shot)">
            <template v-if="n.shot.clip_url">
              <!-- 静态图分镜(piece_style='static' 主链):clip_url 就是 PNG,直接显示,不带播放按钮 -->
              <template v-if="n.shot.options && n.shot.options.static_image">
                <img :src="n.shot.clip_url" loading="lazy" decoding="async" />
                <span class="node-badge ok">静态图</span>
                <button class="node-play-btn" title="涂抹重渲(局部修改这张静态图)"
                        @pointerdown.stop @click.stop="openStaticRerender(n.shot)">🖌</button>
              </template>
              <template v-else>
                <video v-if="playingShotId === n.shot.id" :src="n.shot.clip_url"
                       controls autoplay muted playsinline preload="auto"
                       @click.stop @ended="playingShotId = null"></video>
                <template v-else>
                  <img v-if="n.shot.thumb_url" :src="n.shot.thumb_url" loading="lazy" decoding="async"
                       @error="onThumbError($event, n.shot)" />
                  <img v-else-if="n.shot.preview_url" :src="n.shot.preview_url" loading="lazy" decoding="async" />
                  <div v-else class="node-empty">
                    <span class="ico">▢</span><span>已生成</span>
                  </div>
                  <span class="node-badge ok">已生成</span>
                  <span v-if="n.shot.candidates && n.shot.candidates.length" class="node-cands">{{ n.shot.candidates.length }} 候选</span>
                  <button class="node-play-btn" title="播放视频"
                          @pointerdown.stop @click.stop="playNodeVideo(n.shot)">▶</button>
                </template>
                <button v-if="playingShotId === n.shot.id" class="node-video-close" title="关闭播放"
                        @click.stop="playingShotId = null">×</button>
              </template>
            </template>
            <template v-else-if="n.shot.preview_url">
              <img :src="n.shot.preview_url" loading="lazy" decoding="async" />
              <span class="node-badge">预览图</span>
            </template>
            <div v-else class="node-empty">
              <span class="ico">▢</span>
              <span>{{ jobForShot(n.shot) ? '正在生成…' : (shotStage(n.shot) || '未生成') }}</span>
              <span v-if="!jobForShot(n.shot) && !shotStage(n.shot)" class="small muted" style="font-size:10px">点节点,在下方写提示词生成</span>
            </div>
            <div v-if="jobForShot(n.shot) || shotStage(n.shot)" class="node-progress"
                 :class="{indet: ['queued','running'].includes((jobForShot(n.shot) || this.job || {}).status)}">
              <i :style="{width: ((jobForShot(n.shot) || {}).progress || 0) + '%'}"></i>
            </div>
            <span v-if="n.shot.status === 'failed' && !n.shot.clip_url" class="node-badge bad">失败</span>
            <button v-if="n.shot.clip_url || n.shot.preview_url" class="node-open" title="大图 / 视频预览"
                    @pointerdown.stop @click.stop="openLightboxShot(n.shot)">⤢</button>
          </div>
          <div class="node-foot">
            <span>{{ (n.shot.duration_frames / project.fps).toFixed(1) }}s</span>
            <span class="node-chip">{{ (modes.find(m => m.v === n.shot.mode) || {}).t || n.shot.mode }}</span>
            <span class="node-chip">{{ (n.shot.refs || []).length }} 参考</span>
            <span v-if="n.shot.options && n.shot.options.camera" class="node-chip"
                  :title="'机位:' + cameraLabel(n.shot.options.camera)">⌖ 机位</span>
            <span class="spacer"></span>
            <span v-if="!n.shot.enabled" class="muted">不参与</span>
            <span v-else class="muted">{{ jobForShot(n.shot) ? '生成中' : (shotStage(n.shot) || '参与生成') }}</span>
          </div>
        </div>

        <!-- 自定义节点:图片 / 文本 / 视频 -->
        <div v-for="n in canvas.customNodes" :key="'custom-' + n.id" class="node-custom"
             :class="[n.type, {selected: canvas.sel.indexOf('custom:' + n.id) >= 0,
                              drop: canvas.dropKey === 'custom:' + n.id}]"
             :style="customNodeStyle(n)" :data-node-key="'custom:' + n.id"
             @pointerenter="nodeEnter('custom:' + n.id)"
             @pointerleave="nodeLeave('custom:' + n.id)"
             @pointerdown.stop="nodePointerDown($event, 'custom:' + n.id)">
          <div class="node-head">
            <span class="idx">{{ customTypeIcon(n.type) }}</span>
            <span class="title">{{ n.title || customTypeName(n.type) }}</span>
            <button class="node-more" title="删除节点"
                    @pointerdown.stop @click.stop="deleteCustomNode(n)">×</button>
          </div>
          <div class="custom-body" @click.stop="onCustomNodeClick(n)">
            <template v-if="n.type === 'image'">
              <img v-if="n.url" :src="(n.images && n.images.length ? n.images[n.imageIndex || 0] : n.url)"
                   loading="lazy" decoding="async" />
              <div v-else class="image-node-empty" @pointerdown.stop @click.stop="openImageComposer(n)">
                <span class="ico">▢</span>
                <span>点击节点，描述你想生成的图片</span>
              </div>
              <template v-if="n.url">
                <span v-if="n.images && n.images.length > 1" class="img-count">
                  {{ (n.imageIndex || 0) + 1 }}/{{ n.images.length }}
                </span>
                <button v-if="n.images && n.images.length > 1" class="img-nav prev"
                        @pointerdown.stop @click.stop="cycleNodeImage(n, -1)">‹</button>
                <button v-if="n.images && n.images.length > 1" class="img-nav next"
                        @pointerdown.stop @click.stop="cycleNodeImage(n, 1)">›</button>
              </template>
            </template>
            <template v-else-if="n.type === 'video'">
              <video v-if="n.url" :src="n.url" controls preload="metadata" @pointerdown.stop></video>
              <div v-else class="custom-upload" @pointerdown.stop @click.stop="pickCustomFile(n, 'video')">
                <span style="font-size:22px">+</span><span>上传视频</span>
              </div>
            </template>
            <template v-else-if="n.type === 'threeview' || n.type === 'personview'">
              <div v-if="n.outputs && n.outputs.length" class="three-node-out">
                <img :src="n.outputs[n.outputIndex || 0]" loading="lazy" decoding="async"
                     @pointerdown.stop @click.stop="openLightboxImage(n.outputs[n.outputIndex || 0], customTypeName(n.type))" />
                <span v-if="n.outputs.length > 1" class="img-count">
                  {{ (n.outputIndex || 0) + 1 }}/{{ n.outputs.length }}
                </span>
                <button v-if="n.outputs.length > 1" class="img-nav prev"
                        @pointerdown.stop @click.stop="cycleThreeOutput(n, -1)">‹</button>
                <button v-if="n.outputs.length > 1" class="img-nav next"
                        @pointerdown.stop @click.stop="cycleThreeOutput(n, 1)">›</button>
                <button class="node-open" title="大图预览"
                        @pointerdown.stop @click.stop="openLightboxImage(n.outputs[n.outputIndex || 0], customTypeName(n.type))">⤢</button>
              </div>
              <div v-else-if="(n.opts && n.opts.person) || (n.images && n.images.length)" class="three-node-src">
                <img v-if="n.opts && n.opts.person" :src="n.opts.person" title="人物" />
                <img v-for="(src, si) in n.images" :key="'src' + si" :src="src" />
                <span class="three-hint" v-if="n.type === 'personview'">
                  人物 + {{ (n.images || []).length }} 件 · 点击设置
                </span>
                <span class="three-hint" v-else>{{ n.images.length }}/3 张输入 · 点击设置</span>
              </div>
              <div v-else class="image-node-empty">
                <span class="ico">{{ customTypeIcon(n.type) }}</span>
                <span v-if="n.type === 'personview'">点击设置：人物 + 服装 → 全身三视图</span>
                <span v-else>点击设置：平铺 / 穿着图 → 三视图</span>
              </div>
              <span v-if="n.status === 'queued' || n.status === 'running'" class="node-badge">
                {{ n.message || '生成中…' }}
              </span>
              <span v-else-if="n.status === 'failed'" class="node-badge bad">失败</span>
              <span v-else-if="n.status === 'done'" class="node-badge ok">三视图</span>
            </template>
            <textarea v-else v-model="n.text" placeholder="输入文本…"
                      @pointerdown.stop @input="onCustomTextInput(n)" @blur="saveCanvasState()"></textarea>
          </div>
          <div class="custom-foot">
            <span>{{ customTypeName(n.type) }}</span>
            <span class="spacer"></span>
            <button v-if="n.type === 'image' && n.url" class="ghost small"
                    @pointerdown.stop @click.stop="openLightboxImage(n.url, n.title)">预览</button>
            <button v-if="n.type === 'image'" class="ghost small"
                    @pointerdown.stop @click.stop="pickCustomFile(n, 'image')">上传/换图</button>
            <button v-if="n.type === 'video'" class="ghost small"
                    @pointerdown.stop @click.stop="pickCustomFile(n, 'video')">换视频</button>

              <button class="ghost small" @pointerdown.stop @click.stop="openThreeComposer(n)">设置</button>
              <button class="ghost small"
                      :disabled="n.status === 'queued' || n.status === 'running' ||
                        (n.type === 'personview'
                          ? (!(n.opts && n.opts.person) || !(n.images || []).length)
                          : !(n.images || []).length)"
                      @pointerdown.stop @click.stop="startThreeFromNode(n)">

              </button>

          </div>
