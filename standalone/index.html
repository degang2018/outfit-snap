      finally { this.busyQuick = false }
    },
    /* ---------- 从剧本创建项目(两步:分析实体 -> 指定素材 -> 建项目) ---------- */
    ekey(kind, name) { return kind + ':' + name },
    /**
     * 「按件排镜」:参考片那种剪辑 —— 一件一镜,每镜只演"这件直接吸到她身上、挡住部位",
     * 换装藏在两镜之间的硬切里,最后一镜是"已穿好整套"的展示镜。
     * 件数完全由读图认出来的衣服决定(4 件、5 件都行),内容清单不让模型编。
     */
    async draftPieceScript() {
      this.err = '';
      const parts = this.pieceParts;
      if (!parts.length) { this.err = '先上传服装图、读一次图 —— 要认出「哪张图是哪一件」才能按件排镜'; return; }
      this.busyQuick = true;
      // 换装一件一镜 + 勾选的细节镜 + 最后 1 镜展示 —— 合成一条完整片子。
      // 小件配饰(墨镜…)不单独排镜,从第一镜起就一直戴着,所以不算镜头数。
      const worn = this.alwaysWornParts.length;
      const detail = this.quick.pickedShots.length;
      const count = this.pieceShotParts.length + detail + 1;
      const seconds = Math.max(4, 2.5 * count);
      try {
        const r = await req('/api/projects/draft-script', {
          method: 'POST',
          body: {
            garment: this.quick.garmentDesc || parts.join('、'),
            scene: this.quick.scene,
            scene_desc: this.quick.scene === 'custom' ? this.quick.sceneDesc : '',
            style: this.quick.style,
            props: this.quick.props,
            shot_count: count,
            total_seconds: seconds,
            extra: this.quick.extra,
            float_mode: true,
            float_variant: 'piece',
            base_outfit: this.quick.baseOutfit,
            parts: parts,
            picked_shots: this.quick.pickedShots.slice(),
            custom_actions: this.customActionList()
          }
        });
        this.scriptForm = {
          title: r.title, script: r.script,
          total_seconds: seconds,
          shot_count: count,
          float_mode: true,
          float_variant: 'piece',
          float_base_outfit: this.quick.baseOutfit,
          fromModel: true,
          garmentDesc: this.quick.garmentDesc
        };
        this.scriptStep = 1; this.plan = null; this.assignments = {}; this.entityTab = 'characters';
        this.view = 'script';
        this.notice = `${this.pieceShotParts.length} 件衣服 → 每件一镜的换装镜`
          + (detail ? ` + ${detail} 个细节镜` : '') + ` + 1 个展示镜,共 ${count} 个镜头`
          + (worn ? `(另有 ${worn} 件小配件不单独占镜,全程一直戴着)` : '') + ':'
          + r.engine_detail + '。确认或改完点「下一步:分析人物 / 道具 / 场景」。';
      } catch (e) { this.err = e.message }
      finally { this.busyQuick = false }
    },
    async openScript() {
      this.err = '';
      this.scriptForm = { title: '我的分镜' + (this.projTotal + 1), script: '', total_seconds: 20, shot_count: 5, float_mode: false, float_variant: 'overhead', float_base_outfit: '', fromModel: false, garmentDesc: '' };
      this.scriptStep = 1; this.plan = null; this.assignments = {}; this.entityTab = 'characters';
      this.view = 'script';
      try { this.llm = await req('/api/system/llm') } catch (e) { this.llm = { up: false } }
      try { this.assets = await req('/api/assets') } catch (e) { /* 没素材也能用 */ }
    },
    async analyzeScript() {
      this.err = '';
      const lines = this.contentLines;
      if (!lines) { this.err = '请先填写内容清单(一行一条)'; return; }
      this.busyScript = true;
      try {
        this.plan = await req('/api/projects/analyze-script', {
          method: 'POST',
          body: {
            script: this.scriptForm.script,
            shot_count: Math.min(60, lines),
            total_seconds: this.scriptForm.total_seconds,
            content_mode: true,
            garment_desc: this.scriptForm.garmentDesc || ''
          }
        });
        const assign = {};
        for (const c of this.cats) for (const e of (this.plan[c.k] || [])) assign[c.k + ':' + e.name] = [];
        this.assignments = assign;
        // 读图时已经认出「哪张图是哪一件」:分析把套装拆成「套装-吊带背心 / 套装-开衫…」之后,
        // 自动把对应那张图绑上去 —— 拆件 + 绑图都不用人工点
        this.autoAssigned = this.autoAssignPieces();
        this.entityTab = (this.cats.find(c => (this.plan[c.k] || []).length) || this.cats[0]).k;
        this.scriptStep = 2;
      } catch (e) { this.err = e.message }
      finally { this.busyScript = false }
    },
    /**
     * 小件佩戴配饰(墨镜 / 项链 / 帽…)不单独排镜:从第一镜起就一直戴着。
     * **必须放在 methods 里**:它是被调用的(pieceShotParts / alwaysWornParts 里
     * this.isWornAccessory(p));放进 computed 就变成"读一个值",一调用就报
     * "is not a function" → 整页渲染崩掉(实测踩过,白屏就是这个)。
     * 关键词要和后端 quick_start.is_worn_accessory 保持一致。
     */
    isWornAccessory(name) {
      if (typeof name !== 'string') return false;
      const keys = ['墨镜', '太阳镜', '眼镜', '镜框', '项链', '耳环', '耳钉', '耳饰',
        '戒指', '手链', '手镯', '手表', '腕表', '帽', '围巾', '丝巾', '腰带', '皮带',
        '发夹', '发卡', '发箍', '头饰', '胸针', '领带', '领结', '手套'];
      return keys.some(k => name.includes(k));
    },
    /** 件名 / 道具名 → 归一化关键词:去掉颜色、材质,只留"是什么"。
     *  读图认出的件名和分析出的道具名经常字面对不上(「墨镜」vs「黑色椭圆墨镜」),
     *  归一化之后才绑得上,否则那张图就静默地没绑(实测:墨镜一直"未指定")。 */
    pieceKey(s) {
      s = String(s || '');
      const groups = [
        ['墨镜', '太阳镜', '眼镜', '镜框'],
        ['包', '手提包', '手袋', '托特', '背包', '方包', '手拿包'],
        ['鞋', '球鞋', '靴', '凉鞋'],
        ['吊带背心', '吊带', '背心'], ['开衫'], ['连衣裙'],
        // 件名是开放词表:读图认出来叫「短袖衫」、分析可能写成「套装-藕粉长袖上衣」——
        // 同一部位必须归到同一个 key,否则「要换上的那一件」会漏绑商品图(实测:长袖衫没绑,
        // 提示词退化成"按文字描述生成",模型自己编了一件)。
        ['长袖衫', '长袖上衣', '长袖'], ['短袖衫', '短袖上衣', '短袖'],
        ['长裤', '阔腿裤', '裤'], ['半裙', '裙'], ['内搭', '打底衫'],
        ['外套', '大衣', '风衣', '羽绒'], ['卫衣'], ['连体衣'],
        ['帽子', '帽'], ['项链'], ['围巾', '丝巾'], ['腰带', '皮带'],
        ['耳环', '耳钉'], ['手表', '腕表'], ['手套'], ['配饰'],
        ['上衣', '衫', 'T恤', 'POLO', 'polo'],
      ];
      for (const ks of groups) if (ks.some(k => s.includes(k))) return ks[0];
      return s;
    },
    /** 把读图认出的「件 → 图」自动绑到分析拆出来的道具上(名字能唯一对上才绑) */
    autoAssignPieces() {
      const pieces = this.quick.pieces || {};
      if (!this.plan || !Object.keys(pieces).length) return 0;
      const props = this.plan.props || [];
      let n = 0;
      for (const [part, ref] of Object.entries(pieces)) {
        let hits = props.filter(p => p.name.includes(part) || part.includes(p.name));
        if (hits.length !== 1) {
          // 字面对不上就按"同类"归一化再试(墨镜 = 太阳镜 = 眼镜)
          const key = this.pieceKey(part);
          hits = props.filter(p => this.pieceKey(p.name) === key);
        }
        if (hits.length === 1) { this.assignments['props:' + hits[0].name] = [ref]; n++ }
      }
      return n;
    },
    async createFromScript() {
      this.err = '';
      this.busyScript = true;
      try {
        const res = await req('/api/projects/from-script', {
          method: 'POST',
          body: {
            title: this.scriptForm.title,
            total_seconds: this.scriptForm.total_seconds,
            shot_count: this.scriptForm.shot_count,
            mode: 'ref',
            plan: this.plan,
            assignments: this.assignments,
            float_mode: !!this.scriptForm.float_mode,
            float_variant: this.scriptForm.float_variant || 'overhead',
            float_base_outfit: this.scriptForm.float_base_outfit || '',
            garment_desc: this.scriptForm.garmentDesc || ''
          }
        });
        this.project = res.project;
        this.sel = 0; this.job = this.project.latest_job; this.view = 'editor';
        await this.cacheRefs();
        this.syncConfig();
        this.resetDraft();
        const used = Object.values(this.assignments).filter((v) => v && v.length).length;
        this.notice = (res.engine === 'llm'
          ? `已用 ${res.engine_detail} 切分为 ${res.shot_count} 个镜头`
          : `模型未参与(${res.engine_detail}),已用规则切分为 ${res.shot_count} 个镜头`)
          + `,其中 ${used} 个实体指定了参考图。`;
      } catch (e) { this.err = e.message }
      finally { this.busyScript = false }
    },
    assignedCount(kind) {
      return Object.entries(this.assignments)
        .filter(([k, v]) => k.startsWith(kind + ':') && v && v.length).length;
    },
    /** 某个实体已选的素材对象(用于在行内显示缩略图) */
    assetsOf(key) {
      return (this.assignments[key] || [])
        .map((r) => (r.startsWith('asset:') ? this.assets.find((a) => a.id === Number(r.split(':')[1])) : null))
        .filter(Boolean);
    },
    /* ---------- 素材选择弹窗(可多选 / 上传 / 删除) ---------- */
    openPicker(kind, name) {
      this.err = '';
      const cat = this.cats.find((c) => c.k === kind) || this.cats[0];
      this.picker = { kind, name, tab: cat.v, sel: [...(this.assignments[kind + ':' + name] || [])] };
    },
    togglePick(a) {
      const ref = 'asset:' + a.id;
      const i = this.picker.sel.indexOf(ref);
      if (i >= 0) this.picker.sel.splice(i, 1);
      else this.picker.sel.push(ref);
    },
    confirmPicker() {
      const key = this.picker.kind + ':' + this.picker.name;
      this.assignments = { ...this.assignments, [key]: [...this.picker.sel] };
      this.picker = null;
    },
    async uploadInPicker(ev) {
      const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
      if (!f) return;
      const form = new FormData();
      form.append('file', f);
      form.append('category', this.picker.tab);
      try {
        const a = await req('/api/assets', { method: 'POST', form });
        this.assets = [a, ...this.assets];
        this.picker.sel.push('asset:' + a.id);            // 刚上传的直接选中
      } catch (e) { this.err = e.message }
    },
    async deleteInPicker(a) {
      if (!(await this.askConfirm('删除素材',
        '删除素材「' + a.filename + '」？所有引用它的地方都会失效。',
        { danger: true, confirmText: '删除' }))) return;
      try {
        await req('/api/assets/' + a.id, { method: 'DELETE' });
        const ref = 'asset:' + a.id;
        this.assets = this.assets.filter((x) => x.id !== a.id);
        this.picker.sel = this.picker.sel.filter((r) => r !== ref);
        const next = {};
        for (const [k, v] of Object.entries(this.assignments)) next[k] = (v || []).filter((r) => r !== ref);
        this.assignments = next;
      } catch (e) { this.err = e.message }
    },

    /* ---------- 把项目另存为我的模板 ---------- */
    openSaveTemplate() {
      this.err = '';
      this.tplForm = { title: this.project.title + ' · 模板', description: '' };
      this.tplModal = true;
    },
    async saveAsTemplate() {

    },
    async deleteTemplate(t) {

        { danger: true, confirmText: '删除' }))) return;

      catch (e) { this.err = e.message }
    },
    async useTemplate(t) {
      this.err = '';
      try {
        this.project = await req('/api/projects', { method: 'POST', body: { template_id: t.id } });
        this.sel = 0; this.job = this.project.latest_job; this.view = 'editor';
        this.canvas.sel = []; this.canvas.menu = null; this.composer.open = false;
        this.cameraModal = false;
        this.mentionOpen = false; this.mentionRange = null; this.promptCaretRange = null;
        this.canvas.customNodes = []; this.canvas.links = [];
        this.canvas.addMenu = null; this.canvas.plusDrag = null;
        this.customComposer.open = false;
        this.canvas.ready = false; this.canvas.loadedFor = null;
        await this.cacheRefs();
        this.syncConfig();
        this.resetDraft();

    },
    async openProject(p) {
      try { await this.loadProject(p.id); this.view = 'editor'; this.ensureCanvasLayout() }
      catch (e) { this.err = e.message }
    },
    /** 点进项目 = 先看「分镜成品清单 + 合成视频」,再决定要不要进编辑器 */
    async openDetail(p) {
      try { await this.loadProject(p.id); this.view = 'detail' } catch (e) { this.err = e.message }
    },
    enterEditor() { this.view = 'editor'; this.ensureCanvasLayout(); },
    /** 分镜在「详情」页里的真实状态:有片段才算已生成 */
    shotLabel(s) {
      if (s.clip_url) return '已生成';
      if (s.status === 'running') return '生成中';
      if (s.status === 'failed') return '失败';
      if (this.running) return '排队中';
      return '未生成';
    },
    shotBadge(s) {
      if (s.clip_url) return 'done';
      if (s.status === 'running' || this.running) return 'running';
      if (s.status === 'failed') return 'failed';
      return 'draft';
    },
    /** 删掉单个分镜已生成的视频 */
    async deleteShotClip(s) {
      if (!s.clip_url) return;
      if (!(await this.askConfirm('删除镜头片段',
        '删除镜头 ' + s.idx + '(' + (s.title || s.key) + ') 已生成的视频？镜头会回到「未生成」。',
        { danger: true, confirmText: '删除' }))) return;
      this.err = '';
      try {
        const updated = await req(`/api/projects/${this.project.id}/shots/${s.id}/clip`, { method: 'DELETE' });
        Object.assign(this.project.shots.find(x => x.id === s.id), updated);
      } catch (e) { this.err = e.message }
    },
    /** 删掉合成好的整片 */
    async deleteFilm() {
      if (!this.project || !this.project.final_url) return;
      if (!(await this.askConfirm('删除整片',
        '删除已经合成的整片视频？（各分镜自己的片段会保留）',
        { danger: true, confirmText: '删除' }))) return;
      this.err = '';
      try {
        const updated = await req(`/api/projects/${this.project.id}/film`, { method: 'DELETE' });
        Object.assign(this.project, updated);
      } catch (e) { this.err = e.message }
    },
    /** 这个分镜当下是不是正在被生成(单镜任务看 shot_id,整片任务看 current_shot) */
    jobForShot(s) {
      const sj = this.shotJobs[s.id];
      if (sj && ['queued', 'running'].includes(sj.status)) return sj;
      if (this.job && ['queued', 'running'].includes(this.job.status) && this.job.current_shot === s.key) {
        return this.job;
      }
      return null;
    },
    /** 画布节点上的「排队中」:整片任务在跑、还没轮到这一镜 —— 总得给个反馈,
        不然点完生成画布上一片「参与生成」,看不出到底有没有动(2026-10-20 用户报) */
    shotStage(s) {
      if (this.jobForShot(s)) return '';
      const jb = this.job;
      if (!jb || !['queued', 'running'].includes(jb.status)) return '';
      if (!s.enabled || s.clip_url) return '';
      return '排队中';
    },
    /** 成片 / 分镜片段是静态图(piece_style='static')还是视频:按扩展名判。 */
    isImageUrl(u) { return /\.(png|jpe?g|webp)($|\?)/i.test(u || ''); },
    /** 终止正在生成这个分镜的任务 */
    async cancelShotRender(s) {
      const j = this.jobForShot(s);
      if (!j) return;
      const whole = this.job && this.job.id === j.id;
      if (!(await this.askConfirm('终止生成',
        whole
          ? '镜头 ' + s.idx + ' 正在整片渲染中。终止会停掉整片渲染（已生成好的分镜片段会保留）。确定终止吗？'
          : '终止镜头 ' + s.idx + ' 的生成？',
        { danger: true, confirmText: '终止' }))) return;
      this.err = '';
      try {
        const updated = await req('/api/jobs/' + j.id + '/cancel', { method: 'POST' });
        if (whole) this.job = updated;
        else this.shotJobs = { ...this.shotJobs, [s.id]: updated };
        await this.refreshShots();
      } catch (e) { this.err = e.message }
    },
    async cacheRefs() {
      const set = new Set();
      for (const s of this.project.shots) for (const r of (s.refs || [])) set.add(r);
      for (const r of set) {
        if (this.refInfo[r]) continue;
        this.refInfo[r] = await this.resolveRef(r);
      }
    },
    async resolveRef(r, replace = false) {
      if (r.startsWith('file:')) {
        // 换装链产出的状态图走的是本地绝对路径(file:)。后端把它映射成 /media 地址,
        // 否则「人物服装」里只有文件名、没有缩略图。
        const p = r.slice(5);
        const fname = p.split(/[\\/]/).pop();
        let url = '';
        try { url = (await req('/api/system/media-url?path=' + encodeURIComponent(p))).url || '' } catch (e) { /* ignore */ }
        if (!url) {
          // 兜底(后端还没重启时):storage 下的文件直接映射到 /media
          const m = p.replace(/\\/g, '/').match(/\/storage\/(.+)$/);
          if (m) url = '/media/' + m[1];
        }
        return { url, filename: fname, category: 'other' };
      }
      try {
        const a = await req('/api/assets/' + Number(r.split(':')[1]));
        return { url: a.url, filename: a.filename, category: a.category || 'other', ai_name: a.ai_name || '', ai_kind: a.ai_kind || '' };
      } catch (e) { return { url: '', filename: r, category: 'other' } }
    },
    /* 所有镜头编辑都只改本地草稿,必须点「保存」才落库 */
    touch() { this.$nextTick(this.markDirty) },
    async addRef(ev) {
      const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
      if (!f || !this.draft) return;
      const form = new FormData(); form.append('file', f); form.append('category', this.assetTab);
      try {
        const a = await req('/api/assets', { method: 'POST', form });
        this.refInfo['asset:' + a.id] = { url: a.url, filename: a.filename, category: a.category, ai_name: a.ai_name };
        this.assets = [a, ...this.assets];
        this.draft.refs = [...this.draft.refs, 'asset:' + a.id];
        this.touch();
      } catch (e) { this.err = e.message }
    },
    removeRef(i) {
      if (!this.draft) return;
      const refs = [...this.draft.refs];
      refs.splice(i, 1);
      // keep the <Picture N> tokens in the prompt in sync with the new reference order
      this.draft.prompt = (this.draft.prompt || '').replace(/<Picture (\d+)>/g, (m, d) => {
        const n = Number(d);
        if (n === i + 1) return '';
        return n > i + 1 ? '<Picture ' + (n - 1) + '>' : m;
      });
      this.draft.refs = refs;
      this.mentionOpen = false;
      this.$nextTick(() => this.renderPromptEditor());
      this.touch();
    },
    /** 首帧 / 首尾帧模式:第 1 张 = 首帧,第 2 张 = 尾帧 */
    refRoleLabel(i) {
      if (!this.draft) return '';
      if (this.draft.mode === 'first') return i === 0 ? '首帧' : '';
      if (this.draft.mode === 'first_last') {
        if (i === 0) return '首帧';
        if (i === 1) return '尾帧';
      }
      return '';
    },
    setRefRole(i, role) {
      const to = role === 'last' ? 1 : 0;
      this.moveRef(i, to);
    },
    startRefDrag(ev, i) {
      this.refDrag = i;
      this.lastRefDragAt = Date.now();
      try {
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', 'ref:' + i);
      } catch (e) { /* 某些浏览器不给设,不影响排序 */ }
    },
    /** 点参考图缩略图看大图(拖拽排序之后浏览器补的 click 要忽略) */
    openRefPreview(ref) {
      if (Date.now() - (this.lastRefDragAt || 0) < 300) return;
      const info = this.refInfo[ref] || {};
      if (!info.url) return;
      this.openLightboxImage(info.url, info.filename || '参考图');
    },
    dropRefChip(ev, i) {
      ev.preventDefault();
      const from = this.refDrag;
      this.refDrag = null;
      this.refOver = -1;
      if (from === null || from === i) return;
      this.moveRef(from, i);
    },
    /** 调整参考图顺序:同步重排提示词里的 <Picture N>,首帧/尾帧跟着走 */
    moveRef(from, to) {
      if (!this.draft) return;
      const refs = [...this.draft.refs];
      if (from < 0 || from >= refs.length) return;
      const dst = Math.max(0, Math.min(refs.length - 1, to));
      if (from === dst) return;
      const order = refs.map((_, i) => i);
      const [moved] = order.splice(from, 1);
      order.splice(dst, 0, moved);
      const map = {};
      order.forEach((oldIdx, newIdx) => { map[oldIdx + 1] = newIdx + 1; });
      this.draft.refs = order.map((oldIdx) => refs[oldIdx]);
      this.draft.prompt = (this.draft.prompt || '').replace(/<Picture (\d+)>/g,
        (s, d) => '<Picture ' + (map[Number(d)] || d) + '>');
      this.$nextTick(() => this.renderPromptEditor());
      this.touch();
    },

    /* ---------- 素材管理 ---------- */
    catName(v) { const c = this.cats.find(x => x.v === v); return c ? c.t : v },
    async openAssets() {
      this.showAssets = true;
      if (!this.assets.length) await this.loadAssets();
    },
    async loadAssets() { this.assets = await req('/api/assets') },
    async uploadAsset(ev) {
      const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
      if (!f) return;
      const form = new FormData();
      form.append('file', f);
      form.append('category', this.assetTab);
      try { await req('/api/assets', { method: 'POST', form }); await this.loadAssets() }
      catch (e) { this.err = e.message }
    },
    async saveAsset(a) {
      try {
        await req('/api/assets/' + a.id, { method: 'PATCH',
          body: { category: a.category, filename: a.filename, ai_close: a.ai_close || '' } });
        await this.loadAssets();
      } catch (e) { this.err = e.message }
    },
    async deleteAsset(a) {
      if (!(await this.askConfirm('删除素材',
        '删除素材「' + (a.ai_name || a.filename) + '」？引用了它的镜头会失去这张图。',
        { danger: true, confirmText: '删除' }))) return;
      await req('/api/assets/' + a.id, { method: 'DELETE' });
      const s = new Set(this.assetSel); s.delete(a.id); this.assetSel = s;
      await this.loadAssets();
    },
    /* ---------- 资源管理:多选 + 批量删除 ---------- */
    toggleAssetSel(id) {
      const s = new Set(this.assetSel);
      if (s.has(id)) s.delete(id); else s.add(id);
      this.assetSel = s;
    },
    /** 只选当前分类里**能删的**(内置素材不能删) */
    selectAllAssets() {
      this.assetSel = new Set(this.assets
        .filter(a => a.category === this.assetTab && !a.is_system).map(a => a.id));
    },
    clearAssetSel() { this.assetSel = new Set() },
    /** 资源管理卡片顶部显示的名字:服装 / 道具显示读图认出的中文件名,认不出就写「未认件」;
     *  人物 / 场景这类本来就没有件名,退回显示文件名(否则一排「未认件」看不出哪张是哪张)。 */
    assetTitle(a) {
      if (a.ai_name) return a.ai_name;
      return (a.category === 'prop' || a.category === 'wear_ref') ? '未认件' : a.filename;
    },
    async deleteSelectedAssets() {
      const ids = [...this.assetSel].filter(id => this.assets.some(a => a.id === id && !a.is_system));
      if (!ids.length) { this.err = '先勾选要删除的素材(内置素材不能删)'; return }
      if (!(await this.askConfirm('删除素材',
        '删除选中的 ' + ids.length + ' 张素材？引用了它们的镜头会失去这些图，且不可恢复。',
        { danger: true, confirmText: '删除' }))) return;
      this.err = ''; this.notice = '';
      let done = 0; const bad = [];
      for (const id of ids) {
        try { await req('/api/assets/' + id, { method: 'DELETE' }); done++ }
        catch (e) { bad.push(id) }
      }
      this.assetSel = new Set(bad);
      await this.loadAssets();
      if (bad.length) this.err = `已删除 ${done} 张,还有 ${bad.length} 张失败(可能正在被项目占用,稍后再试)`;
      else this.notice = `已删除 ${done} 张素材`;
    },
    dragAsset(ev, a) {
      this._dragged = true;
      ev.dataTransfer.setData('text/plain', 'asset:' + a.id);
      ev.dataTransfer.effectAllowed = 'copy';
    },
    dragEnd() { setTimeout(() => { this._dragged = false }, 180) },
    insertAsset(a) { if (!this._dragged) this.insertAssetRef('asset:' + a.id) },
    /** 拖进提示词时把插入点跟到鼠标位置,而不是上一次的光标 */
    promptDragOver(ev) {
      this.dragOver = true;
      if (!document.caretRangeFromPoint) return;
      const range = document.caretRangeFromPoint(ev.clientX, ev.clientY);
      const ed = this.$refs.promptEditor;
      if (range && ed && ed.contains(range.startContainer)) {
        this.promptCaretRange = range.cloneRange();
      }
    },
    /** 把编辑区的光标放到「拖进来的落点」,chip 才会插在鼠标位置 */
    placePromptCaret() {
      const ed = this.$refs.promptEditor;
      if (!ed || !this.promptCaretRange || !ed.contains(this.promptCaretRange.startContainer)) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(this.promptCaretRange);
    },
    dropPrompt(ev) {
      this.dragOver = false;
      this.placePromptCaret();
      const raw = ev.dataTransfer.getData('text/plain') || '';
      // 从参考图 chip 拖进来:把这张图作为内联引用插到落点
      if (raw.indexOf('ref:') === 0) {
        const i = Number(raw.slice(4));
        const ref = this.draft && this.draft.refs[i];
        if (ref) {
          this.$nextTick(() => { this.insertPromptChip(ref, i); this.markDirty(); });
        }
        return;
      }
      if (raw && raw.indexOf('asset:') === 0) this.insertAssetRef(raw);
    },
    /** 把素材加进本镜头参考图(草稿),并在光标处插入内联图片 chip */
    async insertAssetRef(ref) {
      if (!this.draft) return;
      if (!this.refInfo[ref]) {
        const aid = Number(String(ref).split(':')[1]);
        const a = this.assets.find((x) => x.id === aid);
        if (a) {
          this.refInfo[ref] = { url: a.url, filename: a.filename, category: a.category,
                                ai_name: a.ai_name || '', ai_kind: a.ai_kind || '' };
        } else {
          try { this.refInfo[ref] = await this.resolveRef(ref) } catch (e) { /* ignore */ }
        }
      }
      const refs = [...this.draft.refs];
      let n = refs.indexOf(ref);
      if (n === -1) { refs.push(ref); n = refs.length - 1; }
      this.draft.refs = refs;
      this.$nextTick(() => {
        this.insertPromptChip(ref, n);
        this.markDirty();
      });
    },
    /* ================= 提示词:内联图片 + @ 引用 ================= */
    escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    },
    escapeAttr(s) { return this.escapeHtml(s) },
    promptChipHtml(ref, idx) {
      if (!ref) return this.escapeHtml('<Picture ' + (idx + 1) + '>');
      const info = this.refInfo[ref] || {};
      const name = info.ai_name || info.filename || ref;
      // 不在数据里写死省略号:交给 CSS 的 text-overflow,完整名字放在 title 里
      const short = name;
      const thumb = info.url
        ? '<img src="' + this.escapeAttr(info.url) + '" alt="">'
        : '<span class="ph">' + this.escapeHtml(short.slice(0, 1)) + '</span>';
      return '<span class="prompt-chip" contenteditable="false" data-ref="' + this.escapeAttr(ref)
        + '" title="' + this.escapeAttr(name) + '">'
        + thumb
        + '<span class="chip-name">' + this.escapeHtml(short) + '</span>'
        + '<span class="chip-idx">' + (idx + 1) + '</span>'
        + '</span>';
    },
    /** 把 <Picture N> 文本转成「缩略图 chip」的 HTML */
    promptHtml() {
      const refs = (this.draft && this.draft.refs) || [];
      const text = (this.draft && this.draft.prompt) || '';
      let html = '', last = 0, m;
      const re = /<Picture\s+(\d+)>/g;
      while ((m = re.exec(text))) {
        html += this.escapeHtml(text.slice(last, m.index));
        const n = Number(m[1]);
        html += this.promptChipHtml(refs[n - 1], n - 1);
        last = m.index + m[0].length;
      }
      html += this.escapeHtml(text.slice(last));
      return html;
    },
    renderPromptEditor() {
      const ed = this.$refs.promptEditor;
      if (!ed || !this.draft) return;
      ed.innerHTML = this.promptHtml();
      this.promptCaretRange = null;
      this.mentionRange = null;
      this.mentionOpen = false;
    },
    /** DOM -> 纯文本:chip 还原成 <Picture N>,保留换行 */
    serializePromptNode(node) {
      if (!node) return '';
      if (node.nodeType === 3) return node.nodeValue || '';
      if (node.nodeType !== 1) return '';
      const el = node;
      if (el.classList && el.classList.contains('prompt-chip')) {
        const ref = el.getAttribute('data-ref');
        const refs = (this.draft && this.draft.refs) || [];
        const idx = refs.indexOf(ref);
        return idx >= 0 ? '<Picture ' + (idx + 1) + '>' : '';
      }
      if (el.tagName === 'BR') return '\n';
      let out = '';
      for (const child of el.childNodes) out += this.serializePromptNode(child);
      if ((el.tagName === 'DIV' || el.tagName === 'P') && out && !out.endsWith('\n')) out += '\n';
      return out;
    },
    serializePromptEditor() {
      const ed = this.$refs.promptEditor;
      if (!ed || !this.draft) return;
      let text = '';
      for (const child of ed.childNodes) text += this.serializePromptNode(child);
      text = text.replace(/\u00a0/g, ' ').replace(/\n+$/, '');
      this.draft.prompt = text;
    },
    onPromptInput() {
      this.serializePromptEditor();
      this.markDirty();
      this.savePromptCaret();
      this.detectMention();
    },
    onPromptClick() {
      this.savePromptCaret();
      this.detectMention();
    },
    savePromptCaret() {
      const ed = this.$refs.promptEditor;
      const sel = window.getSelection();
      if (!ed || !sel || !sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      if (!ed.contains(range.startContainer)) return;
      this.promptCaretRange = range.cloneRange();
    },
    onPromptBlur() {
      clearTimeout(this._mentionBlurTimer);
      this._mentionBlurTimer = setTimeout(() => { this.mentionOpen = false; }, 140);
    },
    onPromptKeydown(ev) {
      if (!this.mentionOpen) return;
      if (ev.key === 'ArrowDown') {
        ev.preventDefault();
        const max = Math.max(0, this.mentionItems.length - 1);
        this.mentionIndex = Math.min(this.mentionIndex + 1, max);
        return;
      }
      if (ev.key === 'ArrowUp') {
        ev.preventDefault();
        this.mentionIndex = Math.max(0, this.mentionIndex - 1);
        return;
      }
      if (ev.key === 'Enter' || ev.key === 'Tab') {
        const it = this.mentionItems[this.mentionIndex];
        if (it) { ev.preventDefault(); this.pickMention(it) }
        return;
      }
      if (ev.key === 'Escape') {
        ev.preventDefault();
        ev.stopPropagation();
        this.mentionOpen = false;
        this.mentionRange = null;
      }
    },
    /** 检测光标前是否有 @查询 */
    detectMention() {
      const ed = this.$refs.promptEditor;
      const sel = window.getSelection();
      if (!ed || !sel || !sel.rangeCount) { this.mentionOpen = false; return; }
      const range = sel.getRangeAt(0);
      if (!ed.contains(range.startContainer)) { this.mentionOpen = false; return; }
      const pre = range.cloneRange();
      pre.selectNodeContents(ed);
      pre.setEnd(range.startContainer, range.startOffset);
      const text = pre.toString().replace(/\u00a0/g, ' ');
      const m = /@\s*([^\s@]*)$/.exec(text);
      if (!m) { this.mentionOpen = false; return; }
      this.openMention(m[1], range);
    },
    openMention(query, range) {
      clearTimeout(this._mentionBlurTimer);
      this.mentionQuery = query || '';
      this.mentionIndex = 0;
      this.mentionOpen = true;
      this.mentionRange = range ? range.cloneRange() : null;
      const ed = this.$refs.promptEditor;
      if (ed) {
        const r = ed.getBoundingClientRect();
        this.mentionPos = {
          x: Math.max(12, Math.min(r.left + 6, window.innerWidth - 356)),
          y: Math.max(12, window.innerHeight - r.top + 8)
        };
      }
      if (!this.assets.length) this.loadAssets().catch(() => {});
    },
    closeMention() {
      this.mentionOpen = false;
      this.mentionRange = null;
    },
    /** 选中 @ 候选:删掉 @查询,把它作为图片 chip 插进提示词 */
    pickMention(it) {
      if (!it || !this.draft) return;
      const ed = this.$refs.promptEditor;
      const sel = window.getSelection();
      if (ed && this.mentionRange && ed.contains(this.mentionRange.startContainer)) {
        sel.removeAllRanges();
        sel.addRange(this.mentionRange);
      }
      this.mentionOpen = false;
      if (this.draft.refs.indexOf(it.ref) < 0) {
        this.draft.refs = [...this.draft.refs, it.ref];
      }
      if (!this.refInfo[it.ref]) {
        const a = it.asset;
        this.refInfo[it.ref] = a
          ? { url: a.url, filename: a.filename, category: a.category,
              ai_name: a.ai_name || '', ai_kind: a.ai_kind || '' }
          : { url: it.url || '', filename: it.name || it.ref, category: 'other' };
      }
      const idx = this.draft.refs.indexOf(it.ref);
      this.removeMentionTrigger();
      this.insertPromptChip(it.ref, idx);
      this.mentionRange = null;
      this.markDirty();
    },
    removeMentionTrigger() {
      const ed = this.$refs.promptEditor;
      const sel = window.getSelection();
      if (!ed || !sel || !sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      if (!ed.contains(range.startContainer)) return;
      let node = range.startContainer;
      let offset = range.startOffset;
      // 光标可能落在父元素上(比如按钮插入 @ 后),回退到前一个文本节点
      if (node.nodeType !== 3) {
        let prev = node.childNodes[offset - 1];
        while (prev && prev.nodeType !== 3) prev = prev.lastChild;
        if (prev && prev.nodeType === 3) {
          node = prev;
          offset = (prev.nodeValue || '').length;
        }
      }
      if (node.nodeType !== 3) return;
      const before = (node.nodeValue || '').slice(0, offset);
      const at = before.lastIndexOf('@');
      if (at < 0) return;
      const del = document.createRange();
      del.setStart(node, at);
      del.setEnd(node, offset);
      del.deleteContents();
      del.collapse(true);
      sel.removeAllRanges();
      sel.addRange(del);
      this.promptCaretRange = del.cloneRange();
    },
    insertPromptChip(ref, idx) {
      const ed = this.$refs.promptEditor;
      if (!ed || !this.draft) {
        if (this.draft) this.draft.prompt = (this.draft.prompt || '') + '<Picture ' + (idx + 1) + '>';
        return;
      }
      const wrap = document.createElement('div');
      wrap.innerHTML = this.promptChipHtml(ref, idx);
      const chip = wrap.firstElementChild;
      if (!chip) return;
      const sel = window.getSelection();
      let range = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
      if (!range || (!ed.contains(range.startContainer) && range.startContainer !== ed)) {
        if (this.promptCaretRange && ed.contains(this.promptCaretRange.startContainer)) {
          range = this.promptCaretRange;
        } else {
          range = document.createRange();
          range.selectNodeContents(ed);
          range.collapse(false);
        }
      }
      ed.focus();
      range.deleteContents();
      range.insertNode(chip);
      const space = document.createTextNode(' ');
      if (chip.parentNode) chip.parentNode.insertBefore(space, chip.nextSibling);
      const after = document.createRange();
      after.setStartAfter(space);
      after.collapse(true);
      sel.removeAllRanges();
      sel.addRange(after);
      this.promptCaretRange = after.cloneRange();
      this.serializePromptEditor();
    },
    /** 点头部 @ 按钮:在光标处插入一个 @ 并直接弹出候选 */
    openMentionFromButton() {
      const ed = this.$refs.promptEditor;
      if (!ed) return;
      ed.focus();
      const sel = window.getSelection();
      let range = null;
      if (this.promptCaretRange && ed.contains(this.promptCaretRange.startContainer)) {
        range = this.promptCaretRange.cloneRange();
      } else {
        range = document.createRange();
        range.selectNodeContents(ed);
        range.collapse(false);
      }
      sel.removeAllRanges();
      sel.addRange(range);
      const at = document.createTextNode('@');
      range.insertNode(at);
      const after = document.createRange();
      after.setStart(at, 1);
      after.collapse(true);
      sel.removeAllRanges();
      sel.addRange(after);
      this.promptCaretRange = after.cloneRange();
      this.serializePromptEditor();
      this.markDirty();
      this.openMention('', after.cloneRange());
    },
    /* ================= 分镜节点画布(节点管理) ================= */
    /** 取节点坐标;没保存过就用默认位置 */
    nodePosition(key, fallback) {
      const p = this.canvas.positions[key];
      if (p && Number.isFinite(p.x) && Number.isFinite(p.y)) return p;
      return fallback;
    },
    shotDefaultPos(i) {
      return { x: 620 + (i % 3) * 340, y: 96 + Math.floor(i / 3) * 430 };
    },
    refGroupSize(g) {
      const rows = Math.max(1, Math.ceil(g.items.length / 3));
      return { w: 388, h: 59 + rows * 122 };
    },
    edgePath(x1, y1, x2, y2) {
      const dx = Math.max(52, Math.abs(x2 - x1) * 0.45);
      return 'M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + y1 + ', ' + (x2 - dx) + ' ' + y2 + ', ' + x2 + ' ' + y2;
    },
    /**
     * 初始化 / 合并节点坐标。
     * 优先用后端保存的项目画布状态(跨设备),没存过就用浏览器本地兜底。
     */
    ensureCanvasLayout(force = false, fit = true) {
      if (!this.project) return;
      const pid = this.project.id;
      let saved = null;
      if (!force) {
        const backend = this.project.canvas_state;
        if (backend && typeof backend === 'object' && backend.positions
            && Object.keys(backend.positions).length) {
          saved = backend;
        } else {
          try { saved = JSON.parse(localStorage.getItem('ovs_canvas_' + pid) || 'null') }
          catch (e) { saved = null }
        }
      }
      const savedPos = (saved && saved.positions) || {};
      const positions = {};
      // 参考图组:左边竖排
      let gy = 86;
      for (const g of this.canvasRefNodes) {
        positions[g.key] = force ? { x: 60, y: gy } : (savedPos[g.key] || { x: 60, y: gy });
        gy += g.h + 34;
      }
      // 分镜节点:网格排布
      (this.project.shots || []).forEach((s, i) => {
        const key = 'shot:' + s.id;
        positions[key] = force ? this.shotDefaultPos(i) : (savedPos[key] || this.shotDefaultPos(i));
      });
      // 自定义节点(图片 / 文本 / 视频)与手动连线
      const currentNodes = this.canvas.customNodes || [];
      const currentLinks = this.canvas.links || [];
      const savedNodes = (saved && Array.isArray(saved.custom_nodes)) ? saved.custom_nodes : currentNodes;
      const savedLinks = (saved && Array.isArray(saved.links)) ? saved.links : currentLinks;
      this.canvas.customNodes = savedNodes.map((n) => ({ ...n }));
      this.canvas.links = savedLinks.map((l) => ({ ...l }));
      this.canvas.customNodes.forEach((n, i) => {
        const key = 'custom:' + n.id;
        const fallback = { x: 60, y: 520 + i * 240 };
        positions[key] = force ? this.nodePosition(key, fallback) : (savedPos[key] || fallback);
      });
      this.canvas.positions = positions;
      if (saved && !force && this.canvas.loadedFor !== pid) {
        this.canvas.zoom = Number(saved.zoom) > 0 ? Number(saved.zoom) : 1;
        this.canvas.panX = Number(saved.panX) || 0;
        this.canvas.panY = Number(saved.panY) || 0;
        if (typeof saved.showLinks === 'boolean') this.canvas.showLinks = saved.showLinks;
        if (typeof saved.snap === 'boolean') this.canvas.snap = saved.snap;
        if (typeof saved.grid === 'boolean') this.canvas.grid = saved.grid;
      }
      this.canvas.loadedFor = pid;
      this.canvas.ready = true;
      // 刷新页面 / 切回项目时,把还在跑的三视图任务接上轮询
      this.canvas.customNodes.forEach((n) => {
        if (n.type === 'threeview' && ['queued', 'running'].includes(n.status)) {
          this.pollThreeView(n.id);
        }
      });
      this.$nextTick(() => {
        if (force && fit) this.fitCanvas();
        else if (!saved) this.initialCanvasView();
      });
      this.saveCanvasStateSoon();
    },
    /** 第一次进画布:不硬塞「全览」缩到看不清,而是按可读比例把左上角(参考图 + 前几个分镜)摆进视野 */
    initialCanvasView() {
      const stage = this.$refs.stage;
      if (!stage) return;
      const z = Math.max(0.4, Math.min(0.62, stage.clientWidth / 1900));
      this.canvas.zoom = z;
      this.canvas.panX = 92 - 60 * z;
      this.canvas.panY = 82 - 86 * z;
      this.saveCanvasStateSoon();
    },
    saveCanvasStateSoon() {
      clearTimeout(this.canvas.saveTimer);
      this.canvas.saveTimer = setTimeout(() => this.saveCanvasState(), 500);
    },
    saveCanvasState() {
      if (!this.project || !this.canvas.ready) return;
      const state = {
        positions: this.canvas.positions,
        custom_nodes: this.canvas.customNodes,
        links: this.canvas.links,
        zoom: Math.round(this.canvas.zoom * 1000) / 1000,
        panX: Math.round(this.canvas.panX),
        panY: Math.round(this.canvas.panY),
        showLinks: this.canvas.showLinks,
        snap: this.canvas.snap,
        grid: this.canvas.grid
      };
      try { localStorage.setItem('ovs_canvas_' + this.project.id, JSON.stringify(state)) }
      catch (e) { /* 本地存不下也不影响 */ }
      this.project.canvas_state = state;
      // 后端还没重启/字段不存在时会失败 —— 本地已经存了一份,忽略即可
      return req('/api/projects/' + this.project.id, { method: 'PATCH', body: { canvas_state: state } })
        .catch(() => {});
    },
    worldStyle() {
      return { transform: 'translate(' + this.canvas.panX + 'px,' + this.canvas.panY + 'px) scale(' + this.canvas.zoom + ')' };
    },
    refNodeStyle(n) {
      return { width: n.w + 'px', height: n.h + 'px', transform: 'translate(' + n.x + 'px,' + n.y + 'px)' };
    },
    shotNodeStyle(n) {
      return { transform: 'translate(' + n.x + 'px,' + n.y + 'px)' };
    },
    addNodeStyle() {
      const p = this.canvasAddNodePos;
      return { transform: 'translate(' + p.x + 'px,' + p.y + 'px)' };
    },
    chainFrameStyle(f) {
      return { width: f.w + 'px', height: f.h + 'px', transform: 'translate(' + f.x + 'px,' + f.y + 'px)' };
    },
    /* ---------- 自定义节点(图片 / 文本 / 视频) ---------- */
    customTypeName(type) {
      if (type === 'text') return '文本';
      if (type === 'video') return '视频';
      if (type === 'threeview') return '三视图';
      if (type === 'personview') return '人物三视图';
      return '图片';
    },
    customTypeIcon(type) {
      if (type === 'text') return 'T';
      if (type === 'video') return '▶';
      if (type === 'threeview') return '◫';
      if (type === 'personview') return '◨';
      return '▢';
    },
    customNodeSize(n) {
      const type = n && n.type;
      if (type === 'image') return { w: 320, h: 300 };
      if (type === 'video') return { w: 320, h: 220 };
      if (type === 'threeview') return { w: 370, h: 320 };
      if (type === 'personview') return { w: 380, h: 340 };
      return { w: 240, h: 170 };
    },
    /* 只有鼠标经过节点(或选中/正在拖线)时才显示左右加号 */
    nodeEnter(key) {
      clearTimeout(this.canvas.plusHideTimer);
      this.canvas.hoverKey = key;
    },
    nodeLeave(key) {
      clearTimeout(this.canvas.plusHideTimer);
      this.canvas.plusHideTimer = setTimeout(() => {
        if (this.canvas.hoverKey === key) this.canvas.hoverKey = '';
      }, 220);
    },
    plusEnter(key) {
      clearTimeout(this.canvas.plusHideTimer);
      this.canvas.hoverKey = key;
    },
    plusLeave(key) {
      this.nodeLeave(key);
    },
    plusVisible(key) {
      return this.canvas.hoverKey === key
        || (this.canvas.addMenu && this.canvas.addMenu.key === key)
        || (this.canvas.plusDrag && this.canvas.plusDrag.key === key);
    },
    customNodeStyle(n) {
      const p = this.nodePosition('custom:' + n.id, { x: 0, y: 0 });
      const s = this.customNodeSize(n);
      return { width: s.w + 'px', height: s.h + 'px',
               transform: 'translate(' + p.x + 'px,' + p.y + 'px)' };
    },
    /** 任意节点 key -> 世界坐标里的矩形(手动连线 / 加号定位都用它) */
    nodeRectByKey(key) {
      if (!key) return null;
      if (key.indexOf('shot:') === 0) {
        const id = Number(key.slice(5));
        const n = this.canvasShotNodes.find((x) => x.shot.id === id);
        return n ? { x: n.x, y: n.y, w: 288, h: 374 } : null;
      }
      if (key.indexOf('custom:') === 0) {
        const id = key.slice(7);
        const n = this.canvas.customNodes.find((x) => x.id === id);
        if (!n) return null;
        const s = this.customNodeSize(n);
        const p = this.nodePosition(key, { x: 0, y: 0 });
        return { x: p.x, y: p.y, w: s.w, h: s.h };
      }
      if (key.indexOf('ref:') === 0) {
        const g = this.canvasRefNodes.find((x) => x.key === key);
        return g ? { x: g.x, y: g.y, w: g.w, h: g.h } : null;
      }
      return null;
    },
    plusStyle(key, side) {
      const r = this.nodeRectByKey(key);
      if (!r) return { display: 'none' };
      const x = side === 'left' ? r.x - 40 : r.x + r.w + 8;
      // 左右两个加号错开高度,避免相邻两列的加号在窄间距里叠在一起点错
      const y = r.y + r.h * (side === 'left' ? 0.34 : 0.66) - 16;
      return { transform: 'translate(' + x + 'px,' + y + 'px)' };
    },
    /** 给新节点找一个不和现有节点重叠的位置(先往下挪) */
    freeCustomPos(x, y, w, h, skipKey) {
      const rects = [];
      for (const g of this.canvasRefNodes) rects.push({ key: g.key, x: g.x, y: g.y, w: g.w, h: g.h });
      for (const n of this.canvasShotNodes) {
        const key = 'shot:' + n.shot.id;
        if (key !== skipKey) rects.push({ key, x: n.x, y: n.y, w: 288, h: 374 });
      }
      for (const n of this.canvas.customNodes) {
        const key = 'custom:' + n.id;
        if (key !== skipKey) {
          const r = this.nodeRectByKey(key);
          if (r) rects.push({ key, ...r });
        }
      }
      const add = this.canvasAddNodePos;
      rects.push({ key: 'add', x: add.x, y: add.y, w: 288, h: 112 });
      let ny = y;
      for (let i = 0; i < 30; i += 1) {
        const hit = rects.find((r) => r.key !== skipKey &&
          x < r.x + r.w + 18 && x + w + 18 > r.x && ny < r.y + r.h + 18 && ny + h + 18 > r.y);
        if (!hit) break;
        ny = hit.y + hit.h + 26;
      }
      return { x, y: ny };
    },
    /** 加号:点一下加节点,拖动则连到另一个节点 */
    startPlus(ev, key, side) {
      if (ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      this.canvas.addMenu = null;
      if (this.canvas.plusDrag) return;
      const stage = this.$refs.stage;
      const rect = stage ? stage.getBoundingClientRect() : { left: 0, top: 0 };
      this.canvas.plusDrag = {
        key, side,
        startClientX: ev.clientX, startClientY: ev.clientY,
        sx: ev.clientX - rect.left, sy: ev.clientY - rect.top,
        x: ev.clientX - rect.left, y: ev.clientY - rect.top,
        moved: false
      };
      window.addEventListener('pointermove', this.onPlusMove);
      window.addEventListener('pointerup', this.onPlusUp);
    },
    /** 鼠标位置下面是哪个节点(从最上层往下找,避开加号、连线等遮罩) */
    nodeKeyAtPoint(cx, cy) {
      const list = document.elementsFromPoint
        ? document.elementsFromPoint(cx, cy)
        : [document.elementFromPoint(cx, cy)];
      for (const el of list) {
        const host = el && el.closest ? el.closest('[data-node-key]') : null;
        if (host) return host.getAttribute('data-node-key') || '';
      }
      return '';
    },
    onPlusMove(ev) {
      const d = this.canvas.plusDrag;
      if (!d) return;
      const stage = this.$refs.stage;
      const rect = stage ? stage.getBoundingClientRect() : { left: 0, top: 0 };
      if (Math.abs(ev.clientX - d.startClientX) + Math.abs(ev.clientY - d.startClientY) > 5) {
        d.moved = true;
      }
      d.x = ev.clientX - rect.left;
      d.y = ev.clientY - rect.top;
      if (d.moved) {
        const over = this.nodeKeyAtPoint(ev.clientX, ev.clientY);
        this.canvas.dropKey = over === d.key ? '' : over;
      }
    },
    onPlusUp(ev) {
      window.removeEventListener('pointermove', this.onPlusMove);
      window.removeEventListener('pointerup', this.onPlusUp);
      const d = this.canvas.plusDrag;
      this.canvas.plusDrag = null;
      this.canvas.dropKey = '';
      if (!d) return;
      if (!d.moved) {
        this.canvas.addMenu = {
          x: Math.min(ev.clientX, window.innerWidth - 200),
          y: Math.min(ev.clientY, window.innerHeight - 190),
          key: d.key, side: d.side
        };
        return;
      }
      const target = this.nodeKeyAtPoint(ev.clientX, ev.clientY);
      if (!target || target === d.key) {
        this.notice = '把线拖到另一个节点的卡片上才会连起来';
        return;
      }
      if (target.indexOf('ref:') === 0) {
        this.notice = '参考图节点只能作为起点,不能作为连线终点';
        return;
      }
      const from = d.side === 'left' ? target : d.key;
      const to = d.side === 'left' ? d.key : target;
      this.createLink(from, to);
    },
    /** 连线方向即数据方向:from 的尾帧/图片 传给 to */
    async createLink(from, to) {
      if (!from || !to || from === to) return;
      if (this.canvas.links.some((l) =>
        (l.from === from && l.to === to) || (l.from === to && l.to === from))) {
        this.notice = '这两个节点已经连过了';
        return;
      }
      const link = {
        id: 'l_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        from, to
      };
      this.canvas.links = [...this.canvas.links, link];
      await this.saveCanvasState();
      this.notice = '正在连接节点…';
      try {
        const res = await req(`/api/projects/${this.project.id}/canvas/link`, {
          method: 'POST',
          body: { from, to }
        });
        const msg = (res && res.message)
          || (res && res.applied ? '已连接节点' : '已连线,但源节点还没有可传递的画面');
        if (res && res.reload) await this.openProject({ id: this.project.id });
        this.notice = msg;
      } catch (e) {
        this.canvas.links = this.canvas.links.filter((l) => l.id !== link.id);
        await this.saveCanvasState();
        this.err = e.message;
      }
    },
    removeLink(edge) {
      if (!edge) return;
      this.canvas.links = this.canvas.links.filter((l) => l.id !== edge.id);
      this.saveCanvasState();
      this.notice = '已删除连线';
    },
    async addCustomNode(type) {
      const menu = this.canvas.addMenu;
      if (!menu || !this.project) return;
      if (type === 'video') {
        this.addVideoShotFromPlus(menu);
        return;
      }
      this.canvas.addMenu = null;
      const r = this.nodeRectByKey(menu.key) || { x: 300, y: 300, w: 240, h: 200 };
      const id = 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const key = 'custom:' + id;
      const size = this.customNodeSize({ type });
      const x = menu.side === 'left' ? r.x - size.w - 90 : r.x + r.w + 90;
      const y = r.y;
      const pos = this.freeCustomPos(x, y, size.w, size.h);
      const title = type === 'image'
        ? '图片 ' + (this.canvas.customNodes.filter((x) => x.type === 'image').length + 1)
        : this.customTypeName(type);
      const node = { id, type, title, text: '', url: '', ref: '', images: [], imageIndex: 0 };
      if (type === 'threeview') {
        node.outputs = [];
        node.status = '';
        node.error = '';
        node.message = '';
        node.opts = { source: 'garment', subject: 'mannequin', full_body: false, head: true, per_piece: false, split: false, prompt: '' };
      }
      if (type === 'personview') {
        node.outputs = [];
        node.status = '';
        node.error = '';
        node.message = '';
        node.opts = { mode: 'person', person: '', split: false, prompt: '' };
      }
      this.canvas.customNodes = [...this.canvas.customNodes, node];
      this.canvas.positions = { ...this.canvas.positions, [key]: pos };
      const from = menu.side === 'left' ? key : menu.key;
      const to = menu.side === 'left' ? menu.key : key;
      this.canvas.links = [...this.canvas.links, {
        id: 'l_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        from, to
      }];
      this.canvas.sel = [key];
      await this.saveCanvasState();

      if (type === 'image' || type === 'threeview' || type === 'personview') {
        // 图片 / 三视图 / 人物三视图节点都不自动弹上传框:用户自己点节点上传/生成。
        // 但如果是从一个有画面的节点连过来的,把它的尾帧/图片先带过来。
        const fallback = type === 'threeview'
          ? '已添加三视图节点，点击节点上传图片或连线接入画面'
          : type === 'personview'
            ? '已添加人物三视图节点，点击节点上传人物照片和服装'
            : '已添加图片节点，点击节点上传或生成';
        try {
          const res = await req(`/api/projects/${this.project.id}/canvas/link`, {
            method: 'POST', body: { from: menu.key, to: key }
          });
          if (res.applied) await this.openProject({ id: this.project.id });
          else this.notice = res.message || fallback;
        } catch (e) {
          this.notice = fallback;
        }
      } else {
        this.notice = '已添加文本节点';
        this.$nextTick(() => {
          const el = document.querySelector('[data-node-key="' + key + '"] textarea');
          if (el) el.focus();
        });
      }
    },
    async deleteCustomNode(n) {
      if (!n) return;
      if (!(await this.askConfirm('删除节点',
        '删除这个「' + this.customTypeName(n.type) + '」节点?',
        { danger: true, confirmText: '删除' }))) return;
      const key = 'custom:' + n.id;
      this.canvas.customNodes = this.canvas.customNodes.filter((x) => x.id !== n.id);
      const positions = { ...this.canvas.positions };
      delete positions[key];
      this.canvas.positions = positions;
      this.canvas.links = this.canvas.links.filter((l) => l.from !== key && l.to !== key);
      this.canvas.sel = this.canvas.sel.filter((k) => k !== key);
      if (this.customComposer.id === n.id) this.customComposer.open = false;
      this.saveCanvasState();
    },
    pickCustomFile(n, kind) {
      if (!n) return;
      this.customUpload = { id: n.id, kind };
      const input = this.$refs.customFile;
      if (!input) return;
      input.accept = kind === 'video' ? 'video/*' : 'image/*';
      input.value = '';
      input.click();
    },
    async onCustomFilePicked(ev) {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      const up = this.customUpload;
      this.customUpload = null;
      if (!file || !up || !this.project) return;
      const node = this.canvas.customNodes.find((x) => x.id === up.id);
      if (!node) return;
      const form = new FormData();
      form.append('file', file);
      this.err = '';
      try {
        const res = await req('/api/projects/' + this.project.id + '/canvas/upload',
          { method: 'POST', form });
        node.url = res.url;
        node.ref = res.ref || '';
        if (up.kind === 'image') {
          node.images = [res.url];
          node.imageIndex = 0;
          node.filename = res.filename || '';
        } else {
          node.title = res.filename || node.title;
        }
        this.saveCanvasState();
        this.notice = up.kind === 'image' ? '图片已添加' : '视频已添加';
      } catch (e) { this.err = e.message }
    },
    onCustomTextInput(n) {
      this.saveCanvasStateSoon();
    },
    /** 加号 → 视频:新增一个正常的视频分镜,点开就是图1那套创作面板 */
    async addVideoShotFromPlus(menu) {
      if (!menu || !this.project) return;
      this.canvas.addMenu = null;
      this.notice = '正在添加视频镜头…';
      this.err = '';
      try {
        const created = await req(`/api/projects/${this.project.id}/shots/add-general`, {
          method: 'POST',
          body: {
            title: '新视频镜头',
            action: '她站在纯白背景前，自然看向镜头，动作自然流畅。',
            seconds: 3.0
          }
        });
        // 把源节点的尾帧/图片先传给这个新视频镜头
        let linkMsg = '';
        try {
          const lr = await req(`/api/projects/${this.project.id}/canvas/link`, {
            method: 'POST',
            body: { from: menu.key, to: 'shot:' + created.id }
          });
          linkMsg = lr.message || '';
        } catch (e) { /* 源节点没有画面时只建立连线 */ }
        await this.openProject({ id: this.project.id });
        const shot = this.project.shots.find((s) => s.id === created.id);
        if (!shot) return;
        const r = this.nodeRectByKey(menu.key) || { x: 300, y: 300, w: 288, h: 374 };
        const x = menu.side === 'left' ? r.x - 288 - 90 : r.x + r.w + 90;
        const pos = this.freeCustomPos(x, r.y, 288, 374, 'shot:' + shot.id);
        this.canvas.positions = { ...this.canvas.positions, ['shot:' + shot.id]: pos };
        const from = menu.side === 'left' ? 'shot:' + shot.id : menu.key;
        const to = menu.side === 'left' ? menu.key : 'shot:' + shot.id;
        this.canvas.links = [...this.canvas.links, {
          id: 'l_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          from, to
        }];
        this.saveCanvasState();
        const idx = this.project.shots.findIndex((s) => s.id === shot.id);
        this.openComposer(shot, idx);
        this.notice = linkMsg || '已添加视频镜头';
      } catch (e) {
        this.err = e.message;
        this.notice = '';
      }
    },
    onCustomNodeClick(n) {
      if (!n) return;
      // 拖节点松手时浏览器还会补一个 click,别让它顺手把面板弹出来
      if (Date.now() - (this.canvas.lastDragAt || 0) < 250) return;
      if (n.type === 'image') this.openImageComposer(n);
      else if (n.type === 'threeview' || n.type === 'personview') this.openThreeComposer(n);
    },
    /* ---------- 三视图节点 ---------- */
    openThreeComposer(n) {
      if (!n) return;
      if (n.type === 'personview') {
        if (!n.opts) n.opts = { mode: 'person', person: '', split: false, prompt: '' };
        n.opts.mode = 'person';
        if (n.opts.person === undefined) n.opts.person = '';
        if (n.opts.split === undefined) n.opts.split = false;
      } else if (!n.opts) {
        n.opts = { source: 'garment', subject: 'mannequin', full_body: false, head: true, per_piece: false, split: false, prompt: '' };
      }
      if (n.opts.full_body === undefined) n.opts.full_body = false;
      if (n.opts.head === undefined) n.opts.head = true;
      this.composer.open = false;
      this.customComposer.open = false;
      this.threeComposer = {
        open: true, id: n.id, busy: ['queued', 'running'].includes(n.status),
        err: n.error || '', message: n.message || ''
      };
      if (['queued', 'running'].includes(n.status)) this.pollThreeView(n.id);
    },
    async uploadThreeSource(ev) {
      const files = Array.from(ev.target.files || []);
      ev.target.value = '';
      const n = this.threeComposerNode;
      if (!n || !files.length) return;
      this.threeUploading = true;
      this.threeComposer.err = '';
      try {
        for (const f of files) {
          const form = new FormData();
          form.append('file', f);
          form.append('category', 'prop');
          const res = await req(`/api/projects/${this.project.id}/canvas/upload`, { method: 'POST', form });
          if (res && res.url) {
            const imgs = [...(n.images || [])];
            if (!imgs.includes(res.url)) imgs.push(res.url);
            n.images = imgs.slice(-(n.type === 'personview' ? 2 : 3));
          }
        }
        this.saveCanvasState();
      } catch (e) {
        this.threeComposer.err = e.message;
      } finally {
        this.threeUploading = false;
      }
    },
    removeThreeSource(i) {
      const n = this.threeComposerNode;
      if (!n) return;
      const imgs = [...(n.images || [])];
      imgs.splice(i, 1);
      n.images = imgs;
      this.saveCanvasState();
    },
    /** 人物三视图:图1(人物照片)单独存,不混在服装列表里 */
    async uploadPersonSource(ev) {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      const n = this.threeComposerNode;
      if (!n || !file) return;
      this.threeUploading = true;
      this.threeComposer.err = '';
      try {
        const form = new FormData();
        form.append('file', file);
        form.append('category', 'character');
        const res = await req(`/api/projects/${this.project.id}/canvas/upload`, { method: 'POST', form });
        if (res && res.url) {
          n.opts.person = res.url;
          this.saveCanvasState();
        }
      } catch (e) {
        this.threeComposer.err = e.message;
      } finally {
        this.threeUploading = false;
      }
    },
    removePersonSource() {
      const n = this.threeComposerNode;
      if (!n) return;
      n.opts.person = '';
      this.saveCanvasState();
    },
    cycleThreeOutput(n, delta) {
      const len = (n && n.outputs || []).length;
      if (!len) return;
      n.outputIndex = ((Number(n.outputIndex) || 0) + delta + len) % len;
      this.saveCanvasStateSoon();
    },
    /** 节点底部「生成」:不用打开面板,直接按当前设置跑 */
    startThreeFromNode(n) {
      if (!n) return;
      this.threeComposer = { open: false, id: n.id, busy: false, err: '', message: '' };
      this.startThreeView();
    },
    async startThreeView() {
      const n = this.threeComposerNode;
      if (!n || this.threeComposer.busy) return;
      if (n.type === 'personview') {
        if (!(n.opts && n.opts.person)) {
          this.threeComposer.err = '先上传一张人物的照片（脸要清楚）';
          return;
        }
        if (!(n.images || []).length) {
          this.threeComposer.err = '再加至少一件要穿的衣服';
          return;
        }
      } else if (!(n.images || []).length) {
        this.threeComposer.err = '先上传图片，或从别的节点连线接一张进来';
        return;
      }
      this.threeComposer.err = '';
      this.threeComposer.message = '提交中…';
      try {
        const res = await req(`/api/projects/${this.project.id}/canvas/threeview/start`, {
          method: 'POST', body: { node_id: n.id }
        });
        n.status = res.status || 'queued';
        n.message = res.message || '排队中…';
        n.error = '';
        n.outputs = [];
        this.threeComposer.busy = true;
        this.threeComposer.message = n.message;
        this.saveCanvasState();
        this.pollThreeView(n.id);
      } catch (e) {
        this.threeComposer.err = e.message;
        this.threeComposer.busy = false;
      }
    },
    async pollThreeView(id) {
      if (!this.project || !id || this.threePoll[id]) return;
      this.threePoll[id] = true;
      try {
        for (let i = 0; i < 600; i += 1) {
          const n = this.canvas.customNodes.find((x) => x.id === id);
          if (!n) return;
          let res;
          try {
            res = await req(`/api/projects/${this.project.id}/canvas/threeview/status?node_id=${encodeURIComponent(id)}`);
          } catch (e) {
            n.status = 'failed'; n.error = e.message;
            if (this.threeComposer.open && this.threeComposer.id === id) {
              this.threeComposer.err = e.message; this.threeComposer.busy = false;
            }
            return;
          }
          n.status = res.status || n.status || '';
          n.message = res.message || '';
          n.error = res.error || '';
          if (res.outputs && res.outputs.length) n.outputs = res.outputs;
          if (this.threeComposer.open && this.threeComposer.id === id) {
            this.threeComposer.message = res.message || '';
            this.threeComposer.err = res.error || '';
            this.threeComposer.busy = ['queued', 'running'].includes(n.status);
          }
          if (n.status === 'done') {
            this.notice = `三视图生成完成（${(n.outputs || []).length} 张）`;
            await this.saveCanvasState();
            return;
          }
          if (n.status === 'failed') {
            await this.saveCanvasState();
            return;
          }
          await new Promise((r) => setTimeout(r, 3000));
        }
      } finally {
        delete this.threePoll[id];
      }
    },
    openImageComposer(n) {
      if (!n) return;
      this.composer.open = false;
      this.threeComposer.open = false;
      this.customComposer = {
        open: true, id: n.id, prompt: n.prompt || '',
        aspect: n.aspect || '16:9', resolution: n.resolution || '2K',
        count: 1, busy: false, err: ''
      };
    },
    async generateImageNode() {
      const cc = this.customComposer;
      const n = this.customComposerNode;
      if (!cc.open || !n || !cc.prompt.trim() || cc.busy || !this.project) return;
      cc.busy = true;
      cc.err = '';
      try {
        const res = await req(`/api/projects/${this.project.id}/canvas/image`, {
          method: 'POST',
          body: {
            prompt: cc.prompt.trim(),
            aspect: cc.aspect,
            resolution: cc.resolution,
            count: Number(cc.count) || 1
          }
        });
        if (res && res.images && res.images.length) {
          n.images = res.images;
          n.imageIndex = 0;
          n.url = res.images[0];
          n.prompt = cc.prompt.trim();
          n.aspect = cc.aspect;
          n.resolution = cc.resolution;
          this.saveCanvasState();
          this.notice = '图片已生成';
        }
      } catch (e) { cc.err = e.message }
      finally { cc.busy = false }
    },
    cycleNodeImage(n, delta) {
      if (!n || !n.images || !n.images.length) return;
      const len = n.images.length;
      n.imageIndex = ((Number(n.imageIndex) || 0) + delta + len) % len;
      n.url = n.images[n.imageIndex];
      this.saveCanvasStateSoon();
    },
    /* ---------- 图片节点:局部修理(涂抹 -> 只重绘涂抹区域) ---------- */
    openRepair() {
      const n = this.customComposerNode;
      if (!n) return;
      const url = ((n.images || [])[n.imageIndex || 0]) || n.url || '';
      if (!url) { this.customComposer.err = '先给这个节点一张图，再局部修理'; return; }
      this.repair = {
        open: true, id: n.id, busy: false, err: '', prompt: '', steps: 28, kind: '',
        brush: this.repair.brush || 34, erasing: false, hasMask: false, history: [], drawing: false
      };
      this.$nextTick(() => this.initRepairCanvas());
    },
    initRepairCanvas() {
      const img = this.$refs.repairImg;
      const cv = this.$refs.repairCanvas;
      if (!img || !cv) return;
      const fit = () => {
        const r = img.getBoundingClientRect();
        if (!r.width || !r.height) return;
        cv.width = Math.max(2, Math.round(r.width * 2));
        cv.height = Math.max(2, Math.round(r.height * 2));
        cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
        this.repair.hasMask = false;
        this.repair.history = [];
      };
      if (img.complete && img.naturalWidth) fit();
      else img.onload = fit;
    },
    repairPoint(ev, cv) {
      const r = cv.getBoundingClientRect();
      return {
        x: (ev.clientX - r.left) / Math.max(1, r.width) * cv.width,
        y: (ev.clientY - r.top) / Math.max(1, r.height) * cv.height
      };
    },
    repairDown(ev) {
      if (this.repair.busy) return;
      if (ev.button !== undefined && ev.button !== 0) return;
      const cv = this.$refs.repairCanvas;
      if (!cv) return;
      ev.preventDefault();
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
      this.repair.history.push(cv.toDataURL('image/png'));
      if (this.repair.history.length > 12) this.repair.history.shift();
      this.repair.drawing = true;
      const p = this.repairPoint(ev, cv);
      this.repair.last = p;
      this.repairStroke(p, p);
    },
    repairMove(ev) {
      if (!this.repair.drawing) return;
      const cv = this.$refs.repairCanvas;
      if (!cv) return;
      ev.preventDefault();
      const p = this.repairPoint(ev, cv);
      this.repairStroke(this.repair.last || p, p);
      this.repair.last = p;
    },
    repairUp() {
      if (!this.repair.drawing) return;
      this.repair.drawing = false;
      this.repair.last = null;
      this.repairSyncMask();
    },
    repairStroke(from, to) {
      const cv = this.$refs.repairCanvas;
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const r = cv.getBoundingClientRect();
      const w = Math.max(4, Number(this.repair.brush) * (cv.width / Math.max(1, r.width)));
      ctx.globalCompositeOperation = this.repair.erasing ? 'destination-out' : 'source-over';
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#fff';
      ctx.lineWidth = w;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
      if (from.x === to.x && from.y === to.y) {
        ctx.beginPath();
        ctx.arc(to.x, to.y, w / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    repairSyncMask() {
      const cv = this.$refs.repairCanvas;
      if (!cv) return;
      const data = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
      let hit = false;
      for (let i = 3; i < data.length; i += 28) {
        if (data[i] > 8) { hit = true; break; }
      }
      this.repair.hasMask = hit;
    },
    repairUndo() {
      const cv = this.$refs.repairCanvas;
      const hist = this.repair.history;
      if (!cv || !hist.length) return;
      const url = hist.pop();
      const img = new Image();
      img.onload = () => {
        const ctx = cv.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        this.repairSyncMask();
      };
      img.src = url;
    },
    repairClear() {
      const cv = this.$refs.repairCanvas;
      if (!cv) return;
      cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
      this.repair.hasMask = false;
      this.repair.history = [];
    },
    repairPreset(kind) {
      this.repair.kind = kind;
      this.repair.err = '';
      if (kind === 'remove') {
        this.repair.prompt = '去掉涂抹区域里的物体，用周围的背景自然补全，接缝和光影要自然。';
        this.repair.steps = 28;
      } else if (kind === 'retouch') {
        this.repair.prompt = '修掉涂抹区域的瑕疵：皮肤修干净、纹理自然，保持五官结构和原有光影不变。';
        this.repair.steps = 34;
      } else if (kind === 'recolor') {
        this.repair.prompt = '把涂抹区域换成：';
        this.repair.steps = 26;
      } else {
        this.repair.prompt = '';
        this.repair.steps = 26;
      }
      this.$nextTick(() => {
        const el = this.$refs.repairPrompt;
        if (el && (kind === 'recolor' || kind === 'edit')) el.focus();
      });
    },
    async runRepair() {
      const r = this.repair;
      const n = this.repairNode;
      const cv = this.$refs.repairCanvas;
      if (!r.open || !n || !cv || r.busy) return;
      if (!r.hasMask) { r.err = '先在图片上涂抹要修理的区域'; return; }
      if (!r.prompt.trim()) { r.err = '写一句要怎么改，或点上面的修理类型'; return; }
      r.busy = true;
      r.err = '';
      try {
        const res = await req(`/api/projects/${this.project.id}/canvas/inpaint`, {
          method: 'POST',
          body: {
            node_id: n.id,
            mask: cv.toDataURL('image/png'),
            prompt: r.prompt.trim(),
            steps: Number(r.steps) || 28
          }
        });
        const imgs = (res && res.images && res.images.length) ? res.images : [...(n.images || []), res.url];
        n.images = imgs;
        n.imageIndex = Math.max(0, imgs.indexOf(res.url));
        n.url = res.url;
        await this.saveCanvasState();
        r.open = false;
        this.notice = '局部修理完成，已生成新图';
      } catch (e) {
        r.err = e.message;
      } finally {
        r.busy = false;
      }
    },

    /* ---------- 静态图分镜(piece_style='static')「涂抹重渲」 ---------- */
    openStaticRerender(shot) {
      if (!shot || !shot.clip_url) return;
      this.staticRr = {
        open: true, shotId: shot.id, shot, busy: false, err: '',
        prompt: shot.prompt || '', brush: this.staticRr.brush || 34,

    initStaticRrCanvas() {

        cv.height = Math.max(2, Math.round(r.height * 2));

        this.staticRr.hasMask = false;

    },
    srPoint(ev, cv) {

        x: (ev.clientX - r.left) / Math.max(1, r.width) * cv.width,
        y: (ev.clientY - r.top) / Math.max(1, r.height) * cv.height
      };
    },
    srDown(ev) {
      if (this.staticRr.busy) return;
      if (ev.button !== undefined && ev.button !== 0) return;
      const cv = this.$refs.staticRrCanvas;
      if (!cv) return;
      ev.preventDefault();
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}

      if (this.staticRr.history.length > 12) this.staticRr.history.shift();
      this.staticRr.drawing = true;
      const p = this.srPoint(ev, cv);
      this.staticRr.last = p;
      this.srStroke(p, p);
    },
    srMove(ev) {
      if (!this.staticRr.drawing) return;
      const cv = this.$refs.staticRrCanvas;
      if (!cv) return;
      ev.preventDefault();
      const p = this.srPoint(ev, cv);
      this.srStroke(this.staticRr.last || p, p);
      this.staticRr.last = p;
    },
    srUp() {
      if (!this.staticRr.drawing) return;
      this.staticRr.drawing = false;
      this.staticRr.last = null;

    srStroke(from, to) {
